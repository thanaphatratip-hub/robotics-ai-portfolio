  /* ============================== PAGES ============================== */
  /* ============================== FORECAST ENGINE ============================== */
  // Ported verbatim (logic untouched) from Forecast_Page_Addon_for_Friend.txt — a friend-authored
  // addon module, not a method chosen by this session. It computes a 3-month weighted-moving-average
  // (WMA) demand forecast per coil spec (thickness+color) and per SKU, an ABC/Pareto classification
  // (80% / 95% cumulative-revenue cutoffs), and a dead-stock flag (no sales in >= 60 days) — see
  // docs/schema.md §2.8 for the resulting shapes and docs/changelog.md's Ver3→Ver4 entry for how this
  // relates to (and differs from) prd.md's original, more elaborate forecast spec (seasonal index,
  // MAPE, hit-target likelihood) — that spec is not implemented; this simpler addon replaces it here.
  function computeWmaDemand(historyQtys, weights) {
    weights = weights || [0.50, 0.30, 0.20];
    if (!historyQtys || !historyQtys.length) return 0;
    if (historyQtys.length === 1) return historyQtys[0];
    if (historyQtys.length === 2) return (historyQtys[0] * 0.65) + (historyQtys[1] * 0.35);
    return (historyQtys[0] * weights[0]) + (historyQtys[1] * weights[1]) + (historyQtys[2] * weights[2]);
  }

  function calcStdDev(values) {
    if (!values || values.length < 2) return 0;
    const mean = values.reduce((a, b) => a + b, 0) / values.length;
    const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (values.length - 1);
    return Math.sqrt(variance);
  }

  function metersToCoilWeight(meters, thicknessMm, widthM, density) {
    widthM = widthM || 0.914;
    density = density || 7850;
    const t0 = parseFloat(thicknessMm) || 0.30;
    const tMeters = t0 * 1e-3;
    const kg = meters * widthM * tMeters * density;
    const tons = kg / 1000;
    const coils = tons / 3.5;
    return { kg: Math.round(kg), tons: Number(tons.toFixed(2)), coils: Number(coils.toFixed(1)) };
  }

  function cleanProductDesc(rawDesc) {
    if (!rawDesc) return '';
    let d = rawDesc.replace(/\u00a0/g, ' ').trim();
    // 1. If description contains thickness pattern followed by slash and order-cut length/sheet count:
    // e.g. "0.30(มอก.)/6.00ม", "0.35(B)/1.", "0.35/4.75ม/32ผ", "0.30/3.10ม/", "0.30/3.", "0.30/1"
    const thMatch = d.match(/^(.*?\b0\.\d{2}(?:\s*\([^\)]+\))?)\s*\/(?:.*)$/);
    if (thMatch) {
      return thMatch[1].trim();
    }
    // 2. Otherwise strip trailing cut length patterns e.g. /1.83ม, /3.10ม/4ผ, /1., /2., /1, /32ผ
    let prev = '';
    while (prev !== d) {
      prev = d;
      d = d.replace(/\/\s*\d+(\.\d*)?([มผชเส้นชิ้น]+(\/\d+([มผชเส้นชิ้น]+)?)?)?\s*$/i, '');
      d = d.replace(/\/\s*\d+(\.\d*)?[มผชเส้นชิ้น]*\s*$/i, '');
      d = d.replace(/[\/\.\s]+$/g, '');
    }
    return d.replace(/\s+/g, ' ').trim();
  }

  function computeProductDemandForecast(allPeriods, targetKey, options) {
    options = options || {};
    const bufferPct = (options.bufferPct !== undefined ? options.bufferPct : 0) / 100;

    const validPeriods = (allPeriods || []).filter(p => !isCombinedScope(p.key)).sort((a, b) => a.key < b.key ? -1 : 1);
    if (!validPeriods.length) return { coils: [], accessories: [], deadStock: [], summary: {} };

    let targetIdx = validPeriods.findIndex(p => p.key === targetKey);
    if (targetIdx === -1) targetIdx = validPeriods.length - 1;

    const m3Periods = [];
    for (let i = 0; i < 3; i++) {
      const idx = targetIdx - i;
      if (idx >= 0) m3Periods.push(validPeriods[idx]);
    }
    const mLabels = m3Periods.map(p => p.key);

    let maxDateIso = '';
    validPeriods.forEach(p => {
      p.invoices.forEach(inv => { if (inv.date && inv.date > maxDateIso) maxDateIso = inv.date; });
    });
    const maxDateTime = maxDateIso ? new Date(maxDateIso + 'T00:00:00').getTime() : Date.now();

    const coilMap = new Map();
    const skuMap = new Map();

    validPeriods.forEach((period, pIdx) => {
      const m3Idx = m3Periods.indexOf(period);

      (period.lineItems || []).forEach(li => {
        const th = thicknessOf(li.description);
        const detectedColor = colorOf(li.description);
        const cleanedDesc = cleanProductDesc(li.description);
        const col = detectedColor || (cleanedDesc || (li.description ? li.description.slice(0, 40) : t('other')));
        const qty = Number(li.qty) || 0;
        const amount = Number(li.amount) || 0;

        if (th) {
          // Grouping key: SKU code + color, whenever a SKU exists. A SKU is the stable product
          // identity, but the SAME profile SKU is genuinely re-sold in every stock color (factory
          // operations don't mint a new code per color) — BUG FIX (external audit #6, 2026-09-23):
          // grouping by SKU alone used to fold every color into one forecast row, permanently locked
          // to whichever color happened to sell first (`!upgrade.colorDetected` only ever let the
          // FIRST detected color stick). Verified against the real data this wasn't a rare edge case:
          // 8 real SKUs span multiple colors, one (13-201) spans 9 distinct colors merged into a
          // single row — meaning that row's recommended reorder quantity was the SUM of all 9
          // colors' demand, attributed to just one. Undetected-color items (col falls back to a
          // cleaned description) still group together under that shared fallback, same as before.
          const coilKey = li.skuCode ? (th + ' mm · SKU:' + li.skuCode + ' · ' + col) : (cleanedDesc || (th + ' mm · ' + col));
          if (!coilMap.has(coilKey)) {
            coilMap.set(coilKey, {
              id: coilKey, sku: li.skuCode || '—', thickness: th, color: col, colorDetected: !!detectedColor,
              nameCounts: new Map(),
              totalRevenue: 0, totalMeters: 0,
              mQtys: [0, 0, 0],
              lastDate: li.date || period.dateTo || '',
            });
          } else {
            const upgrade = coilMap.get(coilKey);
            if (li.skuCode && (!upgrade.sku || upgrade.sku === '—')) upgrade.sku = li.skuCode;
          }
          const cEntry = coilMap.get(coilKey);
          cEntry.totalRevenue += amount;
          cEntry.totalMeters += qty;
          if (cleanedDesc) {
            const weight = cleanedDesc.startsWith('ลอน') ? 2 : 1;
            cEntry.nameCounts.set(cleanedDesc, (cEntry.nameCounts.get(cleanedDesc) || 0) + weight);
          }
          if (li.date && li.date > cEntry.lastDate) cEntry.lastDate = li.date;
          if (m3Idx !== -1) cEntry.mQtys[m3Idx] += qty;
        }

        const sku = li.skuCode || (cleanedDesc || (li.description ? li.description.slice(0, 30) : 'Unknown'));
        if (!skuMap.has(sku)) {
          skuMap.set(sku, {
            sku: sku, description: cleanedDesc || li.description || sku, category: li.category || t('catOther'),
            descCounts: new Map(),
            unit: li.unit || '', totalRevenue: 0, totalQty: 0,
            mQtys: [0, 0, 0],
            lastDate: li.date || period.dateTo || '',
            isCoilItem: !!th,
          });
        }
        const sEntry = skuMap.get(sku);
        sEntry.totalRevenue += amount;
        sEntry.totalQty += qty;
        if (cleanedDesc) {
          sEntry.descCounts.set(cleanedDesc, (sEntry.descCounts.get(cleanedDesc) || 0) + 1);
        }
        if (li.date && li.date > sEntry.lastDate) sEntry.lastDate = li.date;
        if (m3Idx !== -1) sEntry.mQtys[m3Idx] += qty;
      });
    });

    // BUG FIX (external audit #12, 2026-09-23): 'idx === 0 ||' guarantees the single top item is
    // always Class A. Without it, a #1 item whose OWN share already exceeds 80% (pct > 0.80 on the
    // very first iteration) landed in Class B, and since every classic ABC/Pareto analysis expects
    // at least one Class A item by definition, that read as "we have no best-sellers" — wrong on its
    // face. Doesn't currently fire on the real data (checked: top coil is 7% of coil revenue, top
    // SKU 17% of SKU revenue, nowhere near 80% alone), but a single dominant product is exactly the
    // shape of business this classification exists to highlight, so it's worth guaranteeing.
    const coilList = Array.from(coilMap.values()).sort((a, b) => b.totalRevenue - a.totalRevenue);
    const totalCoilRev = coilList.reduce((acc, c) => acc + c.totalRevenue, 0);
    let cumCoilRev = 0;
    coilList.forEach((c, idx) => {
      cumCoilRev += c.totalRevenue;
      const pct = totalCoilRev > 0 ? (cumCoilRev / totalCoilRev) : 1;
      c.abc = (idx === 0 || pct <= 0.80) ? 'A' : (pct <= 0.95 ? 'B' : 'C');
    });

    const skuList = Array.from(skuMap.values()).sort((a, b) => b.totalRevenue - a.totalRevenue);
    const totalSkuRev = skuList.reduce((acc, s) => acc + s.totalRevenue, 0);
    let cumSkuRev = 0;
    skuList.forEach((s, idx) => {
      cumSkuRev += s.totalRevenue;
      const pct = totalSkuRev > 0 ? (cumSkuRev / totalSkuRev) : 1;
      s.abc = (idx === 0 || pct <= 0.80) ? 'A' : (pct <= 0.95 ? 'B' : 'C');
    });

    const coilResults = coilList.map(c => {
      // BUG FIX (external audit #11, 2026-09-23): c.mQtys is always a fixed 3-slot array (padded
      // with 0s for months that were never loaded, not just months with zero sales), so
      // computeWmaDemand() always received a length-3 array and its own length===1/length===2
      // special cases — written to handle exactly this — could never run. An item with only 1
      // month of real history got `(qty*0.50)+(0*0.30)+(0*0.20)`, silently recommending half of
      // what it should. Slicing to m3Periods.length (how many of the 3 target months actually exist
      // in the loaded data) restores the intended branching. Confirmed against the real data this
      // wasn't an edge case: 172 of 394 coil forecasts (44%) have fewer than 3 loaded months among
      // their most recent 3 and were affected.
      const baseForecast = Math.round(computeWmaDemand(c.mQtys.slice(0, m3Periods.length)));
      const adjForecast = baseForecast;
      const safetyBuffer = Math.round(baseForecast * bufferPct);
      const recommendedQty = baseForecast + safetyBuffer;
      const weight = metersToCoilWeight(recommendedQty, c.thickness);

      const prevAvg = (c.mQtys[1] + c.mQtys[2]) / 2;
      let momentum = 'steady';
      // BUG FIX (external audit #13, 2026-09-23): '< c.mQtys[1]' (strictly less than) excluded the
      // "already flat at zero" case — 2 consecutive dead months (mQtys[0]===mQtys[1]===0) failed
      // `0 < 0`, so a product that collapsed to zero sales fell through to 'steady' instead of
      // 'fading'. '<=' still requires the current month be no higher than the prior one (a real
      // uptick from a low base still reads 'steady', not 'fading'), but now also catches "stayed at
      // zero" as the continuation of a fade rather than mislabeling it a stable pattern.
      if (c.mQtys[0] >= prevAvg * 1.25 && c.mQtys[0] > 200) momentum = 'rising';
      else if (c.mQtys[0] <= prevAvg * 0.75 && c.mQtys[0] <= c.mQtys[1]) momentum = 'fading';

      const itemDateTime = c.lastDate ? new Date(c.lastDate + 'T00:00:00').getTime() : maxDateTime;
      const daysInactive = Math.max(0, Math.floor((maxDateTime - itemDateTime) / (24 * 3600 * 1000)));

      const avgPrice = c.totalMeters > 0 ? (c.totalRevenue / c.totalMeters) : 0;
      const projectedRevenue = Math.round(recommendedQty * avgPrice);

      let dominantName = '';
      if (c.nameCounts && c.nameCounts.size > 0) {
        dominantName = Array.from(c.nameCounts.entries()).sort((a, b) => b[1] - a[1])[0][0];
      }
      if (!dominantName) {
        dominantName = c.sku && c.sku !== '—' ? c.sku : (c.thickness + ' mm · ' + (c.colorDetected === false ? c.color : colorLabel(c.color)));
      }

      return {
        id: c.id, sku: c.sku || '—', name: dominantName, thickness: c.thickness, color: c.color, colorDetected: c.colorDetected, abc: c.abc,
        mQtys: c.mQtys, baseForecast, adjForecast, safetyBuffer, recommendedQty,
        weightTons: weight.tons, coils: weight.coils, momentum, daysInactive,
        lastDate: c.lastDate, totalRevenue: c.totalRevenue, totalMeters: c.totalMeters,
        avgPrice: Math.round(avgPrice), projectedRevenue: projectedRevenue,
      };
    });

    const skuResults = skuList.map(s => {
      // Same two fixes as the coil forecast above (external audit #11/#13): slice to the months
      // that actually exist before WMA-weighting, and allow "still at zero" to count as fading.
      const baseForecast = Math.round(computeWmaDemand(s.mQtys.slice(0, m3Periods.length)));
      const adjForecast = baseForecast;
      const safetyBuffer = Math.round(baseForecast * bufferPct);
      const recommendedQty = baseForecast + safetyBuffer;

      const prevAvg = (s.mQtys[1] + s.mQtys[2]) / 2;
      let momentum = 'steady';
      if (s.mQtys[0] >= prevAvg * 1.25 && s.mQtys[0] > 20) momentum = 'rising';
      else if (s.mQtys[0] <= prevAvg * 0.75 && s.mQtys[0] <= s.mQtys[1]) momentum = 'fading';

      const itemDateTime = s.lastDate ? new Date(s.lastDate + 'T00:00:00').getTime() : maxDateTime;
      const daysInactive = Math.max(0, Math.floor((maxDateTime - itemDateTime) / (24 * 3600 * 1000)));

      const avgPrice = s.totalQty > 0 ? (s.totalRevenue / s.totalQty) : 0;
      const projectedRevenue = Math.round(recommendedQty * avgPrice);

      let dominantDesc = s.description;
      if (s.descCounts && s.descCounts.size > 0) {
        dominantDesc = Array.from(s.descCounts.entries()).sort((a, b) => b[1] - a[1])[0][0];
      }

      return {
        id: (s.sku || '?') + '||' + (dominantDesc || s.description),
        sku: s.sku, description: dominantDesc || s.description, category: s.category, unit: s.unit,
        abc: s.abc, mQtys: s.mQtys, baseForecast, adjForecast, safetyBuffer, recommendedQty,
        momentum, daysInactive, lastDate: s.lastDate, totalRevenue: s.totalRevenue, totalQty: s.totalQty,
        isCoilItem: s.isCoilItem,
        avgPrice: Math.round(avgPrice), projectedRevenue: projectedRevenue,
      };
    });

    const deadStock = skuResults.filter(s => s.daysInactive >= 60).sort((a, b) => b.daysInactive - a.daysInactive);

    const totalCoilMeters = coilResults.reduce((acc, c) => acc + c.recommendedQty, 0);
    const totalCoilTons = coilResults.reduce((acc, c) => acc + c.weightTons, 0);
    const totalCoilRolls = coilResults.reduce((acc, c) => acc + c.coils, 0);

    return {
      coils: coilResults,
      accessories: skuResults,
      deadStock: deadStock,
      mLabels: mLabels,
      summary: {
        totalCoilMeters,
        totalCoilTons: Number(totalCoilTons.toFixed(1)),
        totalCoilRolls: Math.ceil(totalCoilRolls),
        deadStockCount: deadStock.length,
        gradeACount: coilResults.filter(c => c.abc === 'A').length,
      }
    };
  }

  function computeBacktestAccuracy(allPeriods) {
    const valid = (allPeriods || []).filter(p => p.key && p.key !== 'ALL' && !p.key.includes('_') && !isCombinedScope(p.key)).sort((a, b) => a.key < b.key ? -1 : 1);
    if (valid.length < 4) return { available: false, reason: 'need_4_months' };

    const monthlyData = valid.map(p => {
      let roofMeters = 0;
      let hwRevenue = 0;
      let hwQty = 0;
      (p.lineItems || []).forEach(li => {
        const isRoof = !!(li.description || '').match(/0\.\d{2}/);
        const qty = Number(li.qty) || 0;
        const amount = Number(li.amount) || 0;
        if (isRoof) {
          roofMeters += qty;
        } else {
          hwRevenue += amount;
          hwQty += qty;
        }
      });
      return { key: p.key, roofMeters, hwRevenue, hwQty };
    });

    function runSeries(getter) {
      const rows = [];
      const mapes = [];
      for (let i = 3; i < monthlyData.length; i++) {
        const mKey = monthlyData[i].key;
        const actual = getter(monthlyData[i]);
        const m1 = getter(monthlyData[i - 1]);
        const m2 = getter(monthlyData[i - 2]);
        const m3 = getter(monthlyData[i - 3]);
        const forecast = (m1 * 0.50) + (m2 * 0.30) + (m3 * 0.20);
        const diff = forecast - actual;
        // BUG FIX (external audit #14, 2026-09-23): a month with zero actual sales used to score
        // ape=0 unconditionally ("actual > 0 ? ... : 0"), i.e. a PERFECT 100% accuracy no matter how
        // large the forecast was — a forecast of 500 against 0 real sales is not a good forecast,
        // it's undefined percentage error (division by zero), not zero error. Excluded from the mean
        // instead of silently injecting a false 100% into it; the row itself is kept (so the month
        // still shows in the table) but flagged zeroActual so the UI can render it distinctly rather
        // than a misleadingly perfect green score.
        const zeroActual = actual === 0;
        const ape = zeroActual ? null : (Math.abs(diff) / actual) * 100;
        const accuracy = zeroActual ? null : Math.max(0, 100 - ape);
        if (!zeroActual) mapes.push(ape);

        let noteKey = 'fcBacktestNormalNote';
        if (zeroActual) noteKey = 'fcBacktestZeroActualNote';
        else if (mKey.endsWith('-04')) noteKey = 'fcBacktestAprilNote';
        else if (ape <= 10) noteKey = 'fcBacktestHighAccNote';
        else if (mKey.endsWith('-08') || mKey.endsWith('-09')) noteKey = 'fcBacktestRainNote';

        rows.push({
          monthKey: mKey,
          actual: Math.round(actual),
          forecast: Math.round(forecast),
          diff: Math.round(diff),
          mape: zeroActual ? null : Number(ape.toFixed(1)),
          accuracy: zeroActual ? null : Number(accuracy.toFixed(1)),
          zeroActual: zeroActual,
          noteKey: noteKey
        });
      }
      const meanMape = mapes.length ? Number((mapes.reduce((a, b) => a + b, 0) / mapes.length).toFixed(1)) : 0;
      // Clamped like the per-row accuracy above (Math.max(0, 100-ape)) — meanAcc used to be derived
      // independently from the unclamped mapes average, so a bad-enough mean MAPE (>100) could
      // still show a negative "accuracy" percentage in the summary tile, and that tile's color/badge
      // were hardcoded green regardless of value (external audit #14's "negative % in a green badge").
      const meanAcc = Math.max(0, Number((100 - meanMape).toFixed(1)));
      return { rows, meanMape, meanAcc };
    }

    return {
      available: true,
      totalMonthsTested: valid.length - 3,
      roof: runSeries(d => d.roofMeters),
      hardware: runSeries(d => d.hwRevenue)
    };
  }

  // Each page owns buildShell() (static skeleton + toolbar controls, rebuilt on language switch)
  // and render(period) (fills it with data). This is the same contract the multi-page build used
  // per HTML file — here all nine just live in one object instead of nine documents.
  const PAGES = {};

  PAGES.overview = {
    icon: 'grid', navKey: 'navOverview', secKey: 'secOverview',
    buildShell() {
      document.getElementById('page-overview').innerHTML =
        '<div class="panel-head"><h2>' + icon('grid') + ' ' + t('secOverview') + '</h2><div class="hint" id="overviewHint"></div></div>' +
        periodSelectRowHtml('overviewPeriodSelect') +
        '<div id="overviewBody"></div>';
      wirePeriodSelect('overviewPeriodSelect');
    },
    render(period) {
      const k = kpis(period.invoices, period.lineItems);
      const prev = prevPeriodOf(period.key);
      const prevK = prev ? kpis(prev.invoices, prev.lineItems) : null;
      const daily = dailySeries(period);
      const sparkColor = cssVar('--cat-1');
      const mom = monthOverMonth();
      const depReceived = depositsInRange(period.dateFrom, period.dateTo);
      const depReceivedTotal = depReceived.reduce((a, d) => a + (d.total || d.amount || 0), 0);

      function deltaHtml(cur, prevVal) {
        if (prevVal == null || !prevK) return '';
        const pct = prevVal ? ((cur - prevVal) / prevVal * 100) : 0;
        const cls = pct >= 0 ? 'up' : 'down';
        const arrow = pct >= 0 ? '↑' : '↓';
        return '<div class="delta ' + cls + '">' + arrow + ' ' + Math.abs(pct).toFixed(1) + '% ' + t('vs') + ' ' + (prev ? periodShortLabel(prev) : '') + '</div>';
      }

      const tiles = [
        { lbl: t('totalRevenue'), val: fmtBaht(k.revenue), delta: deltaHtml(k.revenue, prevK && prevK.revenue), spark: sparklineSvg(daily.map(d => d.revenue), 70, 30, sparkColor) },
        { lbl: t('totalInvoices'), val: fmtNum(k.count), delta: deltaHtml(k.count, prevK && prevK.count) },
        { lbl: t('avgOrderValue'), val: fmtBaht(k.aov), delta: deltaHtml(k.aov, prevK && prevK.aov) },
        { lbl: t('cashReceived'), val: fmtBaht(k.cash), sub: k.check ? (fmtBaht(k.check) + t('byCheck')) : t('allCashTransfer') },
        { lbl: t('depositsApplied'), val: fmtBaht(k.deposit), sub: t('offsetDeposits') },
        { lbl: t('vatAmount'), val: fmtBaht(k.vat), sub: k.vat ? t('vatIncluded') : t('noVatCharged') },
        { lbl: t('withholdingTax'), val: fmtBaht(k.wht), sub: k.wht ? t('withheldByCust') : t('noneWithheld') },
      ];
      // Part of Total Revenue (recognized) but not yet collected — was previously invisible on
      // Overview (only a per-row badge on Invoice Explorer), which made "why doesn't revenue equal
      // cash received" hard to answer at a glance. Positioned right after Cash Received so the two
      // "how was this revenue actually settled" figures sit together.
      const creditInvoices = period.invoices.filter(i => i.paymentType === 'credit');
      if (creditInvoices.length) {
        // BUG FIX (external audit #7, 2026-09-23): this used to sum invoice.total (net of VAT and
        // any deposit already applied against the invoice), while the Total Revenue tile right above
        // sums line items (gross delivered value — kpis()'s own documented basis, chosen specifically
        // because invoice.total under-counts orders with a deposit offset). Real credit-sales VAT is
        // ฿0 across the whole dataset, so in practice this was really the same deposit-offset gross/
        // net gap schema.md §6 Q7 already documents, just newly visible on this one tile. Switched to
        // the same line-item basis as every other revenue figure on this page.
        const creditInvNos = new Set(creditInvoices.map(i => i.invoiceNo));
        const creditRevenue = period.lineItems.filter(li => creditInvNos.has(li.invoiceNo)).reduce((a, li) => a + (li.amount || 0), 0);
        tiles.splice(4, 0, { lbl: t('creditSales'), val: fmtBaht(creditRevenue), sub: fmtNum(creditInvoices.length) + ' ' + t('creditSalesSub') });
      }
      // From the separate deposits report (schema.md's DepositRecord) — a different array
      // (STATE.deposits), parsed by a different function (parseDepositsReport), never merged with
      // RawInvoice.depositApplied above. schema.md §6 Q7 cross-checked them externally (2026-09-18,
      // real dataset): they reconcile once you account for deposits collected before this report's
      // date window and a few non-deposit reference numbers the regex also picks up — but the app
      // itself still doesn't do that reconciliation at runtime, so keep showing them side by side,
      // not combined into one figure.
      if (STATE.deposits.length) {
        tiles.push({ lbl: t('depositsReceived'), val: fmtBaht(depReceivedTotal), sub: fmtNum(depReceived.length) + ' · ' + t('depositsReceivedSub') });
      }

      // Feature: Separate Shipping, Handling & Service Revenue from core product sales
      const shippingLineItems = period.lineItems.filter(li => li.category === 'Shipping & Services');
      const shippingRevenue = shippingLineItems.reduce((a, li) => a + (li.amount || 0), 0);
      if (shippingRevenue > 0) {
        const trips = period.lineItems.filter(li => li.skuCode === '99-101').reduce((a, li) => a + (li.qty || 1), 0);
        const drums = period.lineItems.filter(li => (li.skuCode === '99-609' || (li.description || '').includes('ถังน้ำยา'))).reduce((a, li) => a + (li.qty || 0), 0);
        let subText = '';
        if (trips > 0 && drums > 0) {
          subText = Math.round(trips) + ' ' + t('tripsWord') + ' · ' + Math.round(drums) + ' ' + t('drumsWord');
        } else if (trips > 0) {
          subText = Math.round(trips) + ' ' + t('tripsWord') + ' · ' + t('shippingTileSub');
        } else {
          subText = t('shippingTileSub');
        }
        tiles.push({ lbl: t('shippingServicesRevenue'), val: fmtBaht(shippingRevenue), sub: subText });
      }

      // Monthly sales target (2026-09-24, direct request — reintroduces prd.md Feature 3 / schema.md
      // §2.4's SalesTarget, removed entirely in Session 6): editable only for a single-month scope,
      // same reasoning Session 4 already worked out for this exact feature — "actual vs. target"
      // only has one unambiguous meaning for one real month. A combined scope (ALL/Y:/YR:/DR:) shows
      // a read-only sum of whichever included months actually have a target set, with a note
      // pointing at how to edit, rather than either hiding the card or inventing a combined-target
      // input that couldn't map back to any one month anyway.
      const canTarget = currentPerms().canSetTarget;
      const combinedScope = isCombinedScope(period.key);
      let targetSection = '';
      function targetProgressHtml(actual, targetAmt) {
        const pct = targetAmt ? (actual / targetAmt * 100) : 0;
        const diff = actual - targetAmt;
        const cls = diff >= 0 ? 'up' : 'down';
        return '<div style="font-size:.95rem; margin-bottom:10px;"><b class="tabular">' + fmtBaht(actual) + '</b> <span style="color:var(--muted);">' + t('targetOfTarget') + ' ' + fmtBaht(targetAmt) + '</span></div>' +
          '<div class="mom-track" style="height:14px; margin-bottom:10px;"><div class="mom-fill" style="width:' + Math.min(Math.max(pct, 3), 100).toFixed(1) + '%; background:' + (diff >= 0 ? cssVar('--good') : cssVar('--cat-1')) + '"></div></div>' +
          '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">' +
          '<span class="growth-badge ' + cls + '">' + (diff >= 0 ? '↑ +' : '↓ ') + Math.abs(pct - 100).toFixed(1) + '%</span>' +
          '<span style="font-size:.82rem; color:var(--muted);">' + fmtBaht(Math.abs(diff)) + ' ' + (diff >= 0 ? t('targetOverTarget') : t('targetMoreToReach')) + '</span>' +
          '</div>';
      }
      if (!combinedScope) {
        const tgt = STATE.targets[period.key];
        if (STATE.targetEditing) {
          targetSection = '<div class="card" style="margin-top:28px;" id="targetCard">' +
            '<div class="panel-head"><h2>' + icon('flag', 18) + ' ' + t('targetSecTitle') + '</h2></div>' +
            '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">' +
            '<input type="number" id="targetInput" min="1" step="1" placeholder="' + t('targetAmountPlaceholder') + '" style="width:200px;" value="' + (tgt ? tgt.amount : '') + '">' +
            '<button class="btn primary" id="targetSaveBtn">' + t('targetSaveBtn') + '</button>' +
            '<button class="btn" id="targetCancelBtn">' + t('targetCancelBtn') + '</button>' +
            '</div></div>';
        } else if (tgt) {
          // "Other information" beyond the bare percentage, per direct follow-up feedback that the
          // first version was too thin: (1) a pace projection — only meaningful for the single month
          // that's still actually in progress (the most recently loaded one, and only if its data
          // doesn't already run through the calendar month's last day) — extrapolates the current
          // run-rate to a full-month total, since "74% of target on day 20 of 31" and "74% of target
          // on day 30 of 31" mean very different things and a bare percentage can't tell them apart;
          // (2) how the previous month did against ITS OWN target, for trend context, reusing prevK/
          // prev already computed above; (3) who set this target and when, for accountability.
          let extraHtml = '';
          const spAllMonths = sortedPeriods();
          const isLatestMonth = spAllMonths.length > 0 && period.key === spAllMonths[spAllMonths.length - 1].key;
          if (isLatestMonth && period.dateTo) {
            const [py, pm] = period.key.split('-').map(Number);
            const daysInMonth = new Date(py, pm, 0).getDate();
            const dayOfMonth = parseInt(period.dateTo.slice(8, 10), 10);
            if (dayOfMonth > 0 && dayOfMonth < daysInMonth) {
              const projected = (k.revenue / dayOfMonth) * daysInMonth;
              const projectedPct = tgt.amount ? (projected / tgt.amount * 100) : 0;
              extraHtml += '<div style="font-size:.8rem; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">' +
                t('targetPaceLabel') + ' ' + dayOfMonth + ' ' + t('targetDaysElapsedOf') + ' ' + daysInMonth + '. ' +
                t('targetProjectedPrefix') + ' <b class="tabular" style="color:var(--ink);">' + fmtBaht(projected) + '</b> (' + projectedPct.toFixed(1) + '% ' + t('targetOfTarget') + ') ' + t('targetByMonthEnd') +
                '</div>';
            }
          }
          if (prev && STATE.targets[prev.key] && prevK) {
            const prevTgt = STATE.targets[prev.key];
            const prevPct = prevTgt.amount ? (prevK.revenue / prevTgt.amount * 100) : 0;
            extraHtml += '<div style="font-size:.8rem; color:var(--muted); margin-top:6px;">' +
              t('targetLastMonthPrefix') + ' ' + fmtBaht(prevK.revenue) + ' ' + t('targetOfTarget') + ' ' + fmtBaht(prevTgt.amount) + ' (' + prevPct.toFixed(1) + '%)' +
              '</div>';
          }
          extraHtml += '<div style="font-size:.74rem; color:var(--muted); margin-top:6px; opacity:.8;">' +
            t('targetSetByPrefix') + ' ' + esc(tgt.setBy || '—') + ' · ' + fmtDateShort(tgt.setAt ? tgt.setAt.slice(0, 10) : '') +
            '</div>';
          targetSection = '<div class="card" style="margin-top:28px;" id="targetCard">' +
            '<div class="panel-head"><h2>' + icon('flag', 18) + ' ' + t('targetSecTitle') + '</h2>' +
            (canTarget ? '<div class="toolbar no-print"><button class="btn" id="targetEditBtn" style="padding:5px 10px; font-size:.76rem;">' + t('targetEditBtn') + '</button><button class="btn" id="targetClearBtn" style="padding:5px 10px; font-size:.76rem;">' + t('targetClearBtn') + '</button></div>' : '') +
            '</div>' + targetProgressHtml(k.revenue, tgt.amount) + extraHtml + '</div>';
        } else {
          targetSection = '<div class="card" style="margin-top:28px;" id="targetCard">' +
            '<div class="panel-head"><h2>' + icon('flag', 18) + ' ' + t('targetSecTitle') + '</h2></div>' +
            '<div style="font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:12px; flex-wrap:wrap;">' +
            '<span>' + t('targetNotSetFor') + ' ' + esc(periodLabel(period)) + '.</span>' +
            (canTarget ? '<button class="btn primary" id="targetSetBtn" style="padding:5px 10px; font-size:.76rem;">' + t('targetSetBtn') + '</button>' : '') +
            '</div></div>';
        }
      } else {
        const inScope = monthsInScope(period.key);
        const withTargets = inScope.filter(p => STATE.targets[p.key]);
        if (withTargets.length) {
          const sumTarget = withTargets.reduce((s, p) => s + STATE.targets[p.key].amount, 0);
          // Actual compared against the sum covers only the months that actually HAVE a target set,
          // not every month in the combined scope — keeps the percentage apples-to-apples (a target
          // covering 2 of 9 loaded months shouldn't be measured against all 9 months' revenue).
          const actualForTargetMonths = withTargets.reduce((s, p) => s + kpis(p.invoices, p.lineItems).revenue, 0);
          targetSection = '<div class="card" style="margin-top:28px;" id="targetCard">' +

            '<div style="font-size:.78rem; color:var(--muted); margin-bottom:2px;">' + t('targetCombinedLabel') + ' — ' + t('targetCombinedSumOf') + ' ' + fmtNum(withTargets.length) + ' ' + t('targetMonthsSet') + '</div>' +

      // Merged in from the standalone MoM Growth page — same monthOverMonth() data the compact
      // summary cards above already use, just as a proportional bar chart instead of a KPI grid.
      // REDESIGNED (2026-09-24, direct feedback: "looks kinda boring") via the dataviz skill's
      // method: value label moved out of the bar into its own tabular column (was white text baked
      // into the fill, cramped against invoice count + growth badge in one box); bar thinned and

      // badge — the actual headline of this chart — stays directly visible, unchanged position.
      let momGrowthSection = '';
      const momMax = mom.length ? Math.max.apply(null, mom.map(m => m.revenue).concat(1)) : 1;

        momGrowthSection = '<div class="panel-head" style="margin-top:28px;"><h2>' + icon('history') + ' ' + t('secHistory') + '</h2><div class="hint">' + t('hintHistory') + '</div></div>' +

            const pct = momMax ? (m.revenue / momMax * 100) : 0;
            const isLatest = idx === mom.length - 1;
            const color = isLatest ? cssVar('--cat-1') : 'color-mix(in srgb, ' + cssVar('--cat-1') + ' 38%, ' + cssVar('--surface-2') + ')';
            let growthHtml = '<span class="mom-growth-spacer"></span>';
            if (idx > 0) {
              const prevM = mom[idx - 1];
              const pct2 = prevM.revenue ? ((m.revenue - prevM.revenue) / prevM.revenue * 100) : 0;
              growthHtml = '<span class="growth-badge ' + (pct2 >= 0 ? 'up' : 'down') + '">' + (pct2 >= 0 ? '↑ +' : '↓ ') + Math.abs(pct2).toFixed(1) + '%</span>';

              '<div class="mom-label">' + esc(m.label) + '</div>' +
              '<div class="mom-track"><div class="mom-fill" style="width:' + Math.max(pct, 3).toFixed(1) + '%; background:' + color + '"></div></div>' +
              '<div class="mom-val tabular">' + fmtBaht(m.revenue) + '</div>' +

              '</div>';

      const targetEditBtn = document.getElementById('targetEditBtn');

      const targetClearBtn = document.getElementById('targetClearBtn');

      const targetSaveBtn = document.getElementById('targetSaveBtn');

        setTarget(period.key, val);
        STATE.targetEditing = false;
        toast(t('targetSavedToast'));
        PAGES.overview.render(period);
      });
      const targetCancelBtn = document.getElementById('targetCancelBtn');
      if (targetCancelBtn) targetCancelBtn.addEventListener('click', () => { STATE.targetEditing = false; PAGES.overview.render(period); });
      const targetInputEl = document.getElementById('targetInput');
      if (targetInputEl) {
        targetInputEl.focus();
        targetInputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') targetSaveBtn.click(); else if (e.key === 'Escape') targetCancelBtn.click(); });
      }

      document.querySelectorAll('#overviewMomBody .momrow').forEach((el) => {
        const m = mom[+el.dataset.idx];
        el.addEventListener('mousemove', (evt) => {
          showTip('<div class="tt-title">' + esc(m.fullLabel) + '</div>' + fmtBaht(m.revenue) +

        });

      renderPieChart(document.getElementById('overviewSpChart'), spPieItems, {
        size: 320,

  };

      const others = sortedPeriods().filter(p => p.key !== period.key);
      const histAvg = others.length ? others.reduce((s, p) => s + kpis(p.invoices, p.lineItems).revenue, 0) / others.length : null;

        const cls = pct >= 0 ? 'up' : 'down';
        return '<div class="callout">' + icon('trend', 18) + '<div><div class="t">' + t(titleKey) + '</div><div class="d">' + fmtBaht(curVal) + ' ' + t('vs') + ' ' + fmtBaht(baseVal) + ' (' + baseLabel + ') — <span class="growth-badge ' + cls + '">' + (pct >= 0 ? '↑ +' : '↓ ') + Math.abs(pct).toFixed(1) + '%</span></div></div></div>';

        compareCallout('vsPrevMonth', k.revenue, prevK ? prevK.revenue : null, prev ? periodShortLabel(prev) : '') +

  // limited to the four preset values. Used by both Products' Top Products list and Customers' Top
  // Customers list, which each keep their own independent STATE field (topN / custTopN).
  function topNSelectRowHtml(selectId, inputId) {
    return '<div class="month-select-row"><span class="lbl">' + t('topN') + '</span>' +
      '<div class="select-wrap"><select id="' + selectId + '"><option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="custom">' + t('custom') + '</option></select></div>' +
      '<input type="number" id="' + inputId + '" min="1" step="1" placeholder="' + t('customTopNPlaceholder') + '" style="width:96px; display:none;">' +
      '</div>';
  }
  function wireTopNSelect(selectId, inputId, currentValue, onChange) {
    const sel = document.getElementById(selectId), inp = document.getElementById(inputId);
    const fixed = ['5', '10', '15', '20'];
    if (fixed.indexOf(String(currentValue)) !== -1) { sel.value = String(currentValue); }
    else { sel.value = 'custom'; inp.style.display = ''; inp.value = currentValue; }
    sel.addEventListener('change', () => {
      if (sel.value === 'custom') { inp.style.display = ''; if (!inp.value) inp.value = currentValue > 0 ? currentValue : ''; inp.focus(); inp.select(); }
      else { inp.style.display = 'none'; onChange(parseInt(sel.value, 10)); }
    });
    inp.addEventListener('input', debounce(() => {
      const n = parseInt(inp.value, 10);
      if (n >= 1) onChange(n);
    }, 250));
  }

          '<div class="tabular" style="width:70px; text-align:right;">' + (th.pct * 100).toFixed(1) + '%</div></div>';

        return '<div class="row" style="cursor:default;"><div class="lbl"><span class="name">' + esc(f.description) + '</span></div><div class="val tabular">' + fmtNum(f.qty) + '</div><div class="track"><div class="fill" style="width:100%; background:' + cssVar('--muted') + '"></div></div></div>';

      // top-N). Deliberately re-queried here with ignoreSearch (rather than reusing allProducts
      // above) and filtered by its own STATE.catalogSearch instead — the Top Products search box and
      // the catalog's search box are two independent controls over two different lists; without this
      // separation, typing in the Top Products box would silently also narrow the catalog table far
      // below it on the page, which would be confusing since nothing near the catalog explains why.
      // catalogAllProducts itself is never capped (see topProducts()); rendering 13,299 rows at once
      // doesn't scale, so only STATE.catalogLimit of the (searched+sorted) result render, with Show
      // more (+100) / Show all / Show less below — same incremental-reveal pattern as the Invoice
      // Explorer's invLimit.
      const catalogAllProducts = topProducts(filtered.lineItems, 'amount', null, { ignoreSearch: true });

        if (av < bv) return -1 * catDir; if (av > bv) return 1 * catDir; return 0;

      if (STATE.catalogSearch) {
        const cq = STATE.catalogSearch.toLowerCase();

      // because this table is paginated — table-layout:auto recomputes column widths from every
      // row's content, so revealing rows with longer descriptions/categories via Show more/Show
      // all shifted the widths (and therefore the text) of every already-visible column sideways.
      const catalogCols = [['sku', t('sku'), '10%'], ['description', t('description'), '30%'], ['category', t('category'), '15%'], ['thickness', t('thickness'), '8%'], ['color', t('color'), '12%'], ['qty', t('qty'), '9%'], ['revenue', t('revenue'), '16%']];
      const catalogHead = catalogCols.map(([key, label, width]) => {
        const arrow = catCol === key ? (catDir === 1 ? '▲' : '▼') : '';
        return '<th data-col="' + key + '" style="width:' + width + '" class="' + ((key === 'qty' || key === 'revenue') ? 'num' : '') + '">' + label + '<span class="sort-arrow">' + arrow + '</span></th>';
      }).join('');
      const catalogBtnsHtml =
        (catalogRows.length > catalogShown.length
          ? '<button class="btn" id="catalogShowMoreBtn" style="padding:4px 10px; font-size:.78rem;">' + t('showMore') + '</button>' +
            '<button class="btn" id="catalogShowAllBtn" style="padding:4px 10px; font-size:.78rem;">' + t('showAll') + ' (' + fmtNum(catalogRows.length) + ')</button>'
          : '') +
        (STATE.catalogLimit > CATALOG_LIMIT_DEFAULT
          ? '<button class="btn" id="catalogShowLessBtn" style="padding:4px 10px; font-size:.78rem;">' + t('showLess') + '</button>'
          : '');
      // Buttons live in their own container above the (fixed-height, internally-scrolling)
      // .tbl-wrap-fixed box — not inside it — so they're never affected by the table's row count
      // and the table's own outer size never changes when Show more/all/less is clicked.
      document.getElementById('catalogBtnsWrap').innerHTML =
        catalogBtnsHtml ? '<div style="padding:0 4px 10px; display:flex; gap:8px; flex-wrap:wrap;">' + catalogBtnsHtml + '</div>' : '';
      document.getElementById('catalogTableWrap').innerHTML =
        '<table class="data fixed-cols"><thead><tr>' + catalogHead + '</tr></thead><tbody>' +
        (catalogShown.length ? catalogShown.map((p, i) => '<tr class="inv-row" data-catidx="' + i + '"><td>' + esc(p.sku || '—') + '</td><td class="wrap">' + esc(p.description) + '</td><td>' + esc(categoryLabel(p.category)) + '</td><td>' + esc(p.thickness || '—') + '</td><td>' + esc(p.color ? colorLabel(p.color) : '—') + '</td><td class="num tabular">' + (p.qty ? fmtNum(p.qty) + (p.unit ? ' ' + p.unit : '') : '—') + '</td><td class="num tabular">' + fmtBaht(p.revenue) + '</td></tr>').join('')
          : '<tr><td colspan="7" class="empty-msg">' + t('noData') + '</td></tr>') +
        '</tbody></table>';
      document.querySelectorAll('#catalogTableWrap th[data-col]').forEach(th => {
        th.addEventListener('click', () => {
          const c = th.dataset.col;
          if (STATE.catalogSort.col === c) STATE.catalogSort.dir *= -1; else STATE.catalogSort = { col: c, dir: c === 'sku' || c === 'description' || c === 'category' ? 1 : -1 };
          saveUiState(); PAGES.products.render(period);
        });
      });
      // Feature request: rows in the Full Product Catalog (not just the Top Products bar list
      // above) should also jump to Invoice Explorer filtered to that product.
      document.querySelectorAll('#catalogTableWrap tr[data-catidx]').forEach(tr => {
        tr.addEventListener('click', () => {
          const p = catalogShown[+tr.dataset.catidx];
          goSearchInvoice(p.description);
          toast(t('searchingInvoices') + ' ' + p.description);
        });
      });
      const catalogShowMoreBtn = document.getElementById('catalogShowMoreBtn');
      if (catalogShowMoreBtn) catalogShowMoreBtn.addEventListener('click', () => { STATE.catalogLimit += 100; saveUiState(); PAGES.products.render(period); });
      const catalogShowAllBtn = document.getElementById('catalogShowAllBtn');
      if (catalogShowAllBtn) catalogShowAllBtn.addEventListener('click', () => { STATE.catalogLimit = catalogRows.length; saveUiState(); PAGES.products.render(period); });
      const catalogShowLessBtn = document.getElementById('catalogShowLessBtn');
      // No scrollIntoView here (there used to be one) — that was only needed back when this button
      // lived at the bottom of a long table, to bring the user back up after it collapsed. Now that
      // it's at the top (Session 21), the user is already there; forcing a scroll just caused an
      // unwanted little jump on every click.
      if (catalogShowLessBtn) catalogShowLessBtn.addEventListener('click', () => {
        STATE.catalogLimit = CATALOG_LIMIT_DEFAULT; saveUiState(); PAGES.products.render(period);
      });

      const slow = unsoldOrSlowProducts(filtered.lineItems, 10);
      document.getElementById('unsoldList').innerHTML = slow.length ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>' + t('sku') + '</th><th>' + t('description') + '</th><th class="num">' + t('currentPeriod') + '</th></tr></thead><tbody>' +
        slow.map(p => '<tr><td>' + esc(p.sku || '—') + '</td><td class="wrap">' + esc(p.description) + '</td><td class="num tabular">' + (p.currentRevenue ? fmtBaht(p.currentRevenue) : '<span style="color:var(--critical); font-weight:600;">' + t('noSalesThisPeriod') + '</span>') + '</td></tr>').join('') +
        '</tbody></table></div>' : '<div class="empty-msg">' + t('noData') + '</div>';
    },
  };

          '</tbody><tfoot style="border-top:2px solid var(--border); font-weight:600;"><tr><td>' + t('allCustomersTotal') + '</td><td class="num">' + fmtBaht(spInfo ? spInfo.revenue : 0) + '</td><td class="num">' + spInvoices.length + '</td></tr></tfoot></table></div>' +

          '<div class="tbl-wrap"><table class="drill-table"><thead><tr><th>' + t('description') + '</th><th class="num">' + t('qty') + '</th><th class="num">' + t('revenue') + '</th></tr></thead><tbody>' +
          topProds.map(p => '<tr><td>' + esc(p.desc) + '</td><td class="num">' + (p.qty ? fmtNum(p.qty) : '—') + '</td><td class="num">' + fmtBaht(p.amount) + '</td></tr>').join('') +

        const custShowAllBtn = document.getElementById('spCustShowAllBtn');
        if (custShowAllBtn) custShowAllBtn.addEventListener('click', () => { STATE.spDrillCustLimit = custSorted.length; saveUiState(); PAGES.salespeople.render(period); });
        const custShowLessBtn = document.getElementById('spCustShowLessBtn');
        if (custShowLessBtn) custShowLessBtn.addEventListener('click', () => { STATE.spDrillCustLimit = SP_DRILL_CUST_DEFAULT; saveUiState(); PAGES.salespeople.render(period); });
        const prodShowMoreBtn = document.getElementById('spProdShowMoreBtn');
        if (prodShowMoreBtn) prodShowMoreBtn.addEventListener('click', () => { STATE.spDrillProdLimit += 20; saveUiState(); PAGES.salespeople.render(period); });
        const prodShowAllBtn = document.getElementById('spProdShowAllBtn');

  PAGES.invoices = {
    icon: 'list', navKey: 'navInvoices', secKey: 'secInvoices',
    buildShell() {
      document.getElementById('page-invoices').innerHTML =
        '<div class="panel-head"><h2>' + icon('list') + ' ' + t('secInvoices') + '</h2></div>' +
        periodSelectRowHtml('invoicesPeriodSelect') +
        buildFilterBarHtml('invoicesSpFilter') +
        // Cash/credit were always both shown here with no way to isolate one; deposits weren't
        // shown at all (they're a structurally different record — no product line items, money
        // received in advance rather than for delivered goods — schema.md §5). Toggle-group matches
        // the existing theme/language toggle's look, but each button here toggles independently
        // rather than being mutually exclusive.
        '<div class="month-select-row no-print"><span class="lbl">' + t('showRecordTypes') + '</span>' +
        '<div class="toggle-group" id="invTypeToggle">' +
        '<button data-type="cash" class="' + (STATE.invTypeFilter.cash ? 'active' : '') + '">' + t('typeCashBtn') + '</button>' +

      wirePeriodSelect('invoicesPeriodSelect');

      input.value = STATE.invSearch || '';

        STATE.invSearch = e.target.value; STATE.invLimit = 60; saveUiState();
        const period = currentPeriod(); if (period) PAGES.invoices.render(period);
      }, 150));
      document.querySelectorAll('#invTypeToggle button').forEach(b => {
        b.addEventListener('click', () => {
          const type = b.dataset.type;
          STATE.invTypeFilter[type] = !STATE.invTypeFilter[type];
          b.classList.toggle('active', STATE.invTypeFilter[type]);
          STATE.invLimit = 60; saveUiState();
          const period = currentPeriod(); if (period) PAGES.invoices.render(period);
        });
      });
      wireFilterBar('invoicesSpFilter');

    render(period) {
      const filtered = applyFilter(period.invoices, period.lineItems);
      renderFilterBarOptions('invoicesSpFilter', applyFilter(period.invoices, period.lineItems, { skipSalesperson: true }));
      let rows = filtered.invoices.filter(i => STATE.invTypeFilter[i.paymentType === 'credit' ? 'credit' : 'cash']);
      // Deposits are a structurally different record (parseDepositsReport's DepositRecord, not
      // RawInvoice — no product line items, money received in advance rather than for delivered
      // goods) folded into this same table only when explicitly toggled on, normalized to the same
      // row shape so search/sort/date-drill below all work identically across both. docNo (always
      // prefixed AI) never collides with cash/credit invoiceNo (HS/IV), so it's safe to reuse
      // 'invoiceNo' as the row's identity/key.
      if (STATE.invTypeFilter.deposits) {
        let depRows = depositsInRange(period.dateFrom, period.dateTo).map(d => ({
          date: d.date, invoiceNo: d.docNo, customerName: d.customerName || '', customerCode: d.customerCode || '',
          salesperson: d.salesperson || '', total: d.total != null ? d.total : (d.amount || 0),
          recordType: 'deposit', depositRecord: d,
        }));
        if (STATE.filters.salesperson) depRows = depRows.filter(d => (d.salesperson || '—') === STATE.filters.salesperson);
        rows = rows.concat(depRows);
      }
      if (STATE.invSearch) {
        const q = STATE.invSearch.toLowerCase();
        const invNosWithItem = new Set(filtered.lineItems.filter(li => (li.description || '').toLowerCase().indexOf(q) !== -1 || (li.skuCode || '').toLowerCase().indexOf(q) !== -1).map(li => li.invoiceNo));
        rows = rows.filter(r => r.customerName.toLowerCase().indexOf(q) !== -1 || r.invoiceNo.toLowerCase().indexOf(q) !== -1 || r.customerCode.toLowerCase().indexOf(q) !== -1 || invNosWithItem.has(r.invoiceNo));
      }
      if (STATE.drillDate) rows = rows.filter(r => r.date === STATE.drillDate);
      const col = STATE.invSort.col, dir = STATE.invSort.dir;
      rows.sort((a, b) => { const av = a[col], bv = b[col]; if (av < bv) return -1 * dir; if (av > bv) return 1 * dir; return 0; });
      const total = rows.length;
      const shown = rows.slice(0, STATE.invLimit);
      const lineByInvoice = {};
      filtered.lineItems.forEach(li => { (lineByInvoice[li.invoiceNo] = lineByInvoice[li.invoiceNo] || []).push(li); });

      const cols = [['date', t('date')], ['invoiceNo', t('invoice')], ['customerName', t('customer')], ['salesperson', t('sales')], ['total', t('total')]];
      const head = cols.map(([key, label]) => {
        const arrow = STATE.invSort.col === key ? (STATE.invSort.dir === 1 ? '▲' : '▼') : '';
        return '<th data-col="' + key + '" class="' + (key === 'total' ? 'num' : '') + '">' + label + '<span class="sort-arrow">' + arrow + '</span></th>';
      }).join('');

      const body = shown.map(r => {
        const expanded = STATE.invExpanded[r.invoiceNo];
        const isDeposit = r.recordType === 'deposit';
        let detail = '';
        if (expanded && isDeposit) {
          const d = r.depositRecord;
          const offsets = (d.offsetAgainst || []).map(o => esc(o.invoiceNo) + ' (' + fmtBaht(o.amount) + ')').join(', ');
          detail = '<tr class="detail-row"><td colspan="5"><div class="detail-inner">' +
            '<div>' + t('depositBalanceDue') + ': <b>' + fmtBaht(d.balanceDue || 0) + '</b></div>' +
            '<div>' + t('depositAppliedAgainst') + ': ' + (offsets || t('depositNotYetApplied')) + '</div>' +
            (d.cancelled ? '<div style="color:var(--critical);">' + t('depositCancelledLabel') + '</div>' : '') +
            '</div></td></tr>';
        } else if (expanded) {
          const items = lineByInvoice[r.invoiceNo] || [];
          detail = '<tr class="detail-row"><td colspan="5"><div class="detail-inner"><table><tr><th>' + t('sku') + '</th><th>' + t('description') + '</th><th>' + t('qty') + '</th><th>' + t('unit') + '</th><th>' + t('amount') + '</th></tr>' +
            items.map(li => '<tr><td>' + esc(li.skuCode || '—') + '</td><td>' + esc(li.description) + '</td><td class="tabular">' + (li.qty != null ? fmtNum(li.qty) : '—') + '</td><td>' + esc(li.unit || '') + '</td><td class="tabular">' + fmtBaht(li.amount) + '</td></tr>').join('') +
            '</table></div></td></tr>';
        }
        const typeBadge = isDeposit
          ? '<span class="growth-badge" style="margin-left:6px; color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, var(--surface));">' + t('typeDepositBtn') + '</span>'
          : (r.paymentType === 'credit'
            ? '<span class="growth-badge down" style="margin-left:6px;">' + t('typeCredit') + '</span>'
            : (r.paymentType === 'cash' ? '<span class="growth-badge up" style="margin-left:6px;">' + t('typeCash') + '</span>' : ''));
        return '<tr class="inv-row" data-inv="' + esc(r.invoiceNo) + '"><td>' + fmtDateShort(r.date) + '</td><td>' + esc(r.invoiceNo) + typeBadge + '</td><td class="wrap">' + esc(r.customerName) + ' <span style="color:var(--muted); font-size:.72rem;">(' + esc(r.customerCode) + ')</span></td><td>' + esc(r.salesperson) + '</td><td class="num tabular">' + fmtBaht(r.total) + '</td></tr>' + detail;
      }).join('');

      const dateFilterBanner = STATE.drillDate
        ? '<div style="display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:.82rem; color:var(--accent);">' + icon('calendar', 14) + ' ' + t('filteredTo') + ' <b>' + fmtDateFull(STATE.drillDate) + '</b> &nbsp;<button id="clearDateDrillBtn" class="btn" style="padding:3px 10px; font-size:.76rem;">✕ ' + t('clear') + '</button></div>'
        : '';
      // A visible, always-present "what's filtered + how to clear it" banner — same pattern as the
      // date-drill banner above, extended to the text search. This was previously only reflected
      // in the search box itself, and only if that box's value happened to be in sync (see below —
      // it wasn't, when a search arrived via goSearchInvoice() from Top Products/the catalog rather
      // than the user typing it themselves), plus a bare invoice count at the very bottom of the
      // page with no way to clear it from there.
      const searchFilterBanner = STATE.invSearch
        ? '<div style="display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:.82rem; color:var(--accent);">' + icon('list', 14) + ' ' + t('filteredTo') + ' <b>' + esc(STATE.invSearch) + '</b> &nbsp;<button id="clearInvSearchBtn" class="btn" style="padding:3px 10px; font-size:.76rem;">✕ ' + t('clear') + '</button></div>'
        : '';

      document.getElementById('invoicesTableWrap').innerHTML =
        dateFilterBanner + searchFilterBanner + '<table class="data"><thead><tr>' + head + '</tr></thead><tbody>' + (body || '<tr><td colspan="5" class="empty-msg">' + t('noInvoicesMatch') + '</td></tr>') + '</tbody></table>';
      document.getElementById('invoicesFoot').innerHTML = t('showing') + ' ' + shown.length + ' ' + t('of') + ' ' + total + ' ' + t('invoices') +
        (total > shown.length ? ' — <button class="btn" id="loadMoreBtn" style="padding:4px 10px; font-size:.78rem;">' + t('showMore') + '</button>' : '');

      // The search box itself only ever had its value set once, at buildShell() time (page/app
      // init) — so navigating here from Top Products/the catalog via goSearchInvoice() changed
      // STATE.invSearch and the results, but the box kept showing whatever it showed before (often
      // empty), leaving no visible indication of what was actually being searched. Sync it here on
      // every render instead — guarded so it doesn't fight the user's own typing (that already
      // triggers this same render via its own debounced handler, so the value already matches).
      const searchInputEl = document.getElementById('invoiceSearch');
      if (searchInputEl && searchInputEl.value !== (STATE.invSearch || '')) searchInputEl.value = STATE.invSearch || '';

      const clearDateBtn = document.getElementById('clearDateDrillBtn');
      if (clearDateBtn) clearDateBtn.addEventListener('click', () => { STATE.drillDate = null; saveUiState(); PAGES.invoices.render(period); });
      const clearInvSearchBtn = document.getElementById('clearInvSearchBtn');
      if (clearInvSearchBtn) clearInvSearchBtn.addEventListener('click', () => {
        STATE.invSearch = ''; STATE.invLimit = 60; saveUiState(); PAGES.invoices.render(period);
      });
      document.querySelectorAll('#invoicesTableWrap th[data-col]').forEach(th => {
        th.addEventListener('click', () => {
          const c = th.dataset.col;
          if (STATE.invSort.col === c) STATE.invSort.dir *= -1; else STATE.invSort = { col: c, dir: 1 };
          saveUiState(); PAGES.invoices.render(period);
        });
      });
      document.querySelectorAll('.inv-row').forEach(tr => {
        tr.addEventListener('click', () => { const inv = tr.dataset.inv; STATE.invExpanded[inv] = !STATE.invExpanded[inv]; saveUiState(); PAGES.invoices.render(period); });
      });
      const loadMore = document.getElementById('loadMoreBtn');
      if (loadMore) loadMore.addEventListener('click', () => { STATE.invLimit += 100; saveUiState(); PAGES.invoices.render(period); });
    },
  };

    render(period) {
      const sp = sortedPeriods().filter(p => !isCombinedScope(p.key));
      if (!sp.length) return;

      const baseSelect = document.getElementById('forecastBaseMonthSelect');
      if (baseSelect) {
        const currentBase = STATE.forecastBaseMonth || sp[sp.length - 1].key;
        baseSelect.innerHTML = sp.map(p => {
          const lbl = (STATE.lang === 'th' ? p.thLabel : p.label) || p.key;
          return '<option value="' + p.key + '"' + (p.key === currentBase ? ' selected' : '') + '>' + lbl + '</option>';
        }).join('');
        STATE.forecastBaseMonth = baseSelect.value;
      }

      const activeBaseKey = STATE.forecastBaseMonth || sp[sp.length - 1].key;
      const baseIdx = sp.findIndex(p => p.key === activeBaseKey);
      const safeBaseIdx = baseIdx !== -1 ? baseIdx : sp.length - 1;

      // Target month
      const baseParts = activeBaseKey.split('-');
      const baseYr = parseInt(baseParts[0], 10);
      const baseMo = parseInt(baseParts[1], 10);
      let targetYr = baseYr;
      let targetMo = baseMo + 1;
      if (targetMo > 12) { targetMo = 1; targetYr++; }
      const targetMonthKey = targetYr + '-' + String(targetMo).padStart(2, '0');
      const targetMonthInfo = getMonthLabelTH(targetMonthKey);
      const targetMonthName = STATE.lang === 'th' ? targetMonthInfo.thLabel : targetMonthInfo.label;

      const targetLabelEl = document.getElementById('forecastTargetMonthLabel');
      if (targetLabelEl) targetLabelEl.textContent = targetMonthName;

      // Basis months
      const m3Periods = [];
      for (let i = 0; i < 3; i++) {
        const idx = safeBaseIdx - i;
        if (idx >= 0) m3Periods.push(sp[idx]);
      }
      const basisNames = m3Periods.reverse().map(p => (STATE.lang === 'th' ? p.thShortLabel : p.shortLabel) || p.key).join(', ');
      const basisLabelEl = document.getElementById('forecastBasisLabel');
      if (basisLabelEl) basisLabelEl.textContent = t('fcBasisPrefix') + basisNames;

      // Run computation with buffer percentage
      const bufferPct = STATE.forecastBufferPct !== undefined ? STATE.forecastBufferPct : 0;
      const res = computeProductDemandForecast(sp, activeBaseKey, { bufferPct: bufferPct });
      forecastLastRes = res;
      // "Active" = has some demand in the 3-month basis window (recommendedQty > 0 — it's exactly 0
      // whenever mQtys are all 0, buffer or not). res.coils/res.accessories also include specs that
      // sold at some point across the full upload history but not recently, kept there so Dead Stock
      // can still see them — but a reorder table showing rows with nothing to reorder reads as
      // broken, so every KPI figure and both tables below consistently use this filtered set instead,
      // to keep the KPI counts and what's actually visible/clickable in the tables always matching.
      const activeCoils = res.coils.filter(c => c.recommendedQty > 0);
      const activeAccessories = res.accessories.filter(s => !s.isCoilItem && s.recommendedQty > 0);

      // Resync controls that can now change from a KPI-card click (not just their own input/chip),
      // same "don't leave the control showing something stale" fix already applied to Invoice
      // Explorer's search box — see PAGES.invoices.render()'s comment on searchInputEl.
      const coilSearchEl = document.getElementById('forecastCoilSearchInput');
      if (coilSearchEl && coilSearchEl.value !== (STATE.forecastCoilSearch || '')) coilSearchEl.value = STATE.forecastCoilSearch || '';
      const deadSearchEl = document.getElementById('forecastDeadSearchInput');
      if (deadSearchEl && deadSearchEl.value !== (STATE.forecastDeadSearch || '')) deadSearchEl.value = STATE.forecastDeadSearch || '';
      const unitSearchEl = document.getElementById('forecastUnitSearchInput');
      if (unitSearchEl && unitSearchEl.value !== (STATE.forecastUnitSearch || '')) unitSearchEl.value = STATE.forecastUnitSearch || '';
      document.querySelectorAll('#forecastCoilFilterToggle .chip').forEach(c => c.classList.toggle('active', c.dataset.class === (STATE.forecastCoilFilter || 'all')));
      document.querySelectorAll('#forecastUnitFilterToggle .chip').forEach(c => c.classList.toggle('active', c.dataset.class === (STATE.forecastUnitFilter || 'all')));

      // Total base vs total buffer — reduced over activeCoils (not res.coils) so this always matches
      // the coil table's own footer total below; res.coils can include specs with a nonzero mQtys
      // entry that still rounds to a 0 baseForecast (e.g. mQtys=[0,0,1] with the 20%-weighted oldest
      // month only), which would silently inflate this KPI relative to what the filtered table sums.
      const totalM0 = activeCoils.reduce((a, c) => a + (c.mQtys[0] || 0), 0);
      const totalM1 = activeCoils.reduce((a, c) => a + (c.mQtys[1] || 0), 0);
      const totalM2 = activeCoils.reduce((a, c) => a + (c.mQtys[2] || 0), 0);
      const totalBufferMeters = activeCoils.reduce((a, c) => a + c.safetyBuffer, 0);
      const totalBaseTons = Number((activeCoils.reduce((a, c) => a + (c.baseForecast * 0.914 * (parseFloat(c.thickness) || 0.3) * 7.85 / 1000), 0)).toFixed(1));
      const totalBufferTons = Number((res.summary.totalCoilTons - totalBaseTons).toFixed(1));

      // 1. Render KPI Cards (With uniform typography and identical font sizing)

              '<div style="color:var(--accent); margin-top:2px;">' + t('fcIncludesSpecsNote').replace('{n}', activeCoils.length) + '</div>' +

              '</div>' +

              '<div>' + t('fc3moSalesLabel') + ' <b>' + fmtNum(topCoil.mQtys[2] || 0) + ' · ' + fmtNum(topCoil.mQtys[1] || 0) + ' · ' + fmtNum(topCoil.mQtys[0] || 0) + ' ' + t('meterAbbr') + '</b></div>' +
