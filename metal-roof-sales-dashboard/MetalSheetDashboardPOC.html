  // Starting-assumption permissions table (architecture.md §5 — flagged there as "not a confirmed
  // spec," several rows marked open questions; this fills them in with the most conservative
  // reading rather than leaving them unresolved, per direct instruction to just build the 3-tier
  // system now). Executive/Management: unrestricted, matching the table's ✅ rows. Sales: the table's
  // ❓ rows (company-wide totals, forecast, upload) resolved to "no" — a scoped forecast would
  // recommend restocking based on just one salesperson's share of demand, which is operationally
  // wrong, not just a stricter permission — and upload/reset are data-management actions, not
  // viewing. "View own performance"/"view own customers" (✅ for all roles) is handled by data
  // scoping (visibleRawInvoices() below), not page-level gating, so a Sales user can still open every
  // page a real salesperson would use day-to-day (Overview, Trend, Heatmap, Products, Customers,
  // Salespeople, Invoices) — just never sees anything beyond their own invoices anywhere in the app.
  // REVISED (2026-09-24, direct correction after the first attempt at this): "sales should be able to
  // upload and reset the data right? it's the bare minimum to be able to use [the app]... report/
  // export is also for others and not sales... what should executive see that management cannot see,
  // what can management sees that sales cannot see." Two things the first pass got backwards, both
  // rooted in a real architectural point the direct feedback made explicit: this app has **no
  // backend** — every session's data lives in that one browser's own localStorage/IndexedDB, loaded
  // from whichever CSVs THAT browser uploaded. There is no shared company database a Reset could
  // actually destroy company-wide; it only ever clears the current browser's local copy, and
  // re-uploading the same source files fully restores it. That makes Upload and Reset closer to
  // "does this tool work at all on my device" than an admin privilege — without Upload, a sales rep
  // opening their own copy of this file for the first time has no way to ever get their own data in,
  // and without Reset, a bad/duplicate upload has no self-service fix. Both are now open to every
  // role. Export, by contrast, produces a take-away report file — reserved for the two
  // oversight roles (Management/Executive), not Sales reps. And the missing genuine Executive-only
  // capability (the actual gap the first pass never created) is setting the company's monthly
  // revenue target — a leadership/goal-setting decision, not a day-to-day operational one, so it's
  // now the one thing Executive can do that Management cannot. Company-wide data / other salespeople's
  // performance / the Forecast page remain the existing, already-correct Management-cannot-Sales-see
  // boundary (schema.md §2.7's data-scoping choke point + the Forecast page exclusion) — this session
  // didn't find a reason to add a second Executive-only PAGE on top of the target-setting action;
  // Management genuinely needs full operational visibility (all company data, all pages) to manage
  // day-to-day, so narrowing what Management can *see* would hamper that, unlike narrowing a single
  // strategic *action*. Flagged in architecture.md §5 as still an unconfirmed judgment call, same as
  // every prior pass at this table.
  const PERMISSIONS = {
    executive: { excludedPages: [], canUpload: true, canReset: true, canExport: true, canSetTarget: true },
    management: { excludedPages: [], canUpload: true, canReset: true, canExport: true, canSetTarget: false },
    sales: { excludedPages: ['forecast'], canUpload: true, canReset: true, canExport: false, canSetTarget: false },
  };
  function currentPerms() {
    return PERMISSIONS[STATE.session ? STATE.session.role : 'sales'];
  }
  function canAccessPage(pageId) { return currentPerms().excludedPages.indexOf(pageId) === -1; }

  // Single choke point for "which raw records is the current session allowed to see" — every reader
  // of the flat rawInvoices/rawLineItems arrays (computePeriods(), dateRangePeriod(), the unsold-
  // products lookup) goes through these instead of STATE.rawInvoices/rawLineItems directly, so a
  // Sales session is scoped everywhere at once rather than needing a per-page filter that's easy to
  // forget on a new page. Upload/reset/customer-code-resolution intentionally read the raw arrays
  // directly, bypassing this — those are data-management operations on the full dataset, not a view.
  function visibleRawInvoices() {
    if (STATE.session && STATE.session.role === 'sales') {
      const code = STATE.session.salespersonCode;
      return STATE.rawInvoices.filter(i => i.salesperson === code);
    }
    return STATE.rawInvoices;
  }
  function visibleRawLineItems() {
    if (STATE.session && STATE.session.role === 'sales') {
      const invNos = new Set(visibleRawInvoices().map(i => i.invoiceNo));
      return STATE.rawLineItems.filter(li => invNos.has(li.invoiceNo));
    }
    return STATE.rawLineItems;
  }

  // Groups the flat rawInvoices/rawLineItems into one object per calendar month — the shape every
  // page renderer already expects (period.invoices / period.lineItems). Recomputed whenever the
  // underlying raw data OR the logged-in session changes (schema.md §2.3) — sourced from
  // visibleRawInvoices()/visibleRawLineItems(), not the raw STATE arrays directly, so a Sales
  // session's periods only ever contain their own invoices.
  function computePeriods() {
    const monthGroups = {};
    visibleRawInvoices().forEach(inv => {
      if (!inv.date) return;
      const mk = inv.date.slice(0, 7);
      if (!monthGroups[mk]) monthGroups[mk] = { invoices: [], invoiceNos: new Set() };
      monthGroups[mk].invoices.push(inv);
      monthGroups[mk].invoiceNos.add(inv.invoiceNo);
    });
    const monthLineItems = {};
    Object.keys(monthGroups).forEach(k => { monthLineItems[k] = []; });
    visibleRawLineItems().forEach(li => {
      for (const k of Object.keys(monthGroups)) {
        if (monthGroups[k].invoiceNos.has(li.invoiceNo)) { monthLineItems[k].push(li); break; }
      }
    });
    const periods = [];
    Object.keys(monthGroups).sort().forEach(monthKey => {
      const groupInvs = monthGroups[monthKey].invoices;
      const dates = groupInvs.map(i => i.date).filter(Boolean).sort();
      const monthInfo = getMonthLabelTH(monthKey);
      periods.push({
        key: monthKey, label: monthInfo.label, shortLabel: monthInfo.shortLabel, thLabel: monthInfo.thLabel, thShortLabel: monthInfo.thShortLabel,
        dateFrom: dates[0], dateTo: dates[dates.length - 1],
        invoices: groupInvs, lineItems: monthLineItems[monthKey],
      });
    });
    return periods;
  }

  // Merges several real month-periods into one synthetic combined period sharing the same shape
  // (so every downstream consumer — kpis(), applyFilter(), category/product/customer breakdowns —
  // just works on .invoices/.lineItems without knowing it's a merge). Backs 'ALL' plus the year
  // and year-range scopes below.
  function mergePeriods(matching, key, label) {
    if (!matching.length) return null;
    let allInvs = [], allLines = [];
    matching.forEach(p => { allInvs = allInvs.concat(p.invoices); allLines = allLines.concat(p.lineItems); });
    const dates = allInvs.map(i => i.date).filter(Boolean).sort();
    return {
      key, label, shortLabel: label,
      dateFrom: dates[0] || matching[0].dateFrom, dateTo: dates[dates.length - 1] || matching[matching.length - 1].dateTo,
      invoices: allInvs, lineItems: allLines, parseWarnings: 0, isAggregated: true,
    };
  }
  // Builds a period from an arbitrary [fromIso, toIso] day range instead of whole calendar months —
  // filters STATE.rawInvoices/rawLineItems directly (not the month-grouped STATE.periods) since the
  // range can start/end mid-month. Same shape as mergePeriods()'s output (invoices/lineItems/
  // dateFrom/dateTo/isAggregated), so every downstream consumer that already works on a merged
  // period (kpis(), applyFilter(), the breakdowns, dailySeries()) needs no changes to support it.
  function dateRangePeriod(fromIso, toIso) {
    const invoices = visibleRawInvoices().filter(i => i.date && i.date >= fromIso && i.date <= toIso);
    // BUG FIX (2026-09-24, direct report: "filter was clear on display but still applied... display
    // 0 of whatever the user want to view", surfaced on Heatmap): unlike mergePeriods() (which
    // returns null when nothing matches), this used to always return a truthy period object even
    // with 0 invoices — a DR: scope that was valid under one session's visible data (e.g. an
    // executive's full view) stayed "truthy" after a role/session switch narrowed visibility to a
    // salesperson with no invoices in that range, so renderCurrentPage()'s `if (!period)` empty-state
    // guard never caught it. Matches mergePeriods()'s own null-on-empty behavior.
    if (!invoices.length) return null;
    const invNos = new Set(invoices.map(i => i.invoiceNo));
    const lineItems = visibleRawLineItems().filter(li => invNos.has(li.invoiceNo));
    const label = fmtDateShort(fromIso) + ' – ' + fmtDateShort(toIso);
    return {
      key: 'DR:' + fromIso + ':' + toIso, label, shortLabel: label,
      dateFrom: fromIso, dateTo: toIso,
      invoices, lineItems, isAggregated: true,
    };
  }
  // Key formats: 'ALL' (every loaded month), 'YYYY-MM' (one real month, from computePeriods()),
  // 'Y:YYYY' (one calendar year, all its loaded months combined), 'YR:fromYear:toYear' (an
  // inclusive year range, combined), 'DR:YYYY-MM-DD:YYYY-MM-DD' (an arbitrary day-level range,
  // e.g. "27 Jan – 22 Feb," picked via the period selector's Custom Range control — the last two
  // exist so data spanning more than one calendar year (already true of the real dataset: Dec 2025 –
  // Aug 2026) gets a year-level scope, and DR so a range that doesn't line up with month/year
  // boundaries at all is still selectable, not just a flat list of every month ever loaded.
  function getPeriod(key) {
    const sp = sortedPeriods();
    if (key === 'ALL') return mergePeriods(sp, 'ALL', t('allQ3'));
    if (key && key.indexOf('Y:') === 0) {
      const y = key.slice(2);
      return mergePeriods(sp.filter(p => p.key.slice(0, 4) === y), key, y);
    }
    if (key && key.indexOf('YR:') === 0) {
      const parts = key.slice(3).split(':'); const a = parts[0], b = parts[1];
      return mergePeriods(sp.filter(p => p.key.slice(0, 4) >= a && p.key.slice(0, 4) <= b), key, a + '–' + b);
    }
    if (key && key.indexOf('DR:') === 0) {
      const parts = key.slice(3).split(':');
      return dateRangePeriod(parts[0], parts[1]);
    }
    return sp.find(p => p.key === key) || null;
  }
  // True for any scope wider than one specific real month ('ALL', 'Y:*', 'YR:*', 'DR:*') —
  // comparisons (vs. previous month, vs. historical average) and some page-specific fallbacks are
  // only unambiguous for a single actual month, same scope decision progress.md's Session 4 already
  // made for 'ALL', now generalized to the year and custom-range scopes too.
  function isCombinedScope(key) { return key === 'ALL' || (key && (key.indexOf('Y:') === 0 || key.indexOf('YR:') === 0 || key.indexOf('DR:') === 0)); }
  // Whether a (possibly stale, e.g. persisted from before a reset/re-upload) currentKey still
  // resolves against the currently-loaded periods — getPeriod() would just silently return null
  // for a year/range that no longer exists, so callers deciding whether to keep vs. reset the
  // current selection need this check up front.
  function isValidCurrentKey(key, sp) {
    if (!key) return false;
    if (key === 'ALL') return true;
    if (key.indexOf('Y:') === 0) return sp.some(p => p.key.slice(0, 4) === key.slice(2));
    if (key.indexOf('YR:') === 0) {
      const parts = key.slice(3).split(':');
      return sp.some(p => p.key.slice(0, 4) >= parts[0] && p.key.slice(0, 4) <= parts[1]);
    }
    if (key.indexOf('DR:') === 0) {
      const parts = key.slice(3).split(':');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(parts[0]) || !/^\d{4}-\d{2}-\d{2}$/.test(parts[1]) || parts[0] > parts[1]) return false;
      // BUG FIX (2026-09-24): unlike the Y:/YR: branches just above, this used to only check the
      // key's own date-string shape — never whether the range actually overlaps any currently-
      // loaded/visible period, so a stale DR: range from before a reset/re-upload/role-switch read
      // as "still valid" and was kept instead of falling back to a sane default.
      return sp.some(p => p.dateTo >= parts[0] && p.dateFrom <= parts[1]);
    }
    return sp.some(p => p.key === key);
  }
  function currentPeriod() { return getPeriod(STATE.currentKey); }
  function sortedPeriods() { return STATE.periods.slice().sort((a, b) => a.key < b.key ? -1 : 1); }
  function allYears() { return Array.from(new Set(sortedPeriods().map(p => p.key.slice(0, 4)))).sort(); }
  // Collapses a [fromYear,toYear] selection down to the plainest matching key: the full span is
  // just 'ALL' (matches every loaded month, same as today's default), a single year is 'Y:',
  // anything narrower is a 'YR:' range.
  function combinedScopeKey(fromYear, toYear) {
    const years = allYears();
    if (fromYear === toYear) return 'Y:' + fromYear;
    if (fromYear === years[0] && toYear === years[years.length - 1]) return 'ALL';
    return 'YR:' + fromYear + ':' + toYear;
  }
  function prevPeriodOf(key) {
    if (isCombinedScope(key)) return null;
    const sp = sortedPeriods();
    const i = sp.findIndex(p => p.key === key);
    return i > 0 ? sp[i - 1] : null;
  }

  /* ============================== PERSISTENCE ============================== */
  const LS_INV_KEY = 'steelroof_raw_invoices_v1';
  const LS_LI_KEY = 'steelroof_raw_lineitems_v1';
  const LS_DEP_KEY = 'steelroof_raw_deposits_v1';
  const LS_LEGACY_PERIODS_KEY = 'steelroof_dashboard_data_v4'; // old ver1/ver2 tuple-period cache
  const LS_UI_KEY = 'steelroof_ui_state_v1';
  const LS_THEME_KEY = 'steelroof_theme';
  const LS_LANG_KEY = 'steelroof_lang';
  // Monthly sales targets — a business decision independent of any one uploaded file, so (like
  // theme/language, unlike the raw CSV data itself) these survive both a reopen AND a "Reset Data"
  // click. Reintroduces prd.md Feature 3 / schema.md §2.4's SalesTarget entity, removed entirely
  // back in Session 6 ("HTML ver3") per direct instruction at the time; rebuilt here per a fresh
  // direct request, following that entity's already-documented shape (month_key/amount/setBy/setAt).
  const LS_TARGETS_KEY = 'steelroof_targets_v1';

  // Uploaded CSV data intentionally does NOT persist across page loads — every reopen or refresh
  // starts empty and the CSVs need re-uploading. (An earlier build of this dashboard did persist
  // it via localStorage; this actively purges that — and any older ver1/ver2 cache — on every
  // load so previously-saved browser data can't silently resurface.)
  function initRawData() {
    [LS_INV_KEY, LS_LI_KEY, LS_DEP_KEY, LS_LEGACY_PERIODS_KEY].forEach(k => { try { localStorage.removeItem(k); } catch (e) { } });
    STATE.rawInvoices = [];
    STATE.rawLineItems = [];
    STATE.deposits = [];
    STATE.periods = [];
  }

  // Upserts by invoiceNo (unique across cash's HS and credit's IV prefixes — schema.md §6 Q3):
  // a re-uploaded invoice replaces the old one, and its line items are replaced as a whole rather
  // than appended, so re-uploading a corrected file never leaves stale/duplicate line items behind.
  function upsertInvoices(newInvoices, newLineItems) {
    if (!newInvoices.length) return;
    const invIndex = new Map(STATE.rawInvoices.map((inv, i) => [inv.invoiceNo, i]));
    newInvoices.forEach(inv => {
      if (invIndex.has(inv.invoiceNo)) STATE.rawInvoices[invIndex.get(inv.invoiceNo)] = inv;
      else { STATE.rawInvoices.push(inv); invIndex.set(inv.invoiceNo, STATE.rawInvoices.length - 1); }
    });
    const touchedInvNos = new Set(newInvoices.map(i => i.invoiceNo));
    STATE.rawLineItems = STATE.rawLineItems.filter(li => !touchedInvNos.has(li.invoiceNo)).concat(newLineItems);
  }
  // Upserts by docNo (deposits' own unique key, prefix AI — schema.md §5's 2026-09-16 addition).
  function upsertDeposits(newDeposits) {
    if (!newDeposits.length) return;
    const idx = new Map(STATE.deposits.map((d, i) => [d.docNo, i]));
    newDeposits.forEach(d => {
      if (idx.has(d.docNo)) STATE.deposits[idx.get(d.docNo)] = d;
      else { STATE.deposits.push(d); idx.set(d.docNo, STATE.deposits.length - 1); }
    });
  }
  function depositsInRange(dateFrom, dateTo) {
    return STATE.deposits.filter(d => d.date && d.date >= dateFrom && d.date <= dateTo);
  }

  // 'filters' (category/salesperson) deliberately excluded — like the uploaded CSV data itself,
  // these should never survive a reopen; they only persist in-memory during the current page load
  // (reset-on-navigate is handled separately in showPage()).
  const UI_STATE_FIELDS = ['currentKey', 'yearRangeFrom', 'yearRangeTo', 'trendMetric', 'topMetric', 'trendGranularity', 'topN', 'custTopN', 'spTopN', 'invSort', 'invSearch', 'invExpanded', 'invLimit', 'invTypeFilter', 'productSearch', 'catalogSort', 'catalogLimit', 'catalogSearch', 'customerSearch', 'customerSort', 'customerLimit', 'custDrillProdLimit', 'drillDate', 'drillCustomer', 'drillSalesperson', 'heatmapMonth', 'spDrillCustLimit', 'spDrillProdLimit', 'forecastBaseMonth', 'forecastBufferPct', 'selectedCoilId', 'forecastCoilFilter', 'forecastCoilSearch', 'forecastCoilLimit', 'forecastDeadSearch', 'forecastDeadLimit', 'selectedUnitId', 'forecastUnitFilter', 'forecastUnitSearch', 'forecastUnitLimit', 'forecastLiveCalcType'];
  function loadUiState() {
    try {
      const raw = localStorage.getItem(LS_UI_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      UI_STATE_FIELDS.forEach(f => { if (parsed[f] !== undefined) STATE[f] = parsed[f]; });
    } catch (e) { }
  }
  function saveUiState() {
    try {
      const out = {};
      UI_STATE_FIELDS.forEach(f => { out[f] = STATE[f]; });
      localStorage.setItem(LS_UI_KEY, JSON.stringify(out));
    } catch (e) { }
  }

  // Monthly sales targets — a small, separate localStorage key (schema.md §2.4's SalesTarget
  // entity), independent of UI_STATE_FIELDS above: unlike everything in that list, targets must
  // survive a "Reset Data" click too (same reasoning as theme/language), so they're loaded/saved on
  // their own rather than folded into loadUiState()/saveUiState() or the Reset button's purge list.
  function loadTargets() {
    try {
      const raw = localStorage.getItem(LS_TARGETS_KEY);
      if (raw) STATE.targets = JSON.parse(raw) || {};
    } catch (e) { }
  }
  function saveTargets() {
    try { localStorage.setItem(LS_TARGETS_KEY, JSON.stringify(STATE.targets)); } catch (e) { }
  }
  function setTarget(monthKey, amount) {
    // Defense in depth — the Set/Edit/Save buttons are already never rendered for a role without
    // canSetTarget (a Sales session never sees them in the DOM at all), but a hidden/removed control
    // can still be invoked via devtools/scripting, same rule the Reset button's own handler applies.
    if (STATE.session && !currentPerms().canSetTarget) return;
    STATE.targets[monthKey] = {
      amount: amount,
      setBy: STATE.session ? STATE.session.username : null,
      setAt: new Date().toISOString(),
    };
    saveTargets();
  }
  function clearTarget(monthKey) {
    if (STATE.session && !currentPerms().canSetTarget) return;
    delete STATE.targets[monthKey];
    saveTargets();
  }
  // Which real (single-month) periods a scope key actually covers — mirrors getPeriod()'s own
  // per-key-type filtering exactly, so "which months' targets get summed for a combined scope"
  // never silently drifts out of sync with "which months' invoices that same scope actually shows."
  function monthsInScope(key) {
    const sp = sortedPeriods();
    if (key === 'ALL') return sp;
    if (key && key.indexOf('Y:') === 0) {
      const y = key.slice(2);
      return sp.filter(p => p.key.slice(0, 4) === y);
    }
    if (key && key.indexOf('YR:') === 0) {
      const parts = key.slice(3).split(':');
      return sp.filter(p => p.key.slice(0, 4) >= parts[0] && p.key.slice(0, 4) <= parts[1]);
    }
    if (key && key.indexOf('DR:') === 0) {
      const parts = key.slice(3).split(':');
      return sp.filter(p => p.dateTo >= parts[0] && p.dateFrom <= parts[1]);
    }
    const single = sp.find(p => p.key === key);
    return single ? [single] : [];
  }

  /* ============================== TOAST / TOOLTIP ============================== */
  let toastTimer = null;
  function toast(msg, ms) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms || 3600);
  }
  function showTip(html, x, y) {
    const el = document.getElementById('tooltip');
    if (!el) return;
    el.innerHTML = html; el.style.display = 'block';
    el.style.left = (x + 16) + 'px'; el.style.top = (y + 16) + 'px';
    requestAnimationFrame(() => {
      const r = el.getBoundingClientRect();
      if (r.right > window.innerWidth - 8) el.style.left = (x - r.width - 16) + 'px';
      if (r.bottom > window.innerHeight - 8) el.style.top = (y - r.height - 16) + 'px';
    });
  }
  function hideTip() { const el = document.getElementById('tooltip'); if (el) el.style.display = 'none'; }

  /* ============================== AGGREGATIONS ============================== */
  // Feature 18: cross-cutting filters are combinable (category AND salesperson), not exclusive.
  // opts.skipSalesperson: used to populate the salesperson dropdown itself — it needs the category
  // filter applied (so its numbers match what's actually on screen) but must NOT also apply the
  // salesperson filter, or every option but the currently-selected one would disappear.
  // TRAP (external audit #10, investigated 2026-09-23, left as documentation only — see below):
  // when a category filter is active, the RETURNED `invoices` are not "this category's invoices" —
  // they're the FULL, unfiltered invoice objects for every invoice that contains at least one line
  // item in that category. That's correct for what this function is actually used for today
  // (Products/Customers/Salespeople/Invoices' own per-invoice display and the topCustomers()/
  // salespersonBreakdown() drill-downs, which need the real invoice total, not a category slice of
  // it — an invoice isn't divisible). It would be WRONG to call kpis(filtered.invoices, ...) on this
  // result expecting invoice-level fields (cash/vat/deposit) to be category-scoped — cash/vat/
  // deposit belong to the whole invoice, not the fraction of it in one category, and kpis() has no
  // way to prorate them. Checked every kpis() call site in this file: none currently passes a
  // category-filtered invoice set (kpis() always receives a full, unfiltered period), so this isn't
  // live today — flagged so a future change doesn't introduce that combination assuming it's safe.
  function applyFilter(invoices, lineItems, opts) {
    opts = opts || {};
    let inv = invoices, li = lineItems;
    if (STATE.filters.category) {
      const cat = STATE.filters.category;
      li = li.filter(x => x.category === cat);
      const invSet = new Set(li.map(x => x.invoiceNo));
      inv = inv.filter(i => invSet.has(i.invoiceNo));
    }
    if (STATE.filters.salesperson && !opts.skipSalesperson) {
      inv = inv.filter(i => (i.salesperson || '—') === STATE.filters.salesperson);
      const invNos = new Set(inv.map(i => i.invoiceNo));
      li = li.filter(x => invNos.has(x.invoiceNo));
    }
    return { invoices: inv, lineItems: li };
  }

  // "Revenue" is the full value of every line item delivered (no category exclusion — see
  // categoryBreakdown()/topProducts() below for why "Giveaways" isn't actually all free), not
  // invoice.total — an invoice's own total is net of any deposit already collected earlier against
  // it (schema.md §6 Q7), so summing invoice.total alone understates true revenue for orders that
  // had a deposit applied. lineItems must already be scoped to the same invoices (same period/filter)
  // as the invoices argument — every call site gets both from the same period/applyFilter() result.
  function kpis(invoices, lineItems) {
    const revenue = lineItems.reduce((a, li) => a + (li.amount || 0), 0);
    const cash = invoices.reduce((a, i) => a + i.cashReceived, 0);
    const check = invoices.reduce((a, i) => a + i.checkReceived, 0);
    const wht = invoices.reduce((a, i) => a + i.withholdingTax, 0);
    const vat = invoices.reduce((a, i) => a + (i.vat || 0), 0);
    const deposit = invoices.reduce((a, i) => a + (i.depositApplied || 0), 0);
    const count = invoices.length;
    const aov = count ? revenue / count : 0;
    return { revenue, cash, check, wht, vat, deposit, count, aov };
  }

  function addDaysIso(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.getUTCFullYear() + '-' + String(dt.getUTCMonth() + 1).padStart(2, '0') + '-' + String(dt.getUTCDate()).padStart(2, '0');
  }

  // count comes from invoices (one per invoice, unchanged meaning); revenue comes from lineItems
  // (RawLineItem carries its own copy of the parent invoice's date), consistent with kpis().
  // BUG FIX (external audit #1, 2026-09-23): `iso >= dateTo` is FALSE for any comparison against
  // `undefined` (JS relational operators never throw, they just always return false), so a caller
  // passing an undefined/malformed dateTo used to hang this loop forever — an unrecoverable browser
  // freeze, not a crash. No confirmed path in today's UI actually passes an invalid dateFrom/dateTo
  // (computePeriods()/mergePeriods() both guarantee real dates), but the failure mode is severe
  // enough, and the guard cheap enough, to harden regardless of whether it's reachable today.
  function dailySeriesForRange(invoices, lineItems, dateFrom, dateTo) {
    const map = {};
    if (!dateFrom || !dateTo || !/^\d{4}-\d{2}-\d{2}$/.test(dateFrom) || !/^\d{4}-\d{2}-\d{2}$/.test(dateTo)) return [];
    let iso = dateFrom;
    let guard = 0;
    while (guard++ < 3660) { // one full decade's worth of days — real callers never span that far
      map[iso] = { date: iso, revenue: 0, count: 0 };
      if (iso >= dateTo) break;
      iso = addDaysIso(iso, 1);
    }
    invoices.forEach(i => { if (map[i.date]) map[i.date].count++; });
    lineItems.forEach(li => { if (map[li.date]) map[li.date].revenue += (li.amount || 0); });
    return Object.keys(map).sort().map(k => map[k]);
  }
  function dailySeries(period) { return dailySeriesForRange(period.invoices, period.lineItems, period.dateFrom, period.dateTo); }

  function dowSeries(period) {
    const buckets = [0, 0, 0, 0, 0, 0, 0];
    const counts = [0, 0, 0, 0, 0, 0, 0];
    period.invoices.forEach(i => {
      counts[new Date(i.date + 'T00:00:00').getDay()]++;
    });
    period.lineItems.forEach(li => {
      const dow = new Date(li.date + 'T00:00:00').getDay();
      buckets[dow] += (li.amount || 0);
    });
    const names = [t('dowSun'), t('dowMon'), t('dowTue'), t('dowWed'), t('dowThu'), t('dowFri'), t('dowSat')];
    return names.map((n, idx) => ({ label: n, total: buckets[idx], count: counts[idx], avg: counts[idx] ? buckets[idx] / counts[idx] : 0 }));
  }

  // Not excluding "Giveaways" (SKU prefix 99): verified against the real dataset that category
  // mixes 4,617 genuinely free items (amount 0, harmless either way) with 321 real paid items —
  // delivery fees, materials, uniforms — totaling ฿353,598 that were being silently dropped from
  // every revenue figure by the old blanket exclusion. That's real money customers paid; it counts.
  function categoryBreakdown(lineItems) {
    const map = {};
    lineItems.forEach(li => {
      const key = li.category || 'Other';
      if (!map[key]) map[key] = { category: key, revenue: 0, count: 0 };
      map[key].revenue += li.amount; map[key].count++;
    });
    return Object.values(map).sort((a, b) => b.revenue - a.revenue);
  }

  function topProducts(lineItems, metric, n, opts) {
    opts = opts || {};
    const map = {};
    lineItems.forEach(li => {
      const key = (li.skuCode || 'N/A') + '||' + li.description;
      if (!map[key]) map[key] = {
        sku: li.skuCode, description: li.description, category: li.category, revenue: 0, qty: 0, unit: li.unit,
        // Feature 7: thickness/color alongside each product in rankings (schema.md §4).
        thickness: thicknessOf(li.description), color: colorOf(li.description),
      };
      map[key].revenue += li.amount;
      if (typeof li.qty === 'number') map[key].qty += li.qty;
    });
    let arr = Object.values(map);
    if (STATE.productSearch && !opts.ignoreSearch) {
      const q = STATE.productSearch.toLowerCase();
      arr = arr.filter(p => (p.description || '').toLowerCase().indexOf(q) !== -1 || (p.sku || '').toLowerCase().indexOf(q) !== -1);
    }
    arr.sort((a, b) => (metric === 'qty' ? b.qty - a.qty : b.revenue - a.revenue));
    // n === null/undefined means "every matching product, no cap" — callers that want the true
    // full catalog (not just a top-N ranking) must pass null explicitly, not an arbitrarily large
    // number that happens to be bigger than today's data (see the bug this replaced: a hardcoded
    // 999 here silently truncated the Full Product Catalog table/its totals once real data grew
    // past that many distinct SKU+description combinations).
    return n == null ? arr : arr.slice(0, n);
  }

  // Feature 9 (unsold/slow-moving): ranks every SKU ever seen across ALL uploaded history by how
  // little revenue it did in the CURRENT (filtered) period — explicitly sales-history-based, since
  // no separate stock/inventory feed exists (prd.md's known restock-timing data-quality gap is
  // exactly why this can't be a real stock view; captioned as such in the UI, not silently implied).
  function unsoldOrSlowProducts(currentFilteredLineItems, n) {
    const allKnown = topProducts(visibleRawLineItems(), 'amount', null, { ignoreSearch: true });
    const currentMap = {};
    topProducts(currentFilteredLineItems, 'amount', null, { ignoreSearch: true }).forEach(p => { currentMap[(p.sku || 'N/A') + '||' + p.description] = p; });
    return allKnown.map(p => {
      const cur = currentMap[(p.sku || 'N/A') + '||' + p.description];
      return Object.assign({}, p, { currentRevenue: cur ? cur.revenue : 0, currentQty: cur ? cur.qty : 0 });
    }).sort((a, b) => a.currentRevenue - b.currentRevenue).slice(0, n || 10);
  }

  // Revenue per customer comes from line items (same "full delivered value" definition as kpis()),
  // joined back to their invoice's customer via invoiceNo — lineItems has no customer field of its
  // own. invoices still supplies count (invoices per customer) and which customers exist at all.
  function topCustomers(invoices, lineItems, n, opts) {
    opts = opts || {};
    const map = {};
    const custByInv = {};
    // Key on customerCode alone (resolveCreditCustomerCodes() guarantees every invoice has one,
    // real or synthetic) rather than code+name — credit sales occasionally spells an existing cash
    // customer's name slightly differently, and keying on the combo used to split that one real
    // customer into two rows. Two passes so the cash system's own spelling of the name wins as the
    // display name over a credit-report variant, not whichever invoice happens to be first in the
    // array.
    const custKey = i => i.customerCode || ('N:' + i.customerName);
    [invoices.filter(i => i.paymentType !== 'credit'), invoices.filter(i => i.paymentType === 'credit')].forEach(list => list.forEach(i => {
      const key = custKey(i);
      custByInv[i.invoiceNo] = key;
      if (!map[key]) map[key] = { code: i.customerCode, name: i.customerName, revenue: 0, count: 0 };
      map[key].count++;
    }));
    lineItems.forEach(li => {
      const key = custByInv[li.invoiceNo];
      if (key == null) return;
      map[key].revenue += (li.amount || 0);
    });
    let arr = Object.values(map).map(c => Object.assign(c, { aov: c.count ? c.revenue / c.count : 0 }));
    if (STATE.customerSearch && !opts.ignoreSearch) {
      const q = STATE.customerSearch.toLowerCase();
      arr = arr.filter(c => (c.name || '').toLowerCase().indexOf(q) !== -1 || (c.code || '').toLowerCase().indexOf(q) !== -1);
    }
    arr.sort((a, b) => b.revenue - a.revenue);
    // n === null/undefined means "every matching customer, no cap" — same convention as
    // topProducts(). The Customers page's full table used to pass a hardcoded 999 here, which
    // silently truncated once the real dataset passed that many distinct customers (1,500 of them,
    // ฿829,063.58 of revenue missing from anything summed off the truncated list) — same bug shape
    // as the Full Product Catalog's old 999 cap, just not caught until later.
    return n == null ? arr : arr.slice(0, n);
  }

  // Same join-via-invoiceNo approach as topCustomers() — revenue per salesperson comes from line
  // items, not invoice.total.
  function salespersonBreakdown(invoices, lineItems) {
    const map = {};
    const spByInv = {};
    invoices.forEach(i => {
      const key = i.salesperson || '—';
      spByInv[i.invoiceNo] = key;
      if (!map[key]) map[key] = { code: key, revenue: 0, count: 0 };
      map[key].count++;
    });
    lineItems.forEach(li => {
      const key = spByInv[li.invoiceNo];
      if (key == null) return;
      map[key].revenue += (li.amount || 0);
    });
    return Object.values(map).sort((a, b) => b.revenue - a.revenue).map(s => Object.assign(s, { aov: s.count ? s.revenue / s.count : 0 }));
  }

  function monthOverMonth() {
    return sortedPeriods().map(p => {
      const k = kpis(p.invoices, p.lineItems);
      return { key: p.key, label: periodShortLabel(p), fullLabel: periodLabel(p), revenue: k.revenue, count: k.count, aov: k.aov };
    });
  }

  function freebies(lineItems) {
    const map = {};
    lineItems.filter(li => li.category === 'Giveaways').forEach(li => {
      const key = li.description;
      map[key] = (map[key] || 0) + (li.qty || 1);
    });
    return Object.entries(map).map(([description, qty]) => ({ description, qty })).sort((a, b) => b.qty - a.qty);
  }

  function colorMix(lineItems) {
    const map = {};
    let total = 0;
    lineItems.filter(li => li.category !== 'Giveaways').forEach(li => {
      const c = colorOf(li.description);
      if (!c) return;
      map[c] = (map[c] || 0) + li.amount; total += li.amount;
    });
    return Object.entries(map).map(([name, revenue]) => ({ name, revenue, pct: total ? revenue / total : 0 })).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
  }

  // Same shape/pattern as colorMix() above, grouped by thickness instead of color — its own
  // dedicated breakdown card (like "Top Colors") rather than folded into Top Products' own rows.
  function thicknessMix(lineItems) {
    const map = {};
    let total = 0;
    lineItems.filter(li => li.category !== 'Giveaways').forEach(li => {
      const th = thicknessOf(li.description);
      if (!th) return;
      map[th] = (map[th] || 0) + li.amount; total += li.amount;
    });
    return Object.entries(map).map(([name, revenue]) => ({ name, revenue, pct: total ? revenue / total : 0 })).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
  }

  /* ============================== SVG / CHART BUILDERS ============================== */
  function sparklineSvg(points, w, h, color) {
    if (!points.length) return '';
    const max = Math.max.apply(null, points.concat(0));
    const min = 0;
    const step = w / Math.max(1, points.length - 1);
    const pts = points.map((v, i) => {
      const x = i * step;
      const y = h - ((v - min) / (max - min || 1)) * h;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/></svg>';
  }

  // points: [{key,label,fullLabel,revenue,count}] — see granularSeries(). Works the same regardless
  // of whether the caller is plotting daily, monthly, quarterly, or yearly buckets (feature 2).
  // opts.comparePoints: same shape, same length-order, aligned by INDEX (day-of-month position,
  // not by date) — the previous period's daily series, drawn as a de-emphasized reference line
  // (dataviz skill's "Emphasis" form: one hue for the series that matters, gray for context) so
  // "are we ahead of last month" reads at a glance instead of only in the text callouts below.
  // opts.showWeekend: true for daily granularity — shades Sat/Sun columns so the week's rhythm is
  // visible without counting bars.
  function renderTrendChart(container, points, metric, opts) {
    opts = opts || {};
    const comparePoints = opts.comparePoints || null;
    if (!points.length) { container.innerHTML = '<div class="empty-msg">' + t('noData') + '</div>'; return; }

    const w = 900, h = 220, padL = 46, padB = 26, padT = 10, padR = 10;
    const innerW = w - padL - padR, innerH = h - padT - padB;
    const values = points.map(d => metric === 'count' ? d.count : d.revenue);
    const compareValues = comparePoints ? comparePoints.map(d => metric === 'count' ? d.count : d.revenue) : [];
    const max = Math.max.apply(null, values.concat(compareValues).concat(1)) * 1.15;
    const stepX = innerW / Math.max(1, points.length - 1);
    const pts = points.map((d, i) => {
      const x = padL + i * stepX;
      const y = padT + innerH - (values[i] / max) * innerH;
      return { x, y, d };
    });
    // Aligned by array index (this month's day 5 sits above last month's day 5), not by calendar
    // date — that's the whole point of a period-over-period overlay. A shorter previous month just
    // stops early; the current line still runs its own full length.
    const comparePts = comparePoints ? comparePoints.map((d, i) => ({
      x: padL + i * stepX, y: padT + innerH - (compareValues[i] / max) * innerH, d,
    })) : [];

    const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const areaPath = linePath + ' L' + pts[pts.length - 1].x.toFixed(1) + ',' + (padT + innerH) + ' L' + pts[0].x.toFixed(1) + ',' + (padT + innerH) + ' Z';
    const comparePath = comparePts.length ? comparePts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') : '';

    const gridLines = [0, 0.25, 0.5, 0.75, 1].map(gt => {
      const y = padT + innerH * (1 - gt);
      const val = metric === 'count' ? Math.round(max * gt) : fmtBaht(max * gt);
      return '<line class="grid-line" x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>' +
        '<text class="axis-label" x="4" y="' + (y + 3).toFixed(1) + '">' + val + '</text>';
    }).join('');

    let weekendBands = '';
    if (opts.showWeekend) {
      weekendBands = pts.map(p => {
        const dow = new Date(p.d.key + 'T00:00:00').getDay();
        if (dow !== 0 && dow !== 6) return '';
        return '<rect class="weekend-band" x="' + (p.x - stepX / 2).toFixed(1) + '" y="' + padT + '" width="' + stepX.toFixed(1) + '" height="' + innerH + '"/>';
      }).join('');
    }

    const everyN = Math.max(1, Math.ceil(points.length / 10));
    const xLabels = pts.filter((p, i) => i % everyN === 0).map(p => '<text class="axis-label" x="' + p.x.toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle">' + esc(p.d.label) + '</text>').join('');
    const last = pts[pts.length - 1];

    // Selective direct label (marks-and-anatomy: "label the endpoint, the extreme, or the one
    // series that matters" — never every point): the single highest day in the CURRENT series.
    // Skipped when the peak IS the last point (the end-dot already marks it, so a second label
    // would sit right on top of it) or when every value is zero (nothing to call out).
    let peakIdx = 0;
    values.forEach((v, i) => { if (v > values[peakIdx]) peakIdx = i; });
    const peak = pts[peakIdx];
    let peakMarker = '';
    if (peakIdx !== pts.length - 1 && values[peakIdx] > 0) {
      const peakLabelVal = metric === 'count' ? fmtNum(values[peakIdx]) : fmtBaht(values[peakIdx]);
      const anchor = peakIdx === 0 ? 'start' : 'middle';
      peakMarker = '<circle class="dot-peak" cx="' + peak.x.toFixed(1) + '" cy="' + peak.y.toFixed(1) + '" r="4"/>' +
        '<text class="peak-label" x="' + peak.x.toFixed(1) + '" y="' + Math.max(padT + 10, peak.y - 10).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(t('peakShort')) + ' ' + esc(peakLabelVal) + '</text>';
    }

    const legend = comparePts.length
      ? '<div class="trend-legend">' +
        '<span class="key"><svg width="16" height="4"><line x1="0" y1="2" x2="16" y2="2" stroke="' + cssVar('--cat-1') + '" stroke-width="2"/></svg>' + esc(t('legendThisPeriod')) + '</span>' +
        '<span class="key"><svg width="16" height="4"><line x1="0" y1="2" x2="16" y2="2" stroke="' + cssVar('--muted') + '" stroke-width="2"/></svg>' + esc(t('legendLastPeriod')) + '</span>' +
        '</div>'
      : '';

    container.innerHTML =
      '<div class="chart-wrap"><svg class="svgchart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' +
      weekendBands + gridLines +
      '<line class="baseline" x1="' + padL + '" x2="' + (w - padR) + '" y1="' + (padT + innerH) + '" y2="' + (padT + innerH) + '"/>' +
      (comparePath ? '<path class="line-prev" d="' + comparePath + '"/>' : '') +
      '<path class="area" d="' + areaPath + '"/>' +
      '<path class="line" d="' + linePath + '"/>' +
      peakMarker +
      '<circle class="dot-end" cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="4"/>' +
      xLabels +
      '<rect id="trendHoverRect" x="' + padL + '" y="' + padT + '" width="' + innerW + '" height="' + innerH + '" fill="transparent"/>' +
      '</svg><div class="crosshair" id="trendCrosshair"></div></div>' + legend;

    const svg = container.querySelector('svg');
    const rect = container.querySelector('#trendHoverRect');
    const crosshair = container.querySelector('#trendCrosshair');
    // "The crosshair finds the X... snaps to the nearest data position" (interaction.md) — shared by
    // hover and click, so clicking anywhere near a date registers as that date, not a precise
    // pixel-hunt for a 2px line.
    function nearestIdx(evt) {
      const svgRect = svg.getBoundingClientRect();
      const scaleX = w / svgRect.width;
      const localX = (evt.clientX - svgRect.left) * scaleX;
      return Math.max(0, Math.min(pts.length - 1, Math.round((localX - padL) / stepX)));
    }
    function handleMove(evt) {
      const idx = nearestIdx(evt);
      const p = pts[idx];
      const svgRect = svg.getBoundingClientRect();
      const pxLeft = (p.x / w) * svgRect.width;
      crosshair.style.display = 'block';
      crosshair.style.left = pxLeft + 'px';
      // "One tooltip, every series" (dataviz skill, interaction.md) — the comparison value rides
      // the same tooltip at this X rather than making the reader hover the gray line directly.
      let tip = '<div class="tt-title">' + esc(p.d.fullLabel) + '</div>' +
        '<span style="color:' + cssVar('--cat-1') + ';">▬</span> ' + t('revenue') + ': <b>' + fmtBaht(p.d.revenue) + '</b><br>' +
        '<span style="color:' + cssVar('--cat-1') + ';">▬</span> ' + t('invoices') + ': <b>' + p.d.count + '</b>';
      if (comparePts[idx]) {
        tip += '<hr style="border:none; border-top:1px solid var(--border); margin:5px 0;">' +
          '<span style="color:' + cssVar('--muted') + ';">▬</span> ' + esc(t('legendLastPeriod')) + ' ' + t('revenue') + ': <b>' + fmtBaht(comparePts[idx].d.revenue) + '</b>';
      }
      if (opts.onPointClick) tip += '<div style="margin-top:4px; opacity:.65; font-size:.72em;">' + esc(t('clickViewInvoices')) + '</div>';
      showTip(tip, evt.clientX, evt.clientY);
    }
    rect.addEventListener('mousemove', handleMove);
    rect.addEventListener('mouseleave', () => { crosshair.style.display = 'none'; hideTip(); });
    // Daily granularity only (opts.onPointClick is passed by the caller precisely when the plotted
    // points are real calendar dates) — click-to-drill into Invoice Explorer for that date, same
    // pattern Heatmap's day cells already use (goDrillDate).
    if (opts.onPointClick) {
      rect.style.cursor = 'pointer';
      rect.addEventListener('click', (evt) => { opts.onPointClick(pts[nearestIdx(evt)].d); });
    }
  }

  // Feature 2 (flexible date selection): normalizes daily/monthly/quarterly/yearly into the same
  // {key,label,fullLabel,revenue,count} shape renderTrendChart expects. Monthly+ granularities
  // intentionally span ALL loaded periods (a single month of "quarterly" data isn't meaningful),
  // while daily stays scoped to whichever period the global selector has chosen.
  function granularSeries(granularity) {
    if (granularity === 'monthly') {
      return sortedPeriods().map(p => { const k = kpis(p.invoices, p.lineItems); return { key: p.key, label: periodShortLabel(p), fullLabel: periodLabel(p), revenue: k.revenue, count: k.count }; });
    }
    if (granularity === 'quarterly' || granularity === 'yearly') {
      const buckets = {};
      sortedPeriods().forEach(p => {
        const k = kpis(p.invoices, p.lineItems);
        let bk;
        if (granularity === 'quarterly') { const [y, m] = p.key.split('-').map(Number); bk = y + '-Q' + (Math.floor((m - 1) / 3) + 1); }
        else { bk = p.key.slice(0, 4); }
        if (!buckets[bk]) buckets[bk] = { revenue: 0, count: 0 };
        buckets[bk].revenue += k.revenue; buckets[bk].count += k.count;
      });
      return Object.keys(buckets).sort().map(k => ({ key: k, label: k, fullLabel: k, revenue: buckets[k].revenue, count: buckets[k].count }));
    }
    const period = currentPeriod();
    if (!period) return [];
    return dailySeries(period).map(d => ({ key: d.date, label: fmtDateShort(d.date), fullLabel: fmtDateFull(d.date), revenue: d.revenue, count: d.count }));
  }

  // The Trend chart's "vs last period" overlay (renderTrendChart's comparePoints) — only meaningful
  // for a single specific month (schema-wise the same scope restriction the two text-only compare
  // callouts already use below the chart), and only for daily granularity: monthly/quarterly/yearly
  // already plot the full loaded history, so "previous period" there would just be the same line
  // shifted one point left, not a new comparison.
  function previousPeriodDailySeries(period) {
    if (!period || isCombinedScope(period.key)) return null;
    const prev = prevPeriodOf(period.key);
    if (!prev) return null;
    return dailySeries(prev).map(d => ({ key: d.date, label: fmtDateShort(d.date), fullLabel: fmtDateFull(d.date), revenue: d.revenue, count: d.count }));
  }

  // Bar height now matches the SAME metric the trend chart above is showing (STATE.trendMetric —
  // Revenue or Invoice Count), instead of always plotting average-revenue-per-invoice regardless of
  // that toggle. The old always-AOV version looked like a plain "which day is busiest" chart but
  // actually answered a narrower question (typical order size on that weekday), which could make a
  // day with few but large orders (e.g. Friday) look like the standout day even when its total
  // revenue barely led the pack — verified against the real data: total-revenue and avg-per-invoice
  // rank the top 3 weekdays in a different order. Direct value labels (marks-and-anatomy: "Columns
  // -> value on the cap" — fine to label every bar here since there are only 7, not a dense line)
  // replace the hover-only readout so the chart is understandable without moving the mouse.
  function renderDowChart(container, dow, metric) {
    const vals = dow.map(d => metric === 'count' ? d.count : d.total);
    const max = Math.max.apply(null, vals.concat(1));
    // Capped at 76% (not 100%) of the container height — the value label sits above the bar inside
    // the same fixed-height column, so the tallest bar needs to leave it headroom rather than push
    // it past the card's edge.
    container.innerHTML = '<div class="colchart">' + dow.map((d, i) => {
      const v = vals[i];
      const pct = max ? Math.max((v / max) * 76, v > 0 ? 2 : 0) : 0;
      const label = metric === 'count' ? fmtNum(v) : fmtBahtCompact(v);
      return '<div class="col" data-label="' + esc(d.label) + '" data-total="' + d.total + '" data-avg="' + d.avg + '" data-count="' + d.count + '">' +
        '<div class="colval">' + (v > 0 ? esc(label) : '') + '</div>' +
        '<div class="bar" style="height:' + pct.toFixed(1) + '%; background:' + cssVar('--cat-1') + '"></div>' +
        '<div class="colcap">' + esc(d.label) + '</div></div>';
    }).join('') + '</div>';
    container.querySelectorAll('.col').forEach(el => {
      el.addEventListener('mousemove', (evt) => {
        showTip('<div class="tt-title">' + esc(el.dataset.label) + '</div>' +
          t('revenue') + ': <b>' + fmtBaht(+el.dataset.total) + '</b><br>' +
          t('invoices') + ': <b>' + el.dataset.count + '</b><br>' +
          t('avgRevenue') + ': <b>' + fmtBaht(+el.dataset.avg) + '</b>', evt.clientX, evt.clientY);
      });
      el.addEventListener('mouseleave', hideTip);
    });
  }

  function renderBarList(container, items, opts) {
    opts = opts || {};
    const max = Math.max.apply(null, items.map(i => i.value).concat(1));
    container.innerHTML = '<div class="barlist">' + items.map((it, idx) => {
      const pct = max ? (it.value / max) * 100 : 0;
      const color = it.color || cssVar('--cat-1');
      const sel = opts.selectedKey && opts.selectedKey === it.key ? ' selected' : '';
      return '<div class="row' + sel + '" data-idx="' + idx + '">' +
        '<div class="lbl"><span class="name">' + esc(it.label) + '</span>' + (it.meta ? '<span class="meta">' + esc(it.meta) + '</span>' : '') + '</div>' +
        '<div class="val tabular">' + esc(it.valueLabel != null ? it.valueLabel : fmtBaht(it.value)) + '</div>' +
        '<div class="track"><div class="fill" style="width:' + pct.toFixed(1) + '%; background:' + color + '"></div></div>' +
        '</div>';
    }).join('') + (items.length ? '' : '<div class="empty-msg">' + t('noData') + '</div>') + '</div>';
    if (opts.tooltip) {
      container.querySelectorAll('.row').forEach((el, idx) => {
        el.addEventListener('mousemove', (evt) => { showTip(opts.tooltip(items[idx]), evt.clientX, evt.clientY); });
        el.addEventListener('mouseleave', hideTip);
      });
    }
    if (opts.onClick) {
      container.querySelectorAll('.row').forEach((el, idx) => {
        el.addEventListener('click', () => opts.onClick(items[idx]));
      });
    }
  }

  // items: [{label, value, color?, count?, aov?}]. Renders a donut (not a filled pie) with a
  // center total, plus a detailed legend — name, value, and percent always visible (never
  // hover-only), a per-row mini share-bar, and an optional count/AOV sub-line. Each slice gets a
  // distinct color: --pie-1..5 by rank position (falls back for a 6th+ slot, though callers so far
  // always pass an explicit color for anything past 5, e.g. the "Other" slice's --cat-other) unless
  // it.color overrides. --pie-1..5 (not --cat-*) specifically because that's the validated set —
  // see the --pie-* token comment where they're defined.
  function renderPieChart(container, items, opts) {
    opts = opts || {};
    const total = items.reduce((a, i) => a + i.value, 0);
    const size = opts.size || 240, r = size * 0.46, r0 = r * 0.58, cx = size / 2, cy = size / 2;
    const palette = ['--pie-1', '--pie-2', '--pie-3', '--pie-4', '--pie-5'];
    let angle = -Math.PI / 2;
    const slices = items.map((it, idx) => {
      const frac = total ? it.value / total : 0;
      const a0 = angle, a1 = angle + frac * 2 * Math.PI;
      angle = a1;
      const color = it.color || cssVar(palette[idx % palette.length]);
      if (frac >= 0.9999) {
        // A single 100%-share slice can't be drawn as an annulus sector (start==end point) —
        // draw a full ring instead (outer circle + an inner "hole" circle in the surface color).
        return { it, idx, color, frac, full: true, midAngle: -Math.PI / 2 };
      }
      const ox0 = cx + r * Math.cos(a0), oy0 = cy + r * Math.sin(a0);
      const ox1 = cx + r * Math.cos(a1), oy1 = cy + r * Math.sin(a1);
      const ix1 = cx + r0 * Math.cos(a1), iy1 = cy + r0 * Math.sin(a1);
      const ix0 = cx + r0 * Math.cos(a0), iy0 = cy + r0 * Math.sin(a0);
      const largeArc = (a1 - a0) > Math.PI ? 1 : 0;
      const d = 'M' + ox0.toFixed(2) + ',' + oy0.toFixed(2) +
        ' A' + r + ',' + r + ' 0 ' + largeArc + ' 1 ' + ox1.toFixed(2) + ',' + oy1.toFixed(2) +
        ' L' + ix1.toFixed(2) + ',' + iy1.toFixed(2) +
        ' A' + r0 + ',' + r0 + ' 0 ' + largeArc + ' 0 ' + ix0.toFixed(2) + ',' + iy0.toFixed(2) + ' Z';
      return { it, idx, color, frac, d, midAngle: (a0 + a1) / 2 };
    });

    // Inline % labels — only where the slice is wide enough for the text to sit with comfortable
    // padding (measured via arc length at the label's radius, not eyeballed); thin slices skip the
    // inline label and rely on the legend + tooltip instead, per the "never clip a label" rule.
    const midR = (r + r0) / 2;
    const pctFontSize = size >= 240 ? 11 : 9;
    const pctLabels = slices.filter(s => {
      const arcLen = s.full ? 2 * Math.PI * midR : s.frac * 2 * Math.PI * midR;
      return arcLen >= pctFontSize * 4.2; // ~ "23.4%" at this font size, with padding
    }).map(s => {
      const lx = cx + midR * Math.cos(s.midAngle), ly = cy + midR * Math.sin(s.midAngle);
      const pct = total ? (s.it.value / total * 100) : 0;
      return '<text x="' + lx.toFixed(2) + '" y="' + ly.toFixed(2) + '" data-idx="' + s.idx + '" text-anchor="middle" dominant-baseline="central" ' +
        'style="font-size:' + pctFontSize + 'px; font-weight:700; fill:' + textOnColor(s.color) + '; pointer-events:none;">' + pct.toFixed(1) + '%</text>';
    });

    const centerLabel = opts.centerLabel != null ? opts.centerLabel : (fmtNum(items.length) + ' ' + t('items'));
    const svg = '<div class="piechart-block"><svg class="piechart" viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
      slices.map(s => s.full
        ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + s.color + '" data-idx="' + s.idx + '"/><circle cx="' + cx + '" cy="' + cy + '" r="' + r0 + '" fill="var(--surface)" data-idx="' + s.idx + '"/>'
        : '<path d="' + s.d + '" fill="' + s.color + '" data-idx="' + s.idx + '" stroke="var(--surface)" stroke-width="2"/>'
      ).join('') + pctLabels.join('') + '</svg>' +
      '<div class="piechart-center"><span class="val">' + fmtBahtCompact(total) + '</span><span class="lbl">' + esc(centerLabel) + '</span></div></div>';

    const legend = '<div class="pie-legend">' + items.map((it, idx) => {
      const pct = total ? (it.value / total * 100) : 0;
      const sub = (it.count != null) ? ('<div class="pie-legend-sub">' + fmtNum(it.count) + ' ' + t('invoicesWord') + (it.aov != null ? ' · ' + t('aov') + ' ' + fmtBaht(it.aov) : '') + '</div>') : '';
      return '<div class="pie-legend-row" data-idx="' + idx + '">' +
        '<div class="pie-legend-top"><span class="sq" style="background:' + slices[idx].color + '"></span>' +
        '<span class="name">' + esc(it.label) + '</span><span class="val tabular">' + fmtBaht(it.value) + '</span></div>' +
        '<div class="pie-legend-bottom"><div class="mini-track"><div class="mini-fill" style="width:' + pct.toFixed(1) + '%; background:' + slices[idx].color + '"></div></div>' +
        '<span class="pct">' + pct.toFixed(1) + '%</span></div>' + sub + '</div>';
    }).join('') + (items.length ? '' : '<div class="empty-msg">' + t('noData') + '</div>') + '</div>';

    container.innerHTML = items.length ? ('<div class="pie-wrap">' + svg + legend + '</div>') : ('<div class="empty-msg">' + t('noData') + '</div>');
    if (!items.length) return;

    function showFor(idx, evt) {
      const it = items[idx];
      const pct = total ? (it.value / total * 100) : 0;
      const body = opts.tooltip ? opts.tooltip(it) : (fmtBaht(it.value) + ' · ' + pct.toFixed(1) + '%');
      showTip('<div class="tt-title">' + esc(it.label) + '</div>' + body, evt.clientX, evt.clientY);
    }
    // Hovering either the slice or its legend row highlights that slice and dims the rest — the
    // "isolate on hover" pattern donut+legend pairs typically get, so identity isn't purely a
    // hover-vs-not toggle on one element at a time.
    const allMarks = container.querySelectorAll('[data-idx]');
    function setActive(idx) {
      allMarks.forEach(el => {
        const match = +el.dataset.idx === idx;
        if (el.tagName === 'path' || el.tagName === 'circle' || el.tagName === 'text') el.style.opacity = (idx == null || match) ? '1' : '.28';
      });
    }
    allMarks.forEach(el => {
      const idx = +el.dataset.idx;
      el.addEventListener('mousemove', (evt) => { showFor(idx, evt); setActive(idx); });
      el.addEventListener('mouseleave', () => { hideTip(); setActive(null); });
      if (opts.onClick) el.addEventListener('click', () => opts.onClick(items[idx]));
    });
  }

  function renderSingleMonthHeatmapHtml(daily, dateFrom, title) {
    const first = new Date(dateFrom + 'T00:00:00');
    const startDow = first.getDay();
    const nonZeroDaily = daily.filter(d => d.revenue > 0);
    const revs = nonZeroDaily.map(d => d.revenue);
    const avgRev = revs.length ? revs.reduce((a, b) => a + b, 0) / revs.length : 0;
    const peakThreshold = avgRev * 1.55;
    const max = Math.max.apply(null, daily.map(d => d.revenue).concat(1));
    const dowNames = [t('dowSun'), t('dowMon'), t('dowTue'), t('dowWed'), t('dowThu'), t('dowFri'), t('dowSat')];

    let cells = dowNames.map(n => '<div class="dow">' + n + '</div>').join('');
    for (let i = 0; i < startDow; i++) cells += '<div class="cell empty"></div>';
    daily.forEach(d => {
      const t0 = d.revenue / max;
      const isPeak = d.revenue >= peakThreshold && d.revenue > 0;
      const bg = d.revenue > 0 ? seqColor(t0) : cssVar('--surface-2');
      const dayNum = +d.date.slice(-2);
      const textColor = t0 > 0.55 ? '#fff' : cssVar('--ink');
      const amtLabel = d.revenue > 0 ? fmtBahtCompact(d.revenue) : (d.count === 0 ? '—' : '฿0');
      const peakClass = isPeak ? ' peak' : '';
      cells += '<div class="cell' + peakClass + '" data-date="' + d.date + '" data-revenue="' + d.revenue + '" data-count="' + d.count + '" data-peak="' + isPeak + '" style="background:' + bg + '; color:' + textColor + '"><span class="num">' + dayNum + '</span><span class="amt tabular">' + amtLabel + '</span></div>';
    });

    return (title ? '<div class="heatmap-block-title">' + esc(title) + '</div>' : '') + '<div class="heatmap">' + cells + '</div>';
  }

  // BUG FIX (external audit #21, 2026-09-23): monthPeriod.dateFrom/dateTo are the first/last actual
  // INVOICE date in the month (deliberately — see computePeriods()'s own comment), not calendar day
  // 1 and the month's true last day. That's the right range for scoping "what invoices belong to
  // this month," but wrong for a calendar GRID: if the month's first sale wasn't until the 5th, the
  // old code fed dailySeries() a range starting on the 5th, so days 1-4 never got a cell in the
  // heatmap at all — not shown as empty, just silently absent, which reads as a rendering glitch. A
  // calendar always needs the true month boundary, independent of where the real data happens to
  // start/end within it.
  function renderHeatmapMonth(container, monthPeriod) {
    const [y, m] = monthPeriod.key.split('-').map(Number);
    const calFrom = monthPeriod.key + '-01';
    const calTo = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); // day 0 of next month = last day of this one
    const daily = dailySeriesForRange(monthPeriod.invoices, monthPeriod.lineItems, calFrom, calTo);
    let html = '<div class="heatmap-container">' + renderSingleMonthHeatmapHtml(daily, calFrom, null) + '</div>' +
      '<div class="legend-scale">' + t('low') + [0, 0.33, 0.66, 1].map(t0 => '<div class="sq" style="background:' + seqColor(t0) + '"></div>').join('') + t('high') +
      '<span class="peak-badge">★ ' + t('peakDays') + '</span></div>';

    container.innerHTML = html;
    container.querySelectorAll('.cell[data-date]').forEach(el => {
      el.addEventListener('mousemove', (evt) => {
        const isPeak = el.dataset.peak === 'true';
        const hasData = +el.dataset.count > 0;
        showTip(
          '<div class="tt-title">' + fmtDateFull(el.dataset.date) +
          (isPeak ? ' <span style="color:var(--accent); font-weight:700;">(' + t('peak') + ')</span>' : '') +
          '</div>' + t('revenue') + ': <b>' + fmtBaht(+el.dataset.revenue) + '</b><br>' + t('invoices') + ': <b>' + el.dataset.count + '</b>' +
          (hasData ? '<br><span style="opacity:.65; font-size:.72em;">' + t('clickViewInvoices') + '</span>' : ''),
          evt.clientX, evt.clientY
        );
      });
      el.addEventListener('mouseleave', hideTip);
      el.addEventListener('click', () => {
        if (+el.dataset.count === 0) return;
        hideTip();
        goDrillDate(el.dataset.date);
      });
    });
  }

  // Single-file build: "navigating" between sections just switches which one is visible and
  // updates location.hash (so back/forward + reload-to-a-section still work), instead of the
  // multi-file build's location.href page loads.
  function goToPage(id) { location.hash = id; }
  function goFilterCategory(cat) {
    STATE.filters.category = (STATE.filters.category === cat) ? null : cat;
    saveUiState();
    // Category cards now live on the Products page itself — if we're already there, goToPage()'s
    // location.hash write is a no-op (same hash doesn't fire 'hashchange'), so re-render directly.
    if (STATE.currentPage === 'products') renderCurrentPage();
    else goToPage('products');

    STATE.filters.salesperson = (STATE.filters.salesperson === code) ? null : (code || null);
    saveUiState();
    renderCurrentPage();
  }
  function clearFilter(which) {
    if (which) STATE.filters[which] = null;
    else { STATE.filters.category = null; STATE.filters.salesperson = null; }
    saveUiState();
    renderCurrentPage();
  }
  function goSearchInvoice(text) {
    STATE.invSearch = text; STATE.invLimit = 60; saveUiState();
    goToPage('invoices');
  }
  function goDrillDate(dateIso) {
    STATE.drillDate = (STATE.drillDate === dateIso) ? null : dateIso;
    // Heatmap browses months via its own independent selector (STATE.heatmapMonth), decoupled from
    // the shared period scope (STATE.currentKey) every other page — including Invoice Explorer —
    // renders against. Once the user picks a different heatmap month than whatever the global period
    // is currently scoped to, clicking a day drills to a date Invoice Explorer's own (differently-
    // scoped) invoice list doesn't contain at all, so the filtered table silently shows zero rows.
    //
    // BUG FIX (2026-09-24): the original fix for that (widen STATE.currentKey to the clicked date's
    // own month) did it UNCONDITIONALLY — even when the current scope already covered the date fine
    // (e.g. viewing the combined "2025–2026" range, or 'ALL'), it still got narrowed down to just
    // that one month. Reported directly: clicking a point on the Trend chart (same problem — daily
    // points are real dates too, see renderTrendChart's onPointClick) silently collapsed the broad
    // view down to a single month, and navigating back to Trend afterward showed that same narrowed
    // view instead of the wider one the user actually had open. Only narrow now when the date isn't
    // already inside the current period's own covered range — the one case that actually needs it.
    if (STATE.drillDate) {
      const cur = getPeriod(STATE.currentKey);
      const alreadyInScope = cur && dateIso >= cur.dateFrom && dateIso <= cur.dateTo;
      if (!alreadyInScope) {
        const monthKey = dateIso.slice(0, 7);
        if (getPeriod(monthKey)) STATE.currentKey = monthKey;
      }
    }
    saveUiState();
    goToPage('invoices');
  }
