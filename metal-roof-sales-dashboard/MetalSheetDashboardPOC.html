      // 2. Render Live Calculation Card (breaks down the calculation step by step, live)
      const liveCalcEl = document.getElementById('forecastLiveCalcWrap');
      if (liveCalcEl) {
        const liveCalcType = STATE.forecastLiveCalcType || 'coil';
        const activeItem = liveCalcType === 'unit'
          ? (activeAccessories.find(s => s.id === STATE.selectedUnitId) || activeAccessories[0])
          : (activeCoils.find(c => c.id === STATE.selectedCoilId) || activeCoils[0]);

        if (activeItem) {
          const m0 = activeItem.mQtys[0] || 0;
          const m1 = activeItem.mQtys[1] || 0;
          const m2 = activeItem.mQtys[2] || 0;
          const m3Sum = m0 + m1 + m2;
          const qtyUnit = liveCalcType === 'unit' ? (activeItem.unit || '') : t('meterAbbr');
          const qtyWord = liveCalcType === 'unit' ? (activeItem.unit || '') : t('metersWord');
          const activeItemDisplay = liveCalcType === 'unit'
            ? (esc(activeItem.sku || '') + (activeItem.sku ? ' — ' : '') + esc(activeItem.description))
            : ((activeItem.sku && activeItem.sku !== '—' ? (esc(activeItem.sku) + ' — ') : '') + esc(activeItem.name || activeItem.id));

          const step4Html = liveCalcType === 'unit'
            ? '<div style="font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase;">' + t('fcStep4UnitTitle') + '</div>' +
              '<div style="font-size:.84rem; font-weight:700; color:var(--accent); margin-top:4px;">' + fmtBaht(activeItem.projectedRevenue) + '</div>' +
              '<div style="font-size:.7rem; color:var(--muted); margin-top:2px;">(' + fmtNum(activeItem.recommendedQty) + ' ' + qtyWord + ' × ' + fmtBaht(activeItem.avgPrice) + ')</div>'
            : '<div style="font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase;">' + t('fcStep4Title') + '</div>' +
              '<div style="font-size:.84rem; font-weight:700; color:var(--accent); margin-top:4px;">' + fmtBaht(activeItem.projectedRevenue) + '</div>' +
              '<div style="font-size:.7rem; color:var(--muted); margin-top:2px;">(' + fmtNum(activeItem.recommendedQty) + ' ' + qtyWord + ' × ' + fmtBaht(activeItem.avgPrice) + '/' + t('meterAbbr') + ')</div>';

          liveCalcEl.innerHTML = '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;">' +
            '<div style="font-size:.92rem; font-weight:700; display:flex; align-items:center; gap:8px;">' +
              icon('history', 17) + ' ' + t('fcLiveCalcTitle') + ' <span style="color:var(--accent);">' + activeItemDisplay + '</span>' +
            '</div>' +
            '<span style="font-size:.74rem; color:var(--muted);">' + t('fcLiveCalcHint') + '</span>' +
          '</div>' +

          '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">' +
            '<div style="background:var(--surface-2); padding:10px 14px; border-radius:8px;">' +
              '<div style="font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase;">' + t('fcStep1Title') + '</div>' +
              '<div style="font-size:.84rem; font-weight:700; margin-top:4px;">' + t('total') + ' ' + fmtNum(m3Sum) + ' ' + qtyUnit + '</div>' +
              '<div style="font-size:.7rem; color:var(--muted); margin-top:2px;">(' + fmtNum(m2) + ' · ' + fmtNum(m1) + ' · ' + fmtNum(m0) + ' ' + qtyUnit + ')</div>' +
            '</div>' +

            '<div style="background:var(--surface-2); padding:10px 14px; border-radius:8px;">' +
              '<div style="font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase;">' + t('fcStep2Title') + '</div>' +
              '<div style="font-size:.84rem; font-weight:700; color:var(--accent); margin-top:4px;">' + fmtNum(activeItem.baseForecast) + ' ' + qtyWord + '</div>' +
              '<div style="font-size:.7rem; color:var(--muted); margin-top:2px;">(' + fmtNum(m0) + '×50% + ' + fmtNum(m1) + '×30% + ' + fmtNum(m2) + '×20%)</div>' +
            '</div>' +

            '<div style="background:var(--surface-2); padding:10px 14px; border-radius:8px;">' +
              '<div style="font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase;">' + t('fcStep3TitlePrefix') + bufferPct + '%)</div>' +
              '<div style="font-size:.84rem; font-weight:700; color:var(--good); margin-top:4px;">+' + fmtNum(activeItem.safetyBuffer) + ' ' + qtyWord + '</div>' +
              '<div style="font-size:.7rem; color:var(--muted); margin-top:2px;">' + t('fcStep3RecommendedLabel') + ' <b>' + fmtNum(activeItem.recommendedQty) + ' ' + qtyWord + '</b></div>' +
            '</div>' +

            '<div style="background:var(--surface-2); padding:10px 14px; border-radius:8px;">' +
              step4Html +
            '</div>' +
          '</div>';
        }
      }

      // 2.5. Render Backtest & Forecast Accuracy (MAPE) Table (separated for Roof vs Hardware)
      const btWrap = document.getElementById('forecastBacktestBody');
      if (btWrap) {
        const btRes = computeBacktestAccuracy(sp);
        if (!btRes.available) {
          btWrap.innerHTML = '<div style="padding:16px; text-align:center; color:var(--muted); font-size:.84rem;">' + icon('history', 16) + ' ' + t('fcBacktestNeedMore') + '</div>';
        } else {
          const activeTab = STATE.forecastBacktestTab || 'roof';
          const series = activeTab === 'roof' ? btRes.roof : btRes.hardware;
          const isRoof = activeTab === 'roof';

          // Update active chip UI state
          document.querySelectorAll('#forecastBacktestToggle button[data-tab]').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === activeTab);
          });

          // Summary KPI Pills
          const targetMetBadge = series.meanMape <= 16.0
            ? '<span class="badge-tag rising" style="font-weight:700;">' + icon('checkCircle', 12) + ' ' + t('fcBacktestTargetMet') + '</span>'
            : '<span class="badge-tag steady" style="font-weight:700;">' + t('fcBacktestTargetNear') + '</span>';

          // BUG FIX (external audit #14, 2026-09-23): this tile used to hardcode 'good' green
          // regardless of the actual meanAcc value — combined with the unclamped-average bug fixed
          // in computeBacktestAccuracy(), a bad backtest could show a negative accuracy percentage
          // in a green "this is fine" tile. meanAcc is now clamped at the source; this color now
          // also actually reflects the value, same thresholds as the per-row badge below.
          const accSummaryColor = series.meanAcc >= 90 ? 'var(--good)' : (series.meanAcc >= 75 ? 'var(--accent)' : 'var(--critical)');
          const summaryHtml = '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-bottom:16px;">' +
            '<div style="background:var(--surface-2); padding:12px 16px; border-radius:8px; border-left:3px solid ' + accSummaryColor + ';">' +
              '<div style="font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase;">' + t('fcBacktestAvgAccuracy') + '</div>' +
              '<div style="font-size:1.35rem; font-weight:800; color:' + accSummaryColor + '; margin-top:2px;">' + series.meanAcc + '%</div>' +
              '<div style="font-size:.7rem; color:var(--muted); margin-top:2px;">' + t('fcBacktestTestedMonths').replace('{n}', btRes.totalMonthsTested) + '</div>' +
            '</div>' +
            '<div style="background:var(--surface-2); padding:12px 16px; border-radius:8px; border-left:3px solid var(--accent);">' +
              '<div style="font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase;">' + t('fcBacktestAvgMape') + '</div>' +
              '<div style="font-size:1.35rem; font-weight:800; color:var(--accent); margin-top:2px;">' + series.meanMape + '%</div>' +
              '<div style="font-size:.7rem; color:var(--muted); margin-top:2px;">' + t('fcBacktestCeoBar') + '</div>' +
            '</div>' +
            '<div style="background:var(--surface-2); padding:12px 16px; border-radius:8px; display:flex; flex-direction:column; justify-content:center;">' +
              '<div style="font-size:.72rem; color:var(--muted); font-weight:600; margin-bottom:6px;">' + t('fcBacktestEvalTitle') + '</div>' +
              '<div>' + targetMetBadge + '</div>' +
            '</div>' +
          '</div>';

          // Table Rows
          let rowsHtml = '';
          series.rows.forEach((r, idx) => {
            const mInfo = getMonthLabelTH(r.monthKey);
            const mLabel = STATE.lang === 'th' ? mInfo.thLabel : mInfo.label;
            const actualFmt = isRoof ? (fmtNum(r.actual) + ' ' + t('meterAbbr')) : fmtBaht(r.actual);
            const forecastFmt = isRoof ? (fmtNum(r.forecast) + ' ' + t('meterAbbr')) : fmtBaht(r.forecast);
            const diffSign = r.diff > 0 ? '+' : (r.diff < 0 ? '-' : '');
            const diffFmt = isRoof ? (diffSign + fmtNum(Math.abs(r.diff)) + ' ' + t('meterAbbr')) : (diffSign + fmtBaht(Math.abs(r.diff)));
            const diffColor = r.diff > 0 ? 'var(--accent)' : 'var(--muted)';

            // BUG FIX (external audit #14, 2026-09-23): a zeroActual row has no meaningful % error
            // (division by zero, not zero error) — render '—' instead of a fabricated 0%/100% that
            // would otherwise show as a perfect score.
            const apeColor = r.zeroActual ? 'var(--muted)' : (r.mape <= 10 ? 'var(--good)' : (r.mape <= 20 ? 'var(--accent)' : 'var(--critical)'));
            const accTagClass = r.zeroActual ? 'steady' : (r.accuracy >= 90 ? 'rising' : (r.accuracy >= 75 ? 'steady' : 'fading'));
            const apeText = r.zeroActual ? '—' : (r.mape + '%');
            const accText = r.zeroActual ? '—' : (r.accuracy + '%');

            rowsHtml += '<tr>' +
              '<td style="text-align:center; color:var(--muted); font-size:.78rem;">' + (idx + 1) + '</td>' +
              '<td style="font-weight:700; color:var(--ink); font-size:.84rem;">' + esc(mLabel) + '</td>' +
              '<td class="num" style="font-family:monospace; font-size:.84rem; font-weight:600;">' + actualFmt + '</td>' +
              '<td class="num" style="font-family:monospace; font-size:.84rem; font-weight:700; color:var(--accent);">' + forecastFmt + '</td>' +
              '<td class="num" style="font-family:monospace; font-size:.82rem; color:' + diffColor + ';">' + diffFmt + '</td>' +
              '<td class="num" style="font-weight:700; font-family:monospace; font-size:.88rem; color:' + apeColor + ';">' + apeText + '</td>' +
              '<td style="text-align:center;"><span class="badge-tag ' + accTagClass + '" style="font-weight:700;">' + accText + '</span></td>' +
              '<td style="font-size:.78rem; color:var(--ink);">' + esc(t(r.noteKey)) + '</td>' +
            '</tr>';
          });

          const tableHtml = '<div class="table-scroll-wrap"><table class="data fixed-cols" style="min-width:980px;">' +
            '<thead><tr>' +
              '<th style="width:36px; text-align:center;">#</th>' +
              '<th style="width:130px;">' + t('fcBacktestColMonth') + '</th>' +
              '<th class="num" style="width:130px;">' + t('fcBacktestColActual') + '</th>' +
              '<th class="num" style="width:140px;">' + t('fcBacktestColForecast') + '</th>' +
              '<th class="num" style="width:120px;">' + t('fcBacktestColDiff') + '</th>' +
              '<th class="num" style="width:115px;">' + t('fcBacktestColMape') + '</th>' +
              '<th style="text-align:center; width:110px;">' + t('fcBacktestColAccuracy') + '</th>' +
              '<th>' + t('fcBacktestColNote') + '</th>' +
            '</tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
            '<tfoot><tr style="background:var(--surface-2); font-weight:700; border-top:2px solid var(--border);">' +
              '<td colspan="5" style="text-align:right; padding:10px 14px;">' + t('fcGrandTotalLabel') + ' (' + t('fcBacktestAvgAccuracy') + '):</td>' +
              '<td class="num" style="padding:10px 14px; font-weight:800; color:var(--accent); font-size:.92rem;">' + series.meanMape + '%</td>' +
              '<td style="text-align:center; padding:10px 14px;"><span class="badge-tag ' + (series.meanAcc >= 90 ? 'rising' : (series.meanAcc >= 75 ? 'steady' : 'fading')) + '" style="font-size:.82rem; font-weight:800;">' + series.meanAcc + '%</span></td>' +
              '<td style="font-size:.78rem; color:var(--muted);">' + (isRoof ? t('fcBacktestRoofSummaryNote') : t('fcBacktestHwSummaryNote')) + '</td>' +
            '</tr></tfoot>' +
          '</table></div>';

          btWrap.innerHTML = summaryHtml + tableHtml;
        }
      }

      // 3. Render Coil Table with Separated Columns
      const coilTblWrap = document.getElementById('forecastCoilTableWrap');
      if (coilTblWrap) {
        let rows = activeCoils;
        if (STATE.forecastCoilFilter === 'A') {
          rows = rows.filter(r => r.abc === 'A');
        }
        const qCoil = (STATE.forecastCoilSearch || '').toLowerCase().trim();
        if (qCoil) {
          rows = rows.filter(r =>
            (r.id || '').toLowerCase().indexOf(qCoil) !== -1 ||
            (r.sku || '').toLowerCase().indexOf(qCoil) !== -1 ||
            (r.name || '').toLowerCase().indexOf(qCoil) !== -1 ||
            (r.color || '').toLowerCase().indexOf(qCoil) !== -1 ||
            (r.thickness || '').toLowerCase().indexOf(qCoil) !== -1
          );
        }

        const totalCoilRows = rows.length;
        const coilLimit = STATE.forecastCoilLimit || 15;
        const rowsShown = rows.slice(0, coilLimit);

        const countLabelEl = document.getElementById('forecastCoilCountLabel');
        if (countLabelEl) {
          countLabelEl.textContent = t('showing') + ' ' + Math.min(rowsShown.length, totalCoilRows) + ' ' + t('of') + ' ' + totalCoilRows + ' ' + t('specsWord');
        }

        const totalFilteredM2 = rows.reduce((a, c) => a + (c.mQtys[2] || 0), 0);
        const totalFilteredM1 = rows.reduce((a, c) => a + (c.mQtys[1] || 0), 0);
        const totalFilteredM0 = rows.reduce((a, c) => a + (c.mQtys[0] || 0), 0);
        const totalFilteredBaseMeters = rows.reduce((a, c) => a + c.baseForecast, 0);
        const totalFilteredBufferMeters = rows.reduce((a, c) => a + c.safetyBuffer, 0);
        const totalFilteredRecMeters = rows.reduce((a, c) => a + c.recommendedQty, 0);
        const totalFilteredTons = Number((rows.reduce((a, c) => a + c.weightTons, 0)).toFixed(1));
        const totalFilteredRolls = rows.reduce((a, c) => a + c.coils, 0);

        const totalFilteredRoofRev = rows.reduce((a, c) => a + (c.projectedRevenue || 0), 0);
        const avgFilteredPrice = totalFilteredRecMeters > 0 ? Math.round(totalFilteredRoofRev / totalFilteredRecMeters) : 0;

        let html = '<table class="data fixed-cols coil-table" style="min-width:1060px;"><thead><tr>' +
          '<th style="width:36px; text-align:center;">#</th>' +
          '<th style="width:95px;">' + t('fcColSku') + '</th>' +
          '<th>' + t('fcColSpec') + '</th>' +
          '<th style="text-align:center; width:75px;" title="' + esc(t('fcAbcTooltip')) + '">' + t('fcColClass') + '<span class="info-dot">?</span></th>' +
          '<th class="num" style="width:160px;">' + t('fcColSales3mo') + '</th>' +
          '<th class="num" style="width:90px; color:var(--good);">' + t('fcColBuffer') + ' (' + bufferPct + '%)</th>' +
          '<th class="num" style="width:125px; font-weight:700; color:var(--accent);">' + t('fcColRecommended') + '</th>' +
          '<th class="num" style="width:105px;">' + t('fcColWeight') + '</th>' +
          '<th class="num" style="width:125px; font-weight:700;">' + t('fcColOrder') + '</th>' +
          '<th style="text-align:center; width:85px;">' + t('fcColTrend') + '</th>' +
        '</tr></thead><tbody>';

        if (!rowsShown.length) {
          html += '<tr><td colspan="10" style="text-align:center; padding:30px; color:var(--muted);">' + t('noData') + '</td></tr>';
        } else {
          rowsShown.forEach((r, idx) => {
            const isSelected = STATE.selectedCoilId === r.id;
            const trendHtml = r.momentum === 'rising' ?
              '<span class="badge-tag rising">' + t('fcTrendRising') + '</span>' :
              (r.momentum === 'fading' ? '<span class="badge-tag fading">' + t('fcTrendFading') + '</span>' :
              '<span class="badge-tag steady">' + t('fcTrendSteady') + '</span>');
            const abcHtml = r.abc === 'A' ?
              '<span class="badge-tag abc-a" title="' + esc(t('fcAbcTooltip')) + '">Class A</span>' :
              (r.abc === 'B' ? '<span class="badge-tag abc-b" title="' + esc(t('fcAbcTooltip')) + '">Class B</span>' : '<span class="badge-tag abc-c" title="' + esc(t('fcAbcTooltip')) + '">Class C</span>');

            html += '<tr class="coil-row' + (isSelected ? ' selected' : '') + '" data-coil="' + esc(r.id) + '">' +
              '<td style="text-align:center; color:var(--muted); font-size:.78rem;">' + (idx + 1) + '</td>' +
              '<td style="font-family:monospace; font-size:.78rem; font-weight:700; color:var(--accent);">' + esc(r.sku || '—') + '</td>' +
              '<td>' +
                '<div class="coil-spec-cell" style="display:flex; align-items:center; gap:8px;">' +
                  '<span style="font-weight:700; color:var(--ink); font-size:.84rem;">' + esc(r.name || r.id) + '</span>' +
                  (r.thickness ? '<span class="coil-th-badge">' + esc(r.thickness) + ' mm</span>' : '') +
                '</div>' +
              '</td>' +
              '<td style="text-align:center;">' + abcHtml + '</td>' +
              '<td class="num">' +
                '<div style="font-weight:600; font-family:monospace; font-size:.84rem;">' + fmtNum(r.mQtys[2] || 0) + ' · ' + fmtNum(r.mQtys[1] || 0) + ' · ' + fmtNum(r.mQtys[0] || 0) + '</div>' +
                '<div style="font-size:.71rem; color:var(--muted); margin-top:2px;">' + t('fcAvgWmaLabel') + ' ' + fmtNum(r.baseForecast) + ' ' + t('meterPerMonth') + '</div>' +
              '</td>' +
              '<td class="num" style="color:var(--good); font-size:.82rem;">+' + fmtNum(r.safetyBuffer) + '</td>' +
              '<td class="num" style="font-weight:700; color:var(--accent); font-size:.92rem;">' + fmtNum(r.recommendedQty) + ' ' + t('meterAbbr') + '</td>' +
              '<td class="num" style="font-size:.82rem; color:var(--muted);">' + fmtBaht(r.avgPrice) + '/' + t('meterAbbr') + '</td>' +
              '<td class="num" style="font-weight:700; color:var(--ink); font-size:.88rem;">' + fmtBaht(r.projectedRevenue) + '</td>' +
              '<td style="text-align:center;">' + trendHtml + '</td>' +
            '</tr>';
          });
        }
        html += '</tbody>';

        if (rows.length > 0) {
          html += '<tfoot><tr style="background:var(--surface-2); font-weight:700; border-top:2px solid var(--border);">' +
            '<td colspan="4" style="text-align:right; font-weight:700; padding:10px 14px;">' + t('fcGrandTotalLabel') + ' (' + totalCoilRows + ' ' + t('specsWord') + '):</td>' +
            '<td class="num" style="padding:10px 14px;">' +
              '<div style="font-weight:700; font-family:monospace; font-size:.84rem;">' + fmtNum(totalFilteredM2) + ' · ' + fmtNum(totalFilteredM1) + ' · ' + fmtNum(totalFilteredM0) + '</div>' +
              '<div style="font-size:.71rem; color:var(--muted); margin-top:2px;">' + t('fcAvgWmaLabel') + ' ' + fmtNum(totalFilteredBaseMeters) + ' ' + t('meterPerMonth') + '</div>' +
            '</td>' +
            '<td class="num" style="padding:10px 14px; color:var(--good); font-size:.82rem;">+' + fmtNum(totalFilteredBufferMeters) + '</td>' +
            '<td class="num" style="padding:10px 14px; color:var(--accent); font-weight:700; font-size:.95rem;">' + fmtNum(totalFilteredRecMeters) + ' ' + t('meterAbbr') + '</td>' +
            '<td class="num" style="padding:10px 14px; color:var(--muted); font-size:.82rem;">' + fmtBaht(avgFilteredPrice) + '/' + t('meterAbbr') + '</td>' +
            '<td class="num" style="padding:10px 14px; font-weight:700; font-size:.92rem; color:var(--ink);">' + fmtBaht(totalFilteredRoofRev) + '</td>' +
            '<td></td>' +
          '</tr></tfoot>';
        }

        html += '</table>';
        coilTblWrap.innerHTML = html;

        // Wire pagination buttons (kept above the table — see the port note at the top of this page)
        const coilBtnsWrap = document.getElementById('forecastCoilBtnsWrap');
        if (coilBtnsWrap) {
          const isAll = coilLimit >= totalCoilRows;
          const limits = [15, 25, 50, 100];
          let btnsHtml = '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; width:100%; padding:6px 10px; background:var(--surface); border:1px solid var(--border); border-radius:8px;">' +
            '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">' +
              '<span style="font-size:.76rem; color:var(--muted); font-weight:600;">' + t('showPerPage') + '</span>';
          limits.forEach(n => {
            const activeClass = (!isAll && coilLimit === n) ? ' active' : '';
            btnsHtml += '<span class="chip' + activeClass + '" data-limit="' + n + '" style="cursor:pointer; font-weight:600; padding:3px 10px; font-size:.76rem;">' + n + '</span>';
          });
          btnsHtml += '<span class="chip' + (isAll ? ' active' : '') + '" data-limit="all" style="cursor:pointer; font-weight:600; padding:3px 10px; font-size:.76rem;">' + t('showAll') + ' (' + fmtNum(totalCoilRows) + ')</span>' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:8px;">';
          if (!isAll && totalCoilRows > rowsShown.length) {
            btnsHtml += '<button class="btn" id="forecastCoilMoreBtn" style="padding:4px 12px; font-size:.76rem; font-weight:600;">' + t('showMore') + ' (+15)</button>';
          }
          if (coilLimit > 15) {
            btnsHtml += '<button class="btn" id="forecastCoilLessBtn" style="padding:4px 12px; font-size:.76rem; font-weight:600;">' + t('showLess') + '</button>';
          }
          btnsHtml += '</div></div>';
          coilBtnsWrap.innerHTML = btnsHtml;

          coilBtnsWrap.querySelectorAll('.chip[data-limit]').forEach(chip => {
            chip.addEventListener('click', () => {
              const l = chip.dataset.limit;
              STATE.forecastCoilLimit = l === 'all' ? totalCoilRows : parseInt(l, 10);
              saveUiState();
              const p = currentPeriod(); if (p) PAGES.forecast.render(p);
            });
          });

          const moreBtn = document.getElementById('forecastCoilMoreBtn');
          if (moreBtn) moreBtn.addEventListener('click', () => {
            STATE.forecastCoilLimit = (STATE.forecastCoilLimit || 15) + 15;
            saveUiState();
            const p = currentPeriod(); if (p) PAGES.forecast.render(p);
          });
          const lessBtn = document.getElementById('forecastCoilLessBtn');
          if (lessBtn) lessBtn.addEventListener('click', () => {
            STATE.forecastCoilLimit = 15;
            saveUiState();
            const p = currentPeriod(); if (p) PAGES.forecast.render(p);
          });
        }

        // Wire row clicks (toggle selection on click, and scroll up with offset for sticky topbar)
        coilTblWrap.querySelectorAll('.coil-row').forEach(row => {
          row.addEventListener('click', () => {
            const isAlreadySelected = (STATE.selectedCoilId === row.dataset.coil && STATE.forecastLiveCalcType === 'coil');
            if (isAlreadySelected) {
              STATE.selectedCoilId = null;
            } else {
              STATE.selectedCoilId = row.dataset.coil;
              STATE.forecastLiveCalcType = 'coil';

            saveUiState();
            const p = currentPeriod(); if (p) PAGES.forecast.render(p);
            requestAnimationFrame(() => {
              const el = document.getElementById('forecastLiveCalcWrap');
              if (el) {
                const topbar = document.getElementById('topnav');
                const topbarH = topbar ? topbar.offsetHeight : 64;
                const targetY = Math.max(0, el.getBoundingClientRect().top + window.pageYOffset - topbarH - 24);
                window.scrollTo({ top: targetY, behavior: 'smooth' });

            });

      // 3b. Render Unit Reorder Forecast Table — res.accessories, every SKU (not just coils),
      // recommended qty in each item's own unit. No tfoot sum across rows: unlike coils (always
      // meters), these rows mix incompatible units (pcs, kg, boxes…) — summing raw quantities across
      // different units would itself be a "doesn't add up" bug, so it's deliberately not attempted;
      // a row count is the only aggregate shown.
      const unitTblWrap = document.getElementById('forecastUnitTableWrap');
      if (unitTblWrap) {
        // Excludes coil-shaped SKUs (isCoilItem) — those are already fully represented, aggregated
        // by thickness+color, in the Coil table above; showing them again individually here would
        // recommend restocking the same physical product twice. Dead Stock (below) is NOT filtered
        // this way — a coil spec that's gone quiet is exactly the kind of thing that table should
        // still catch, it just doesn't also get a live per-SKU reorder number in two places.
        let uRows = activeAccessories;
        if (STATE.forecastUnitFilter === 'A') {
          uRows = uRows.filter(r => r.abc === 'A');
        }
        const qUnit = (STATE.forecastUnitSearch || '').toLowerCase().trim();
        if (qUnit) {
          uRows = uRows.filter(r => (r.description || '').toLowerCase().indexOf(qUnit) !== -1 || (r.sku || '').toLowerCase().indexOf(qUnit) !== -1);
        }

        const totalUnitRows = uRows.length;
        const unitLimit = STATE.forecastUnitLimit || 15;
        const uRowsShown = uRows.slice(0, unitLimit);

        const unitCountLabelEl = document.getElementById('forecastUnitCountLabel');
        if (unitCountLabelEl) {
          unitCountLabelEl.textContent = t('showing') + ' ' + Math.min(uRowsShown.length, totalUnitRows) + ' ' + t('of') + ' ' + totalUnitRows + ' ' + t('productsWord');
        }

        let uHtml = '<table class="data fixed-cols" style="min-width:1080px;"><thead><tr>' +
          '<th style="width:36px; text-align:center;">#</th>' +
          '<th style="width:110px;">' + t('fcColSku') + '</th>' +
          '<th>' + t('description') + '</th>' +

          '<th class="num" style="width:155px;">' + t('fcColSales3moGeneric') + '</th>' +
          '<th class="num" style="width:90px; color:var(--good);">' + t('fcColBuffer') + ' (' + bufferPct + '%)</th>' +
          '<th class="num" style="width:125px; font-weight:700; color:var(--accent);">' + t('fcColRecommendedGeneric') + '</th>' +
          '<th class="num" style="width:105px;">' + t('fcColUnitPrice') + '</th>' +
          '<th class="num" style="width:125px; font-weight:700;">' + t('fcColUnitOrder') + '</th>' +
          '<th style="text-align:center; width:85px;">' + t('fcColTrend') + '</th>' +

        if (!uRowsShown.length) {
          uHtml += '<tr><td colspan="10" style="text-align:center; padding:30px; color:var(--muted);">' + t('noData') + '</td></tr>';

          uRowsShown.forEach((r, idx) => {
            const isSelected = STATE.selectedUnitId === r.id;
            const unitSuffix = r.unit ? (' ' + r.unit) : '';
            const trendHtml = r.momentum === 'rising' ?
              '<span class="badge-tag rising">' + t('fcTrendRising') + '</span>' :
              (r.momentum === 'fading' ? '<span class="badge-tag fading">' + t('fcTrendFading') + '</span>' :

        unitTblWrap.querySelectorAll('.unit-row').forEach(row => {

            saveUiState();
            const p = currentPeriod(); if (p) PAGES.forecast.render(p);
            requestAnimationFrame(() => {
              const el = document.getElementById('forecastLiveCalcWrap');
              if (el) {
                const topbar = document.getElementById('topnav');

      // 4. Render Full Dead Stock Table
      const deadTblWrap = document.getElementById('forecastDeadTableWrap');
      const countLabel = document.getElementById('forecastDeadCountLabel');
      if (deadTblWrap) {
        let deadRows = res.deadStock;
        const qDead = (STATE.forecastDeadSearch || '').toLowerCase().trim();
        if (qDead) {

              '<td class="num" style="font-size:.78rem;">' + fmtDateShort(r.lastDate) + '</td>' +
              '<td style="text-align:center;"><span class="badge-tag dead" style="font-weight:700; font-size:.78rem;">' + r.daysInactive + ' ' + t('daysWord') + '</span></td>' +

            btnsHtml += '<span class="chip' + activeClass + '" data-limit="' + n + '" style="cursor:pointer; font-weight:600; padding:3px 10px; font-size:.76rem;">' + n + '</span>';
          });

          if (!isAll && totalDead > deadShown.length) {

          if (moreBtn) moreBtn.addEventListener('click', () => {

  const NAV_ORDER = ['overview', 'trend', 'heatmap', 'products', 'customers', 'salespeople', 'invoices', 'forecast'];

  /* ============================== SHELL ============================== */
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', STATE.theme === 'dark' ? 'dark' : 'light');
    try { localStorage.setItem(LS_THEME_KEY, STATE.theme); } catch (e) { }
  }

  // Deposits are only ever a supplement to sales data (schema.md §6 Q7) — computePeriods() derives
  // every period from rawInvoices alone, so a deposits-only upload leaves STATE.periods empty and
  // this "no data" screen showing, even though STATE.deposits actually has records in memory. Give
  // that specific case its own message rather than the generic "nothing uploaded yet" one.
  function depositsOnlyState() { return STATE.rawInvoices.length === 0 && STATE.deposits.length > 0; }

  function buildEmptyState() {
    const el = document.getElementById('emptyState');
    if (!el) return;
    const depOnly = depositsOnlyState();
    el.innerHTML = '<div class="card" style="text-align:center; padding:60px 24px; max-width:520px; margin:40px auto;">' + icon(depOnly ? 'alert' : 'upload', 34) +
      '<h2 style="margin:16px 0 6px; text-transform:none; letter-spacing:0;">' + t(depOnly ? 'depositOnlyTitle' : 'emptyTitle') + '</h2>' +
      '<p style="color:var(--muted); font-size:.9rem; margin:0 0 20px;">' + t(depOnly ? 'depositOnlyDesc' : 'emptyDesc') + '</p>' +
      '<button class="btn primary" id="emptyUploadBtn">' + icon('upload', 16) + ' ' + t('uploadCsv') + '</button></div>';
    const btn = document.getElementById('emptyUploadBtn');
    if (btn) btn.addEventListener('click', () => document.getElementById('fileInput').click());
  }

  // Shown whenever real data is loaded but no one's signed in yet — per direct instruction, an
  // upload completing always (re-)triggers this, even over an already-signed-in session, so viewing
  // freshly-uploaded data always requires a (re-)login. Labeled throughout as a simulation per
  // AGENTS.md §3 — this is a demo convenience, not access control.
  function buildLoginGateHtml() {
    const el = document.getElementById('loginGate');
    if (!el) return;
    el.innerHTML = '<div class="card login-card">' +
      '<h2 style="margin:0 0 4px; text-transform:none; letter-spacing:0;">' + icon('users', 20) + ' ' + t('loginTitle') + '</h2>' +
      '<p style="color:var(--muted); font-size:.85rem; margin:0 0 20px;">' + t('loginDesc') + '</p>' +
      '<div class="fld"><label for="loginUsername">' + t('loginUsername') + '</label><input type="text" id="loginUsername" autocomplete="username"></div>' +
      '<div class="fld"><label for="loginPassword">' + t('loginPassword') + '</label><input type="password" id="loginPassword" autocomplete="current-password"></div>' +
      '<div class="err" id="loginErr"></div>' +
      '<button class="btn primary" id="loginSubmit" style="width:100%; justify-content:center;">' + t('loginSubmit') + '</button>' +
      '<div class="sim-warning">' + icon('alert', 14) + '<span>' + t('loginSimWarning') + '</span></div>' +
      '<div class="demo-hint">' + esc(t('loginDemoHint')) + '</div>' +
      '</div>';
  }
  function wireLoginGate() {
    const submit = document.getElementById('loginSubmit');
    const userInput = document.getElementById('loginUsername');
    const passInput = document.getElementById('loginPassword');
    const errEl = document.getElementById('loginErr');
    if (!submit || !userInput || !passInput) return;
    function attempt() {
      const user = findUser(userInput.value, passInput.value);
      if (!user) { errEl.textContent = t('loginError'); return; }
      errEl.textContent = '';
      STATE.session = { username: user.username, role: user.role, salespersonCode: user.salespersonCode || null, displayName: user.displayName };
      // The session just changed which invoices/lineItems are visible (a Sales login scopes to one
      // salesperson) — periods and any page-level filter state must be rebuilt against that, not the
      // previous (possibly unscoped, or differently-scoped) view.
      STATE.periods = computePeriods();
      const sp = sortedPeriods();
      if (!isValidCurrentKey(STATE.currentKey, sp)) STATE.currentKey = sp.length > 1 ? 'ALL' : (sp.length === 1 ? sp[0].key : null);
      resetAllFilters(); saveUiState();
      applyRoleVisibility();
      showPage(canAccessPage(STATE.currentPage) ? STATE.currentPage : 'overview');
    }
    submit.addEventListener('click', attempt);
    [userInput, passInput].forEach(inp => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); }));
  }
  function showLoginGate() {
    NAV_ORDER.forEach(id => { const sec = document.getElementById('page-' + id); if (sec) sec.style.display = 'none'; });
    const chip = document.getElementById('filterChipWrap'); if (chip) chip.innerHTML = '';
    const es = document.getElementById('emptyState'); if (es) es.innerHTML = '';
    buildLoginGateHtml();
    wireLoginGate();
    const gate = document.getElementById('loginGate');
    if (gate) gate.style.display = '';
    const uf = document.getElementById('loginUsername');
    if (uf) uf.focus();
  }
  function hideLoginGate() {
    const gate = document.getElementById('loginGate');
    if (gate) { gate.style.display = 'none'; gate.innerHTML = ''; }
  }
  function logout() {
    STATE.session = null;
    renderCurrentPage();
  }
  // Toggles nav links and toolbar buttons that are role-restricted — called after login/logout and
  // after buildApp() (language switch rebuilds the whole chrome). Page-level access is still
  // enforced independently in showPage()/renderCurrentPage(), so a stale URL hash can't bypass this
  // by skipping the nav link.
  function applyRoleVisibility() {
    const perms = currentPerms();
    document.querySelectorAll('#pagenav a').forEach(a => {
      a.style.display = canAccessPage(a.dataset.page) ? '' : 'none';
    });
    const uploadBtn = document.getElementById('uploadBtn');
    if (uploadBtn) uploadBtn.style.display = (STATE.session && !perms.canUpload) ? 'none' : '';
    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) resetBtn.style.display = (STATE.session && !perms.canReset) ? 'none' : '';
    const exportBtn = document.getElementById('exportBtn');
    if (exportBtn) exportBtn.style.display = (STATE.session && !perms.canExport) ? 'none' : '';
    const sessionChip = document.getElementById('sessionChip');
    if (sessionChip) {
      if (STATE.session) {
        const roleKey = STATE.session.role === 'executive' ? 'roleExecutive' : (STATE.session.role === 'management' ? 'roleManagement' : 'roleSales');
        sessionChip.style.display = '';
        sessionChip.innerHTML = '<span style="color:var(--muted); font-size:.78rem;">' + t('loggedInAs') + ' <b style="color:var(--ink);">' + esc(STATE.session.displayName) + '</b> (' + t(roleKey) + ')</span>' +
          '<button class="btn" id="logoutBtn" style="padding:5px 10px; font-size:.76rem;">' + t('logoutBtn') + '</button>';
        const lb = document.getElementById('logoutBtn');
        if (lb) lb.addEventListener('click', logout);
      } else {
        sessionChip.style.display = 'none';
        sessionChip.innerHTML = '';
      }
    }
  }

  function buildApp() {
    const app = document.getElementById('app');

  // The period selector used to live once in the topbar (persisting across every page, regardless
  // of whether that page even used it). Now it's native to each page that actually reads
  // currentPeriod() — same pattern Heatmap's own heatmapMonthSelect already used. Each page's
  // buildShell() renders one of these (via periodSelectRowHtml()/wirePeriodSelect()) into its own
  // markup; renderCurrentPage() below refreshes only the active page's copy via PERIOD_SELECT_ID.
  const PERIOD_SELECT_ID = {
    overview: 'overviewPeriodSelect', trend: 'trendPeriodSelect', products: 'productsPeriodSelect',
    customers: 'customersPeriodSelect', salespeople: 'salespeoplePeriodSelect', invoices: 'invoicesPeriodSelect',
    // Forecast doesn't use the standard combined period selector — it has its own dedicated base-month
    // select (#forecastBaseMonthSelect) that always operates on single actual months, deliberately
    // excluding combined "all years"/year-range scopes (see computeProductDemandForecast's caller).
    // No #forecastPeriodSelect element actually exists; renderPeriodSelect() below no-ops if the id
    // it's given isn't found, so this mapping is harmless — kept only for parity with every other page.
    forecast: 'forecastPeriodSelect',
  };
  // Year-from/year-to selects only appear once loaded data actually spans more than one calendar
  // year (renderPeriodSelect() below toggles #{id}YearWrap's visibility each render) — with a
  // single year loaded this collapses to exactly the old flat month dropdown, unchanged.
  function periodSelectRowHtml(id) {
    return '<div class="month-select-row no-print">' +
      '<div class="year-range" id="' + id + 'YearWrap" style="display:none;">' +
        '<span class="lbl">' + t('yearFilterLabel') + '</span>' +
        '<div class="select-wrap"><select id="' + id + 'YearFrom"></select></div>' +
        '<span class="year-range-to">' + t('yearRangeTo') + '</span>' +
        '<div class="select-wrap"><select id="' + id + 'YearTo"></select></div>' +
      '</div>' +
      '<span class="lbl">' + t('selectMonth') + '</span>' +
      '<div class="select-wrap"><select id="' + id + '"></select></div>' +
      '<button type="button" class="btn" id="' + id + 'CustomToggle" style="font-size:.78rem; padding:6px 10px;">' + icon('calendar', 13) + ' ' + t('customRangeBtn') + '</button>' +
      '<div class="custom-range-wrap" id="' + id + 'CustomWrap" style="display:none;">' +
        '<input type="date" id="' + id + 'CustomFrom">' +
        '<span class="to-lbl">' + t('yearRangeTo') + '</span>' +
        '<input type="date" id="' + id + 'CustomTo">' +
        '<button type="button" class="btn primary" id="' + id + 'CustomApply" style="font-size:.78rem; padding:6px 10px;">' + t('customRangeApply') + '</button>' +
        '<button type="button" class="btn" id="' + id + 'CustomCancel" style="font-size:.78rem; padding:6px 10px;">' + t('customRangeClear') + '</button>' +
      '</div>' +
    '</div>';
  }
  function wirePeriodSelect(id) {
    const sel = document.getElementById(id);
    if (sel) sel.addEventListener('change', (e) => {
      STATE.currentKey = e.target.value;
      resetAllFilters(); saveUiState();
      renderCurrentPage();
    });
    const yf = document.getElementById(id + 'YearFrom'), yt = document.getElementById(id + 'YearTo');
    if (yf && yt) {
      function onYearRangeChange(e) {
        // Keep from <= to by snapping whichever side wasn't just touched — e.g. dragging "from"
        // past the current "to" pulls "to" along with it, rather than allowing an inverted range.
        let from = yf.value, to = yt.value;
        if (from > to) { if (e.target === yf) to = from; else from = to; yf.value = from; yt.value = to; }
        // BUG FIX (2026-09-24): this is now the ONLY place STATE.yearRangeFrom/To are ever written —
        // the year-range selects are the user's own explicit choice, remembered independently of
        // whatever specific month they browse to afterward (see renderPeriodSelect()'s comment).
        STATE.yearRangeFrom = from; STATE.yearRangeTo = to;
        STATE.currentKey = combinedScopeKey(from, to);
        resetAllFilters(); saveUiState();
        renderCurrentPage();
      }
      yf.addEventListener('change', onYearRangeChange);
      yt.addEventListener('change', onYearRangeChange);
    }

    // Custom day-range picker (feature request: "select from which date to which date, like 27 Jan
    // to 22 Feb") — a toggle button reveals two native date inputs + Apply/Cancel, independent of the
    // month/year controls above. Building a 'DR:from:to' scope key (see getPeriod()) rather than
    // trying to force an arbitrary range into the month/year dropdowns, which can't express a range
    // that doesn't land on a month or year boundary.
    const toggleBtn = document.getElementById(id + 'CustomToggle');
    const wrap = document.getElementById(id + 'CustomWrap');
    const fromInput = document.getElementById(id + 'CustomFrom');
    const toInput = document.getElementById(id + 'CustomTo');
    const applyBtn = document.getElementById(id + 'CustomApply');
    const cancelBtn = document.getElementById(id + 'CustomCancel');
    if (!toggleBtn || !wrap || !fromInput || !toInput || !applyBtn || !cancelBtn) return;
    toggleBtn.addEventListener('click', () => {
      wrap.style.display = wrap.style.display === 'none' ? 'flex' : 'none';
    });
    function applyCustomRange() {
      const from = fromInput.value, to = toInput.value;
      if (!from || !to || from > to) { toast(t('customRangeInvalid')); return; }
      STATE.currentKey = 'DR:' + from + ':' + to;
      resetAllFilters(); saveUiState();
      renderCurrentPage();
    }
    applyBtn.addEventListener('click', applyCustomRange);
    // BUG FIX (2026-09-24): there was no way to back out of the custom-range picker — no Cancel/
    // Reset control existed at all (the string was defined in I18N but never wired to a button).
    // Clears whatever's typed into the two date fields and closes the panel; if a custom range is
    // actually applied right now, also reverts the active scope back to the normal default (the
    // combined view if multiple months are loaded, otherwise the one loaded month) rather than
    // leaving the dashboard stuck showing a range with no obvious way back.
    cancelBtn.addEventListener('click', () => {
      fromInput.value = ''; toInput.value = '';
      wrap.style.display = 'none';
      if (STATE.currentKey && STATE.currentKey.indexOf('DR:') === 0) {
        const sp2 = sortedPeriods();
        STATE.currentKey = sp2.length > 1 ? 'ALL' : (sp2.length === 1 ? sp2[0].key : null);
        resetAllFilters(); saveUiState();
        renderCurrentPage();
      }
    });
    // Enter in either date field applies too, matching the Apply button rather than requiring a
    // click after already picking both dates.
    [fromInput, toInput].forEach(inp => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCustomRange(); }));
  }
  function renderPeriodSelect(id) {
    const sel = document.getElementById(id);
    if (!sel) return;
    const sp = sortedPeriods();
    const years = allYears();
    const yearWrap = document.getElementById(id + 'YearWrap');
    const yf = document.getElementById(id + 'YearFrom'), yt = document.getElementById(id + 'YearTo');

    // BUG FIX (2026-09-24): the year-range selects used to re-derive their displayed from/to from
    // STATE.currentKey on every render — so picking any single specific month (a plain 'YYYY-MM' key)
    // collapsed both selects to that one month's year alone (e.g. "2026 to 2026" instead of the real
    // "2025 to 2026" loaded range), and picking a month from within an already-narrowed year window
    // silently threw that narrowing away on the very next render. The selects are now backed by their
    // own independent state (STATE.yearRangeFrom/To, written only by onYearRangeChange above) —
    // defaulting to the full oldest-to-newest loaded range the first time (or after a fresh
    // upload/reset makes the old stored years invalid), and otherwise left exactly as the user set
    // them regardless of which month/scope is currently being viewed.
    if (!years.includes(STATE.yearRangeFrom) || !years.includes(STATE.yearRangeTo)) {
      STATE.yearRangeFrom = years[0]; STATE.yearRangeTo = years[years.length - 1];
    }
    const from = STATE.yearRangeFrom, to = STATE.yearRangeTo;
    const key = STATE.currentKey || '';

    if (years.length > 1) {
      if (yearWrap) yearWrap.style.display = 'flex';
      if (yf) yf.innerHTML = years.map(y => '<option value="' + y + '"' + (y === from ? ' selected' : '') + '>' + y + '</option>').join('');
      if (yt) yt.innerHTML = years.map(y => '<option value="' + y + '"' + (y === to ? ' selected' : '') + '>' + y + '</option>').join('');
    } else if (yearWrap) {
      yearWrap.style.display = 'none';
    }

    // Month list scoped to the active year range (all loaded months when there's only one year
    // total, same as before this feature existed).
    const spInRange = (years.length > 1 ? sp.filter(p => p.key.slice(0, 4) >= from && p.key.slice(0, 4) <= to) : sp).slice().reverse();
    const allKey = years.length > 1 ? combinedScopeKey(from, to) : 'ALL';
    const isCustomRange = key.indexOf('DR:') === 0;
    let optionsHtml = '';
    if (spInRange.length > 1) optionsHtml += '<option value="' + allKey + '"' + (!isCustomRange && STATE.currentKey === allKey ? ' selected' : '') + '>' + t('allQ3') + '</option>';
    // A DR: scope has no natural slot in a month/year dropdown (it may not align with any month or
    // year boundary at all) — inject a synthetic option showing it so the <select> reflects reality
    // instead of silently falling back to whatever its first option happens to be.
    if (isCustomRange) optionsHtml += '<option value="' + esc(key) + '" selected>' + esc(periodLabel(getPeriod(key))) + '</option>';
    optionsHtml += spInRange.map(p => '<option value="' + p.key + '"' + (!isCustomRange && p.key === STATE.currentKey ? ' selected' : '') + '>' + esc(periodLabel(p)) + '</option>').join('');
    sel.innerHTML = optionsHtml;

    // Custom-range inputs: bounded to the overall loaded data range, and pre-filled from the active
    // DR: scope (if any) so reopening the picker shows what's actually applied rather than blank.
    const fromInput = document.getElementById(id + 'CustomFrom');
    const toInput = document.getElementById(id + 'CustomTo');
    const toggleBtn = document.getElementById(id + 'CustomToggle');
    const customWrap = document.getElementById(id + 'CustomWrap');
    if (fromInput && toInput && sp.length) {
      const overallMin = sp[0].dateFrom, overallMax = sp[sp.length - 1].dateTo;
      fromInput.min = overallMin; fromInput.max = overallMax;
      toInput.min = overallMin; toInput.max = overallMax;
      if (isCustomRange) {
        const parts = key.slice(3).split(':');
        fromInput.value = parts[0]; toInput.value = parts[1];
        if (toggleBtn) toggleBtn.classList.add('active');
        if (customWrap) customWrap.style.display = 'flex';
      } else if (toggleBtn) {
        toggleBtn.classList.remove('active');
      }
    }
  }

  function renderQualityChip(period) {
    const el = document.getElementById('qualityChip');
    if (!el || !period) return;
    el.innerHTML = period.isAggregated
      ? '<span class="dot good"></span> ' + t('q3Combined') + ' (' + period.invoices.length + ' ' + t('invoices') + ')'
      : '<span class="dot good"></span> ' + period.invoices.length + ' ' + t('invoicesLoaded');
  }

  /* ============================== ROUTER ============================== */
  function showPage(id) {
    if (!PAGES[id]) id = 'overview';
    // A stale/typed-in hash pointing at a page this role can't see (e.g. #forecast for a Sales
    // session) falls back to Overview rather than rendering it — the nav link is already hidden by
    // applyRoleVisibility(), this is the same rule enforced against a direct hash, not just the link.
    if (STATE.session && !canAccessPage(id)) id = 'overview';
    // The salesperson filter is native to whichever page it's set on (Products/Invoices only) —
    // navigating to a different page clears it rather than carrying it along silently. The
    // category filter is deliberately NOT touched here: clicking a category card is itself a
    // same-session navigation to Products that's supposed to carry the filter with it.
    if (id !== STATE.currentPage) {
      STATE.filters.salesperson = null;
      saveUiState();
    }
    STATE.currentPage = id;
    NAV_ORDER.forEach(pid => {
      const sec = document.getElementById('page-' + pid);
      if (sec) sec.style.display = (pid === id) ? '' : 'none';
    });
    document.querySelectorAll('#pagenav a').forEach(a => a.classList.toggle('active', a.dataset.page === id));
    document.title = t(PAGES[id].navKey) + ' — ' + t('dashboardTitle');
    window.scrollTo(0, 0);
    renderCurrentPage();
  }

  function renderCurrentPage() {
    const period = currentPeriod();
    if (!period) { hideLoginGate(); renderFilterChip(); renderQualityChip(null); buildEmptyState(); document.body.classList.add('no-data'); return; }
    document.body.classList.remove('no-data');
    // Real data exists, but no one's signed in — show the login gate instead of any page content.
    // Checked after the "no data at all" case above (nothing to gate yet) and before anything else
    // renders, so a stale page body can't flash before the gate takes over.
    if (!STATE.session) {
      NAV_ORDER.forEach(pid => { const sec = document.getElementById('page-' + pid); if (sec) sec.style.display = 'none'; });
      showLoginGate();
      return;
    }
    hideLoginGate();
    renderFilterChip();
    renderQualityChip(period);
    const selId = PERIOD_SELECT_ID[STATE.currentPage];
    if (selId) renderPeriodSelect(selId);
    PAGES[STATE.currentPage].render(period);
  }

  /* ============================== EVENTS ============================== */
  let scrollListenerInstalled = false;
  function wireScrollTop() {
    const btn = document.getElementById('scrollTopBtn');
    if (!btn) return;
    if (!scrollListenerInstalled) {
      window.addEventListener('scroll', () => {
        const el = document.getElementById('scrollTopBtn');
        if (el) el.classList.toggle('show', window.scrollY > 400);
      }, { passive: true });
      scrollListenerInstalled = true;
    }
    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  function setUploadBusy(busy, label) {
    ['uploadBtn', 'emptyUploadBtn'].forEach(id => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.disabled = busy;
      if (busy) {
        if (!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spin">' + icon('history', 16) + '</span> ' + (label || t('working'));
      } else if (btn.dataset.origHtml) {
        btn.innerHTML = btn.dataset.origHtml;
      }
    });
  }

  // Decodes one uploaded file, sniffs which of the three report types it is by its content (not
  // filename — architecture.md §4.2 step 3), and returns tagged records ready to upsert. The three
  // real exports are Windows-874 (Thai ANSI) encoded, not UTF-8 — File#text()/readAsText() both
  // assume UTF-8 and silently mangle every Thai string while leaving ASCII dates/numbers intact,
  // which is exactly why this bug is easy to miss (schema.md's 2026-09-16 note).
  // Verified against the real files (2026-09-18): the cash-sales export always zero-pads
  // salesperson codes ("03","04","06","08"), but credit-sales has a handful of invoices using the
  // un-padded form ("3","4","8") for the same people — splits one salesperson into two rows in
  // every ranking/filter unless normalized. Applied here at ingestion, not inside the parser
  // functions themselves, so parser.js's saved logic stays untouched.
  function normalizeSalespersonCode(code) {
    const s = (code || '').trim();
    return /^\d+$/.test(s) ? s.padStart(2, '0') : s;
  }

  // Credit-sales customer identity fix (schema.md §6 Q6, resolved 2026-09-23): ขายเงินเชื่อ.csv's
  // column layout drops รหัสลูกค้า (Customer ID) entirely — parseCreditSalesReport always leaves
  // customerCode as '' — so every credit invoice used to bucket under its own name-only key,
  // silently splitting any customer who buys on both cash and credit into two separate "customer"
  // entities everywhere customerCode is used (topCustomers(), the Customers-page drill-down, the
  // Salespeople-drill-down's per-customer table). Verified against the real 2025-12–2026-08 dataset
  // (dashboard_reconciliation_specification.md's customer-reconciliation section, cross-checked
  // directly against both CSVs — its revenue-reconciliation section was NOT adopted, see
  // docs/changelog.md): of 29 distinct credit-sales customer names, 15 match an existing cash-sales
  // customer name exactly, 2 more are confirmed spelling/suffix variants of one (table below), and
  // the remaining 12 are genuinely new entities with no cash-sales history at all.
  // Keys are \u-escaped (not typed as literal Thai text) because the real credit-sales export uses
  // U+00A0 (non-breaking space) between name segments where a plain space looks identical on screen
  // — the same NBSP gotcha schema.md already documents for header labels (Session 3) — so a
  // hand-typed literal key silently fails to match. Extracted directly from the real parsed data,
  // not retyped from the spec doc, to guarantee an exact match.
  const CREDIT_CUSTOMER_NAME_OVERRIDES = {
    'เดอะแกรนด์ไลฟ์ พร็อพเพอร์ตี้ จำกัด': 'ด-057', // เดอะแกรนด์ไลฟ์ พร็อพเพอร์ตี้ จำกัด
    'พงษ์เพ็ชรเมทัลชีท 4 สาขาทรัพย์ไพรวัล0': 'พ-073', // พงษ์เพ็ชรเมทัลชีท 4 สาขาทรัพย์ไพรวัล0
  };

  // Runs after every upsertInvoices() so it always sees the full accumulated cash-sales customer
  // list, regardless of which order cash/credit files were uploaded in. Idempotent — re-running
  // against an unchanged STATE.rawInvoices reassigns the same codes every time.
  function resolveCreditCustomerCodes() {
    const nameToCode = {};
    STATE.rawInvoices.forEach(inv => {
      if (inv.paymentType !== 'credit' && inv.customerName && inv.customerCode) {
        nameToCode[inv.customerName.trim()] = inv.customerCode;
      }
    });
    const syntheticByName = {};
    let syntheticSeq = 1;
    STATE.rawInvoices.forEach(inv => {
      if (inv.paymentType !== 'credit') return;
      const name = (inv.customerName || '').trim();
      if (nameToCode[name]) { inv.customerCode = nameToCode[name]; return; }
      if (CREDIT_CUSTOMER_NAME_OVERRIDES[name]) { inv.customerCode = CREDIT_CUSTOMER_NAME_OVERRIDES[name]; return; }
      if (!syntheticByName[name]) syntheticByName[name] = 'CR-CORP-' + String(syntheticSeq++).padStart(3, '0');
      inv.customerCode = syntheticByName[name];
    });
  }

  async function readAndClassifyFile(file) {
    const buf = await file.arrayBuffer();
    // This dashboard's own export (exportDashboardCsv) is written as UTF-8, unlike the Express
    // reports (Windows-874) — decoding it as Windows-874 would corrupt every Thai name/description
    // in it. The export's header row is pure ASCII, so it decodes identically either way, meaning
    // it's safe to sniff on a UTF-8 decode first and only fall back to Windows-874 if that's not
    // what this file is.
    const utf8Text = new TextDecoder('utf-8').decode(buf);
    if (sniffReportType(utf8Text) === 'dashboard_export') {
      const r = parseDashboardExport(utf8Text);
      r.invoices.forEach(inv => { inv.sourceFile = file.name; inv.salesperson = normalizeSalespersonCode(inv.salesperson); });
      return { type: 'dashboard_export', invoices: r.invoices, lineItems: r.lineItems, deposits: [], warnings: r.warnings, fileName: file.name };
    }
    const text = new TextDecoder('windows-874').decode(buf);
    const reportType = sniffReportType(text);
    if (reportType === 'cash') {
      const r = parseCashSalesReport(text);
      r.invoices.forEach(inv => { inv.paymentType = 'cash'; inv.sourceFile = file.name; inv.salesperson = normalizeSalespersonCode(inv.salesperson); });
      return { type: 'cash', invoices: r.invoices, lineItems: r.lineItems, deposits: [], warnings: r.warnings, fileName: file.name };
    }
    if (reportType === 'credit') {
      const r = parseCreditSalesReport(text);
      r.invoices.forEach(inv => { inv.paymentType = 'credit'; inv.sourceFile = file.name; inv.salesperson = normalizeSalespersonCode(inv.salesperson); });
      return { type: 'credit', invoices: r.invoices, lineItems: r.lineItems, deposits: [], warnings: r.warnings, fileName: file.name };
    }
    if (reportType === 'deposits') {
      const r = parseDepositsReport(text);
      r.deposits.forEach(d => { d.sourceFile = file.name; d.salesperson = normalizeSalespersonCode(d.salesperson); });
      return { type: 'deposits', invoices: [], lineItems: [], deposits: r.deposits, warnings: r.warnings, fileName: file.name };
    }
    return { type: null, invoices: [], lineItems: [], deposits: [], warnings: [], fileName: file.name };
  }

  // Processes one or more files from a single upload action together — any combination of cash
  // sales / credit sales / deposits (architecture.md §4.2 step 1). Cash+credit invoices merge into
  // one deduplicated set; deposits merge into their own. A file that doesn't match any known report
  // is skipped (reported, not silently dropped) rather than failing the whole batch.
  async function handleUpload(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    // Defense in depth, same rule as the reset handler above — uploadBtn is already hidden for an
    // authenticated role that can't upload, but not for "no session yet" (the very first upload, per
    // the whole point of this flow, happens before anyone's logged in).
    if (STATE.session && !currentPerms().canUpload) { e.target.value = ''; return; }
    setUploadBusy(true, t('reading') + '…');
    toast(t('reading') + ' ' + files.length + ' ' + (files.length === 1 ? t('fileWord') : t('filesWord')) + '…');

    const newInvoices = [], newLineItems = [], newDeposits = [];
    const counts = { cash: 0, credit: 0, deposits: 0 };
    const unrecognized = [];
    let warningTotal = 0;

    for (const file of files) {
      await new Promise(r => setTimeout(r, 15));
      let result;
      try { result = await readAndClassifyFile(file); }
      catch (err) { unrecognized.push(file.name); continue; }
      if (!result.type) { unrecognized.push(file.name); continue; }
      newInvoices.push(...result.invoices);
      newLineItems.push(...result.lineItems);
      newDeposits.push(...result.deposits);
      warningTotal += result.warnings.length;
      // Bucket by each invoice's own paymentType rather than the file's type — a re-imported
      // dashboard export can contain a mix of cash and credit invoices in one file.
      result.invoices.forEach(inv => { if (inv.paymentType === 'credit') counts.credit++; else counts.cash++; });
      counts.deposits += result.deposits.length;
    }

    if (!newInvoices.length && !newDeposits.length) {
      toast(unrecognized.length ? t('unsupportedReport') : t('noRecognizableRecords'));
      setUploadBusy(false); e.target.value = ''; return;
    }

    setUploadBusy(true, t('processing'));
    await new Promise(r => setTimeout(r, 15));

    upsertInvoices(newInvoices, newLineItems);
    upsertDeposits(newDeposits);
    resolveCreditCustomerCodes();
    buildSalesUsers();
    // Per direct instruction: an upload finishing always (re-)triggers the login gate, even over an
    // already-signed-in session — viewing the freshly-uploaded data always requires signing in again.
    STATE.session = null;
    STATE.periods = computePeriods();

    const sp = sortedPeriods();
    STATE.currentKey = sp.length > 1 ? 'ALL' : (sp.length === 1 ? sp[0].key : null);
    resetAllFilters();
    saveUiState();
    applyRoleVisibility();
    document.body.classList.remove('no-data');
    renderCurrentPage();
    setUploadBusy(false);

    const parts = [];
    if (counts.cash) parts.push(fmtNum(counts.cash) + ' ' + t('typeCash'));
    if (counts.credit) parts.push(fmtNum(counts.credit) + ' ' + t('typeCredit'));
    if (counts.deposits) parts.push(fmtNum(counts.deposits) + ' ' + t('typeDeposit'));
    let msg = t('dataUpdated') + ' ' + parts.join(', ');
    if (unrecognized.length) msg += ' — ' + t('skippedFiles') + ': ' + unrecognized.join(', ');
    if (warningTotal) msg += ' (' + warningTotal + ' ' + t('warningsWord') + ')';
    // Deposits are only ever a supplement to sales data (see depositsOnlyState()) — this upload
    // brought in deposits but there's still no invoice in STATE at all, so nothing will actually
    // render. A longer-lived, explicit warning here, since the normal toast above would otherwise
    // read as a plain success message while the dashboard silently shows its empty state.
    if (depositsOnlyState()) toast(fmtNum(counts.deposits) + ' ' + t('depositOnlyToast'), 7000);
    else toast(msg);
    e.target.value = '';
  }

  // Exports both invoices AND their line items in one CSV (RecordType column distinguishes the
  // two), so re-uploading this exact file through the same Upload CSV button restores everything
  // — not just invoice totals with every product/category/thickness/color detail silently dropped,
  // which is what the previous invoice-only export would have done on round-trip. See
  // sniffReportType/parseDashboardExport for the read side.
  function csvRow(vals) {
    return vals.map(v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',');
  }
  // The "Report" button prints (and, via the browser's own print dialog, can be saved as a PDF —
  // no client-side PDF library needed, keeping this a self-contained single-file app) a fixed
  // Overview + Sales Trend report, regardless of which page you're actually viewing. Both pages'
  // DOM already exists (buildShell() ran for every page up front), but only the *active* page gets
  // its data refreshed on every render — so both are explicitly re-rendered here first, then shown
  // (and everything else hidden) for just the duration of the print, then restored via 'afterprint'.
  function printReport() {
    const period = currentPeriod();
    if (period) {
      PAGES.overview.render(period);
      PAGES.trend.render(period);
    }
    const prevPage = STATE.currentPage;
    NAV_ORDER.forEach(id => {
      const sec = document.getElementById('page-' + id);
      if (sec) sec.style.display = (id === 'overview' || id === 'trend') ? '' : 'none';
    });
    function restore() {
      NAV_ORDER.forEach(id => {
        const sec = document.getElementById('page-' + id);
        if (sec) sec.style.display = (id === prevPage) ? '' : 'none';
      });
      window.removeEventListener('afterprint', restore);
    }
    window.addEventListener('afterprint', restore);
    window.print();
  }

  async function exportCsv() {
    const period = currentPeriod();
    if (!period) return;
    const filtered = applyFilter(period.invoices, period.lineItems);
    const lineByInvoice = {};
    filtered.lineItems.forEach(li => { (lineByInvoice[li.invoiceNo] = lineByInvoice[li.invoiceNo] || []).push(li); });

    const rows = [DASHBOARD_EXPORT_HEADER];
    filtered.invoices.forEach(i => {
      rows.push(csvRow(['INVOICE', i.invoiceNo, i.date, i.paymentType || '', i.customerCode, i.customerName, i.salesperson, i.productValue, i.total, i.cashReceived, i.checkReceived, i.withholdingTax, i.depositApplied, '', '', '', '', '', '', '']));
      (lineByInvoice[i.invoiceNo] || []).forEach(li => {
        // BUG FIX (external audit #3, 2026-09-23): this used to write '' into the Date column for
        // every LINEITEM row, so re-uploading this dashboard's own export silently lost every line
        // item's date — dailySeriesForRange()'s map[li.date] lookup always missed (Trend/Heatmap
        // flatlined to ฿0) and dowSeries()'s new Date(undefined+'T00:00:00').getDay() produced NaN
        // (day-of-week chart silently dropped that revenue). li.date should already equal i.date
        // (RawLineItem always carries a copy of its parent invoice's date) — falling back to i.date
        // directly in case it's ever missing costs nothing and guarantees a valid date either way.
        rows.push(csvRow(['LINEITEM', i.invoiceNo, li.date || i.date, '', '', '', '', '', '', '', '', '', '', li.skuCode || '', li.category || '', li.description || '', li.qty == null ? '' : li.qty, li.unit || '', li.unitPrice == null ? '' : li.unitPrice, li.amount]));
      });
    });
    const csv = rows.join('\r\n');
    // period.key can now be 'Y:2026' or 'YR:2025:2026' (year/year-range scopes) — ':' isn't valid
    // in a Windows filename, so sanitize before using it in the download name.
    const filename = 'dashboard-export-' + period.key.replace(/:/g, '-') + '.csv';
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.setAttribute('download', filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function wireChromeEvents() {
    // Per-page period selects (overview/trend/products/customers/salespeople/invoices) are wired
    // individually inside each page's own buildShell() via wirePeriodSelect(), not here.
    const navToggle = document.getElementById('navToggle');
    const pagenav = document.getElementById('pagenav');
    if (navToggle && pagenav) navToggle.addEventListener('click', () => pagenav.classList.toggle('open'));
    document.getElementById('pagenav').addEventListener('click', (e) => {
      const a = e.target.closest('a'); if (!a) return;
      pagenav.classList.remove('open'); // close mobile dropdown after choosing a page
    });

    document.getElementById('printBtn').addEventListener('click', printReport);
    document.getElementById('exportBtn').addEventListener('click', exportCsv);
    document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    // emptyUploadBtn's own click listener is (re)attached inside buildEmptyState() itself, since
    // that function's innerHTML rewrite runs on its own (not just via buildApp()) whenever the
    // deposits-only warning needs to refresh, which would otherwise orphan a listener attached here.
    document.getElementById('fileInput').addEventListener('change', handleUpload);

    document.getElementById('resetBtn').addEventListener('click', () => {
      // Defense in depth — the button itself is already hidden for a role without canReset
      // (applyRoleVisibility()), but a hidden element can still be clicked via devtools/scripting,
      // so the actual handler checks the permission too rather than relying on visibility alone.
      // No session at all (e.g. before the very first login) is NOT restricted — only an
      // authenticated role that disallows it is, same rule applyRoleVisibility() itself uses.
      if (STATE.session && !currentPerms().canReset) return;
      if (confirm(t('confirmReset'))) {
        [LS_INV_KEY, LS_LI_KEY, LS_DEP_KEY, LS_UI_KEY].forEach(k => localStorage.removeItem(k));
        STATE.rawInvoices = []; STATE.rawLineItems = []; STATE.deposits = [];
        STATE.periods = [];
        STATE.currentKey = null;
        STATE.session = null;
        STATE_salesUsers = [];
        resetAllFilters();
        applyRoleVisibility();
        buildEmptyState();
        document.body.classList.add('no-data');
        renderFilterChip();
        toast(t('dataReset'));
      }
    });

    document.getElementById('themeToggle').addEventListener('click', (e) => {
      const btn = e.target.closest('button'); if (!btn) return;
      STATE.theme = btn.dataset.theme;
      applyTheme();
      document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.theme === STATE.theme));
    });

    document.getElementById('langToggle').addEventListener('click', (e) => {
      const btn = e.target.closest('button'); if (!btn) return;
      STATE.lang = btn.dataset.lang;
      try { localStorage.setItem(LS_LANG_KEY, STATE.lang); } catch (ex) { }
      const stayOnPage = STATE.currentPage;
      buildApp();
      wireChromeEvents();
      showPage(stayOnPage);
      toast(STATE.lang === 'th' ? 'เปลี่ยนเป็นภาษาไทยแล้ว' : 'Switched to English');
    });

    wireScrollTop();
  }

  window.addEventListener('hashchange', () => { showPage(location.hash.slice(1) || 'overview'); });

  /* ============================== INIT ============================== */
  function init() {
    // Without this, a hard refresh can restore the browser's remembered scroll position before
    // our own scrollTo(0,0) below runs, so a page you'd scrolled down on reopens already scrolled
    // down. Forcing 'manual' makes every load/refresh start at the top, same as a page switch.
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
    try {
      const savedTheme = localStorage.getItem(LS_THEME_KEY);
      if (savedTheme && ['light', 'dark'].includes(savedTheme)) STATE.theme = savedTheme;
      const savedLang = localStorage.getItem(LS_LANG_KEY);
      if (savedLang && ['en', 'th'].includes(savedLang)) STATE.lang = savedLang;
    } catch (e) { }
    applyTheme();

    initRawData();

    loadUiState();
    loadTargets();

    const sp = sortedPeriods();
    if (!isValidCurrentKey(STATE.currentKey, sp)) {
      STATE.currentKey = sp.length > 1 ? 'ALL' : (sp.length === 1 ? sp[0].key : null);
    }

    buildApp();
    wireChromeEvents();

    const initialPage = location.hash && PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
    showPage(initialPage);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
