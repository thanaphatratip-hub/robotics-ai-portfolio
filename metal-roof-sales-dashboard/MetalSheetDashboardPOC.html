<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Steel Roofing Sales Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-css">
:root{
  --page-bg:#eef1f4; --surface:#fcfcfb; --surface-2:#e6eaee; --topnav-bg:#161d24; --topnav-ink:#dfe4e8; --topnav-muted:#8b96a1;
  --ink:#0b0d10; --ink-2:#4b525a; --muted:#767c84; --grid:#dee2e6; --baseline:#b9c0c7; --border:rgba(11,13,16,0.10);
  /* Brand palette (2026-09-24, PU MetalSheet logo confirmed): accent = the logo's orange-red roof
     spire, cat-1 = its blue gable wall, cat-2 = its small amber peak accent, cat-3 = its green roof
     plane — sampled from the real logo image (a clean PNG the user supplied, superseding the earlier
     photo-of-a-projector guess this comment used to describe), tuned for on-screen contrast rather
     than a literal 1:1 swatch pull. Kept distinct in hue from each other on purpose (accent leans
     red, cat-2 leans yellow/tan) even though both trace back to warm tones in the same logo. */
  --accent:#c25230; --accent-ink:#ffffff;
  --good:#0ca30c; --warn:#a8720b; --serious:#b8481f; --critical:#d03b3b;
  --cat-1:#4e7bc7; --cat-2:#e3a25c; --cat-3:#86bd52; --cat-4:#c98500; --cat-5:#c85e83; --cat-6:#3a8f3a; --cat-other:#9aa2ab;
  --seq-100:#dbe4f7; --seq-200:#b9c9ee; --seq-300:#93ade3; --seq-400:#6d90d6; --seq-500:#4f74bf; --seq-600:#3c5a99; --seq-700:#293f70;
  /* Donut/pie categorical slots — a separate, dedicated set from --cat-* above (which fails
     colorblind-safety validation: worst adjacent pair ΔE 2.6 CVD / 12.0 normal-vision, both below
     the 8/15 targets — not touched here since it's used throughout the rest of the app and fixing
     it is a larger, separate change). These 5 + --cat-other pass the adjacent-pairs check in both
     light and dark (validated via dataviz skill's validate_palette.js) for the fixed rank-based
     slot order renderPieChart() actually assigns (1st place always gets --pie-1, etc.).  */
  --pie-1:#2a78d6; --pie-2:#eb6834; --pie-3:#1baf7a; --pie-4:#eda100; --pie-5:#e87ba4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#0b0e11; --surface:#1a1a19; --surface-2:#20262c; --topnav-bg:#101418; --topnav-ink:#e7ebee; --topnav-muted:#7d8994;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8b8f93; --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --accent:#e8916a; --accent-ink:#161a1a;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#e66767;
    --cat-1:#7fa3e6; --cat-2:#eeb876; --cat-3:#aedd82; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#4aa64a; --cat-other:#5a6168;
    --pie-1:#3987e5; --pie-2:#d95926; --pie-3:#199e70; --pie-4:#c98500; --pie-5:#d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --page-bg:#0b0e11; --surface:#1a1a19; --surface-2:#20262c; --topnav-bg:#101418; --topnav-ink:#e7ebee; --topnav-muted:#7d8994;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8b8f93; --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --accent:#e8916a; --accent-ink:#161a1a;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#e66767;
    --cat-1:#7fa3e6; --cat-2:#eeb876; --cat-3:#aedd82; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#4aa64a; --cat-other:#5a6168;
    --pie-1:#3987e5; --pie-2:#d95926; --pie-3:#199e70; --pie-4:#c98500; --pie-5:#d55181;
    color-scheme: dark;
}
.toggle-group{display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; font-size:.78rem; font-weight:500;}
.toggle-group button{padding:6px 12px; border:none; background:var(--surface-2); color:var(--ink); cursor:pointer; transition:background .12s, color .12s;}
.toggle-group button:not(:last-child){border-right:1px solid var(--border);}
.toggle-group button.active{background:var(--accent); color:var(--accent-ink);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--page-bg); color:var(--ink);
  font-family:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.tabular{font-variant-numeric:tabular-nums;}
h1,h2,h3,.disp{font-family:'Oswald','Arial Narrow',sans-serif; text-wrap:balance;}
::selection{background:var(--accent); color:var(--accent-ink);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}

/* ---------- top nav (replaces ver1's sidebar) ---------- */
#topnav{position:sticky; top:0; z-index:20; background:var(--topnav-bg); color:var(--topnav-ink); border-bottom:1px solid var(--border);}
#topnav-inner{display:flex; align-items:center; gap:18px; padding:12px 24px;}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--topnav-ink); flex:0 0 auto; cursor:pointer;}
.brand .name{display:block; font-family:'Oswald',sans-serif; font-weight:600; font-size:1.0rem; letter-spacing:.01em; line-height:1.15;}
.brand .sub{display:block; font-size:.66rem; color:var(--topnav-muted); letter-spacing:.05em; text-transform:uppercase;}
.nav-toggle{display:none; background:none; border:none; color:var(--topnav-ink); padding:6px; border-radius:6px;}
.nav-toggle:hover{background:rgba(255,255,255,0.08);}
nav#pagenav{display:flex; align-items:center; gap:2px; flex:1; flex-wrap:wrap;}
nav#pagenav a{
  display:flex; align-items:center; justify-content:center; gap:7px; width:150px; padding:8px 8px; border-radius:7px; text-decoration:none;
  color:var(--topnav-muted); font-size:.83rem; font-weight:500; border-bottom:2px solid transparent;
  transition:background .12s, color .12s; white-space:nowrap; overflow:hidden;
}
/* fixed width above keeps every nav button the same box size regardless of label length — EN and
   TH labels differ a lot in character count, and this stops the whole bar reflowing on a language
   toggle. The span itself still gets its own overflow/ellipsis as a safety net (min-width:0 is
   needed for a flex child to actually shrink and ellipsize instead of just overflowing). */
nav#pagenav a svg{flex:0 0 auto;}
nav#pagenav a span{overflow:hidden; text-overflow:ellipsis; min-width:0;}
nav#pagenav a:hover{background:rgba(255,255,255,0.06); color:var(--topnav-ink);}
nav#pagenav a.active{background:rgba(255,255,255,0.08); color:#fff; border-bottom-color:var(--accent);}
#toolbar-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 24px; border-top:1px solid rgba(255,255,255,0.06); background:rgba(0,0,0,0.12);}
.quality-chip{font-size:.72rem; color:var(--topnav-muted); display:flex; align-items:center; gap:6px; padding:0 2px; margin-right:auto;}
.dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
.dot.good{background:var(--good);} .dot.warn{background:var(--warn);}

/* ---------- main / content ---------- */
main#content{padding:26px 28px 90px; max-width:1280px; width:100%; margin:0 auto;}
section.panel{margin-bottom:8px;}
.panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
.panel-head h2{margin:0; font-size:1.05rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:8px;}
.panel-head .hint{font-size:.8rem; color:var(--muted); font-family:'IBM Plex Sans Thai',sans-serif;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px;}
.grid{display:grid; gap:14px;}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));}
.grid.two{grid-template-columns:1.5fr 1fr;}
.grid.split{grid-template-columns:1fr 1fr;}
@media(max-width:900px){.grid.two,.grid.split{grid-template-columns:1fr;}}

.kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:6px; position:relative; overflow:hidden;}
.kpi .lbl{font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600;}
.kpi .val{font-family:'Oswald',sans-serif; font-size:1.72rem; font-weight:600; line-height:1.1;}
.kpi .sub{font-size:.76rem; color:var(--muted);}
.kpi .delta{font-size:.76rem; font-weight:600;}
.kpi .delta.up{color:var(--good);} .kpi .delta.down{color:var(--critical);}
.kpi .spark{position:absolute; right:0; bottom:0; opacity:.9;}

.callout{display:flex; gap:12px; align-items:flex-start; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
.callout svg{flex:0 0 auto; margin-top:2px;}
.callout .t{font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.callout .d{font-size:.86rem; margin-top:2px;}

.toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-size:.78rem; font-weight:500; cursor:pointer;}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.chip.filter{background:color-mix(in srgb, var(--accent) 16%, var(--surface)); border-color:var(--accent); color:var(--ink);}
.chip button{background:none; border:none; color:inherit; padding:0; font-size:.9rem; line-height:1; opacity:.7;}
input[type=search], input[type=text], input[type=password]{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:.85rem; color:var(--ink); font-family:inherit;}
.login-card{max-width:380px; margin:60px auto; text-align:left;}
.login-card .fld{margin-bottom:14px;}
.login-card .fld label{display:block; font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.login-card .fld input{width:100%; box-sizing:border-box;}
.login-card .err{color:var(--critical); font-size:.82rem; margin:-4px 0 14px; min-height:1em;}
.login-card .demo-hint{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:.76rem; color:var(--muted); margin-top:18px; line-height:1.6;}
.login-card .sim-warning{display:flex; align-items:flex-start; gap:8px; color:var(--warn); font-size:.78rem; margin-top:14px; text-align:left;}

.select-wrap{position:relative;}
.select-wrap select{appearance:none; background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:9px 32px 9px 14px; font-size:.85rem; font-weight:500; font-family:inherit;}
.select-wrap::after{content:"";position:absolute; right:12px; top:50%; width:7px; height:7px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-65%) rotate(45deg); pointer-events:none;}
#toolbar-row .select-wrap select{background:var(--surface);}

.btn{background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:9px 16px; font-size:.85rem; font-weight:500; display:inline-flex; align-items:center; gap:7px;}
.btn:hover{background:var(--grid);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.btn.primary:hover{filter:brightness(1.06);}
.btn.active{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.btn:disabled{opacity:.75; cursor:default;}
.spin{display:inline-flex; animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.svgchart{width:100%; height:auto; display:block; overflow:visible;}
.svgchart .grid-line{stroke:var(--grid); stroke-width:1;}
.svgchart .baseline{stroke:var(--baseline); stroke-width:1;}
.svgchart .axis-label{fill:var(--muted); font-size:10px; font-family:'IBM Plex Mono',monospace;}
.svgchart .weekend-band{fill:var(--ink); opacity:.035;}
.svgchart .area{fill:var(--cat-1); opacity:.1;}
.svgchart .line{fill:none; stroke:var(--cat-1); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.svgchart .line-prev{fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.55;}
.svgchart .dot-end{fill:var(--cat-1); stroke:var(--surface); stroke-width:2;}
.svgchart .dot-peak{fill:var(--cat-1); stroke:var(--surface); stroke-width:2;}
.svgchart .peak-label{fill:var(--ink-2); font-size:10px; font-weight:600; font-family:'IBM Plex Sans Thai',sans-serif;}
.trend-legend{display:flex; align-items:center; gap:16px; margin-top:10px; font-size:.76rem; color:var(--muted); flex-wrap:wrap;}
.trend-legend .key{display:inline-flex; align-items:center; gap:6px;}
.trend-legend .key svg{flex-shrink:0;}
.chart-wrap{position:relative;}
.crosshair{position:absolute; top:0; bottom:24px; width:1px; background:var(--baseline); pointer-events:none; display:none;}
.tooltip{position:fixed; pointer-events:none; background:var(--ink); color:var(--page-bg); border-radius:8px; padding:8px 11px; font-size:.76rem; line-height:1.45; display:none; z-index:9999; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.18);}
.tooltip .tt-title{font-weight:600; margin-bottom:2px;}

.colchart{display:flex; align-items:flex-end; gap:10px; height:170px; padding-top:10px;}
.colchart .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; cursor:default;}
.colchart .bar{width:100%; max-width:38px; border-radius:5px 5px 3px 3px; background:var(--cat-1); transition:opacity .1s;}
.colchart .col:hover .bar{opacity:.75;}
.colchart .colval{font-size:.72rem; font-weight:600; color:var(--ink-2); font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
.colchart .colcap{font-size:.68rem; color:var(--muted); text-transform:uppercase;}

.barlist{display:flex; flex-direction:column; gap:10px;}
.barlist .row{display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; cursor:pointer; border-radius:8px; padding:4px 6px; margin:-4px -6px;}
.barlist .row:hover{background:var(--surface-2);}
.barlist .row.selected{background:color-mix(in srgb, var(--accent) 14%, var(--surface));}
.barlist .lbl{font-size:.84rem; grid-column:1/2; display:flex; flex-direction:column; gap:1px; min-width:0;}
.barlist .lbl .name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.barlist .lbl .meta{font-size:.7rem; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
.barlist .val{font-family:'IBM Plex Mono',monospace; font-size:.8rem; text-align:right; white-space:nowrap;}
.barlist .track{grid-column:1/-1; height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.barlist .fill{height:100%; border-radius:4px;}

.heatmap-container{display:flex; flex-direction:column; gap:16px;}
.heatmap-block-title{font-size:.84rem; font-weight:600; color:var(--ink); margin-bottom:8px;}
.heatmap{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.heatmap .dow{font-size:.68rem; text-transform:uppercase; color:var(--muted); text-align:center; padding-bottom:4px; font-weight:600;}
.heatmap .cell{aspect-ratio:1/0.85; min-height:60px; border-radius:6px; position:relative; cursor:default; border:1px solid var(--border); transition:transform .1s, box-shadow .1s;}
.heatmap .cell:not(.empty){cursor:pointer;}
.heatmap .cell:not(.empty):hover{transform:scale(1.02); z-index:2; box-shadow:0 4px 12px rgba(0,0,0,.18);}
.heatmap .cell.clicked{outline:2px solid var(--accent); outline-offset:1px; z-index:3;}
.drill-panel{margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;}
.drill-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.drill-panel-title{font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
.drill-panel-close{background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; padding:2px 6px; border-radius:4px;}
.drill-panel-close:hover{background:var(--surface-2);}
.drill-table{width:100%; font-size:.8rem; border-collapse:collapse;}
.drill-table th{text-align:left; padding:5px 10px; color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border);}
.drill-table td{padding:6px 10px; border-top:1px solid var(--border);}
.drill-table td.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
.drill-table tbody tr:hover{background:var(--surface-2);}

.heatmap .cell.peak{border:2px solid var(--accent); box-shadow:0 0 0 1px var(--accent);}
.heatmap .cell.peak::after{content:"★ PEAK"; position:absolute; top:4px; right:5px; font-size:.55rem; font-weight:700; color:var(--accent); letter-spacing:.02em;}
.heatmap .cell .num{position:absolute; top:4px; left:6px; font-size:.7rem; font-family:'IBM Plex Mono',monospace; opacity:.85; font-weight:500;}
.heatmap .cell .amt{position:absolute; bottom:5px; left:6px; right:6px; font-size:.7rem; font-weight:600; font-family:'IBM Plex Mono',monospace; letter-spacing:-.02em;}
.heatmap .cell.empty{background:transparent; border-color:transparent;}
.legend-scale{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:.72rem; color:var(--muted); flex-wrap:wrap;}
.legend-scale .sq{width:14px; height:14px; border-radius:3px;}
.legend-scale .peak-badge{display:inline-flex; align-items:center; gap:4px; margin-left:14px; color:var(--accent); font-weight:600;}

.month-select-row{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.month-select-row .lbl{font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.all-months-note{font-size:.78rem; color:var(--muted); font-family:'IBM Plex Sans Thai',sans-serif;}
/* year-from/year-to pair shown alongside the month picker once loaded data spans >1 calendar year
   (see renderPeriodSelect()) — display toggled inline between 'none' and 'flex' in JS. */
.year-range{align-items:center; gap:8px; padding-right:10px; border-right:1px solid var(--border);}
.year-range .lbl{font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.year-range-to{font-size:.78rem; color:var(--muted); font-family:'IBM Plex Sans Thai',sans-serif;}
/* Custom day-range picker (renderPeriodSelect()/wirePeriodSelect()) — a small toggle button that
   reveals two native date inputs inline in the same row; flex-wrap already on .month-select-row
   lets this drop to its own line on narrow viewports without extra work. */
.custom-range-wrap{align-items:center; gap:6px; flex-wrap:wrap;}
.custom-range-wrap input[type=date]{font:inherit; font-size:.82rem; padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--ink); font-family:'IBM Plex Mono',monospace;}
.custom-range-wrap .to-lbl{font-size:.78rem; color:var(--muted);}

.cat-matrix{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;}
.cat-card{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; transition:border-color .15s;}
.cat-card:hover{border-color:var(--cat-1);}
.cat-card.active{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--surface));}
.cat-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.cat-badge{display:inline-flex; align-items:center; gap:6px; font-size:.82rem; font-weight:600;}
.cat-badge .dot{width:10px; height:10px;}
.cat-rev{font-family:'Oswald',sans-serif; font-size:1.35rem; font-weight:600;}
.cat-sub{font-size:.74rem; color:var(--muted); font-family:'IBM Plex Mono',monospace;}

.tbl-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px;}
/* Used by the Products catalog and Customers table (both paginated with Show more/all/less) — a
   fixed height + its own vertical scrollbar means expanding from 50 rows to thousands never
   changes this box's outer size, so nothing below it on the page jumps around. table.data th's
   existing position:sticky only actually does anything once there's a scrolling ancestor like
   this one, so the header now correctly stays pinned while scrolling within the box too. */
.tbl-wrap-fixed{max-height:520px; overflow-y:auto; scrollbar-gutter:stable;}
table.data{width:100%; border-collapse:collapse; font-size:.83rem; background:var(--surface);}
/* table-layout:auto (the default) recomputes every column's width from the content of every row
   currently in the DOM — fine for a short, static table, but wrong for a paginated one: revealing
   more rows via Show more/Show all changes what the widest content in each column is, so every
   already-visible column (and its text) visibly shifts sideways. .fixed-cols + explicit <th>
   widths (set inline per column, see catalogCols/custCols) makes column widths depend only on
   those declared widths, never on row content, so paginating never moves anything. */
table.data.fixed-cols{table-layout:fixed;}
table.data th{text-align:left; padding:10px 14px; background:var(--surface-2); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:sticky; top:0; cursor:pointer; user-select:none;}
table.data th.num, table.data td.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
table.data td{padding:9px 14px; border-top:1px solid var(--border); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
table.data tbody tr.inv-row:hover{background:var(--surface-2); cursor:pointer;}
table.data td.wrap{white-space:normal; max-width:260px;}
.detail-row td{background:var(--page-bg); padding:0;}
.detail-inner{padding:10px 18px 16px 40px;}
.detail-inner table{width:100%; font-size:.79rem; border-collapse:collapse;}
.detail-inner th{text-align:left; color:var(--muted); font-weight:500; padding:4px 8px; font-size:.68rem; text-transform:uppercase;}
.detail-inner td{padding:4px 8px; border-top:1px solid var(--border);}
.sort-arrow{opacity:.4; font-size:.7em; margin-left:3px;}
.empty-msg{color:var(--muted); font-size:.88rem; padding:30px 10px; text-align:center;}
#emptyState{display:none; color:var(--muted);}
body.no-data .data-panel{display:none;}
body.no-data #emptyState{display:block;}
body.no-data .select-wrap, body.no-data #exportBtn, body.no-data #printBtn{display:none;}

/* REDESIGNED (2026-09-24, direct feedback: "looks kinda boring") — value label out of the bar and
   into its own tabular column, bar thinned with a rounded cap, current month in full accent hue and
   every prior month a lighter tint of the same hue (Emphasis form), invoice count moved to a hover
   tooltip so the visible row only carries the two figures that actually matter at a glance: revenue
   and the growth badge. */
.momrow{display:grid; grid-template-columns:78px 1fr 108px 70px; align-items:center; gap:12px; padding:5px 6px; border-radius:8px; margin:0 -6px;}
.momrow:hover{background:var(--surface-2);}
.momrow .mom-label{font-size:.79rem; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.momrow .mom-track{height:11px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
.momrow .mom-fill{height:100%; border-radius:6px; transition:width .25s ease;}
.momrow .mom-val{font-family:'IBM Plex Mono',monospace; font-size:.82rem; text-align:right; white-space:nowrap;}
.momrow .growth-badge{justify-self:end;}
.momrow .mom-growth-spacer{display:inline-block;}
.growth-badge{font-size:.72rem; font-weight:600; padding:2px 8px; border-radius:999px;}
.growth-badge.up{color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
.growth-badge.down{color:var(--critical); background:color-mix(in srgb, var(--critical) 14%, var(--surface));}

/* Forecast page (Coil Reorder Forecast / Dead Stock tables) */
.badge-tag{display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px; font-size:.7rem; font-weight:600; white-space:nowrap;}
.badge-tag.rising{color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
.badge-tag.fading{color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, var(--surface));}
.badge-tag.steady{color:var(--muted); background:var(--surface-2);}
.badge-tag.abc-a{color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface));}
.badge-tag.abc-b{color:var(--ink); background:var(--surface-2); opacity:.82;}
.badge-tag.abc-c{color:var(--muted); background:var(--surface-2);}
.badge-tag.dead{color:var(--critical); background:color-mix(in srgb, var(--critical) 14%, var(--surface));}
.coil-spec-cell{display:flex; align-items:center; gap:8px;}
.coil-th-badge{font-family:'IBM Plex Mono',monospace; font-size:.74rem; font-weight:700; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:2px 7px; white-space:nowrap;}
.coil-roll-pill{display:inline-flex; align-items:center; background:color-mix(in srgb, var(--accent) 12%, var(--surface)); color:var(--accent); border-radius:999px; padding:3px 10px; font-weight:700; font-size:.8rem; white-space:nowrap;}
#forecastCoilTableWrap th, #forecastDeadTableWrap th, #forecastUnitTableWrap th{cursor:default;}
.coil-row, .unit-row{cursor:pointer;}
.coil-row:hover, .unit-row:hover{background:var(--surface-2);}
.coil-row.selected, .unit-row.selected{background:color-mix(in srgb, var(--accent) 9%, var(--surface));}
.color-unknown{font-style:italic; opacity:.82; cursor:help;}
.fc-box-label{display:inline-block; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius:5px; padding:3px 9px; margin-bottom:6px;}
.info-dot{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; background:var(--surface-2); color:var(--muted); font-size:.64rem; font-weight:700; margin-left:5px; cursor:help; vertical-align:middle;}
.kpi-clickable{cursor:pointer; transition:background .12s, box-shadow .12s;}
.kpi-clickable:hover{background:var(--surface-2); box-shadow:0 0 0 1px var(--border) inset;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--page-bg); padding:11px 18px; border-radius:9px; font-size:.84rem; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1;}

#scrollTopBtn{position:fixed; right:22px; bottom:22px; z-index:40; width:42px; height:42px; border-radius:50%; background:var(--ink); color:var(--page-bg); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.25); opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity .18s, transform .18s;}
#scrollTopBtn.show{opacity:.92; pointer-events:auto; transform:translateY(0);}
#scrollTopBtn:hover{opacity:1;}

.filter-bar{margin-bottom:10px;}

/* donut chart (Overview "At a Glance" salesperson chart) */
.pie-wrap{display:flex; align-items:center; gap:32px; flex-wrap:wrap;}
.piechart-block{position:relative; flex:0 0 auto; line-height:0;}
.piechart path, .piechart circle{cursor:pointer; transition:opacity .12s, stroke-width .12s;}
.piechart-center{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; width:64%;}
.piechart-center .val{display:block; font-size:1.22rem; font-weight:700; color:var(--ink); line-height:1.15;}
.piechart-center .lbl{display:block; font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
.pie-legend{display:flex; flex-direction:column; gap:13px; flex:1; min-width:250px;}
.pie-legend-row{border-radius:8px; padding:7px 10px; margin:-7px -10px; cursor:pointer; transition:background .12s;}
.pie-legend-row:hover{background:var(--surface-2);}
.pie-legend-top{display:flex; align-items:center; gap:9px;}
.pie-legend-top .sq{width:11px; height:11px; border-radius:3px; flex:0 0 auto;}
.pie-legend-top .name{font-size:.94rem; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pie-legend-top .val{font-size:.94rem; font-weight:600; font-variant-numeric:tabular-nums; flex:0 0 auto; white-space:nowrap;}
.pie-legend-bottom{display:flex; align-items:center; gap:9px; margin-top:6px; padding-left:20px;}
.pie-legend-bottom .mini-track{flex:1; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden;}
.pie-legend-bottom .mini-fill{height:100%; border-radius:3px;}
.pie-legend-bottom .pct{font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:42px; text-align:right;}
.pie-legend-sub{font-size:.76rem; color:var(--muted); margin-top:3px; padding-left:20px;}

@media print{
  #topnav, .no-print, .toolbar, #pagenav, #navToggle{display:none !important;}
  main#content{max-width:100%; padding:14px 18px 30px;} body{background:#fff;}
  /* Report button (printReport()) shows #page-overview + #page-trend together and hides the rest
     via inline style — this just keeps Trend from awkwardly splitting mid-section onto page 1. */
  #page-trend{page-break-before:always; break-before:page;}

  /* Without explicit break rules, the browser's print pagination defaults are inconsistent: a
     heading can get stranded at the bottom of one page while its content starts the next ("title
     tossed to the previous page"), and a tall container that isn't allowed to split internally
     gets pushed as one whole unit onto the next page, leaving the previous page half-empty.
     Fix: glue headings to what follows them, but only forbid *small* elements (one KPI tile, one
     MoM row, one table row) from splitting mid-element — never a whole .card or .grid, since those
     can legitimately be taller than one page's remaining space and need to be allowed to break
     between their own children instead of jumping wholesale. */
  .panel-head, .panel-head h2{break-after:avoid; page-break-after:avoid;}
  .kpi, .callout, .momrow, .cat-card, tr, .chart-wrap{break-inside:avoid; page-break-inside:avoid;}
  .grid, .card{break-inside:auto; page-break-inside:auto;}
  section.panel{margin-bottom:20px;}
}
@media (max-width:840px){
  #topnav-inner{flex-wrap:wrap;}
  .nav-toggle{display:inline-flex;}
  nav#pagenav{display:none; flex-direction:column; align-items:stretch; width:100%; gap:0; border-top:1px solid rgba(255,255,255,0.08); margin-top:8px; padding-top:6px;}
  nav#pagenav.open{display:flex;}
  nav#pagenav a{border-left:3px solid transparent; border-bottom:none; border-radius:0; width:100%; justify-content:flex-start; padding:10px 14px;}
  nav#pagenav a.active{border-left-color:var(--accent); border-bottom-color:transparent;}
  #toolbar-row{justify-content:flex-start;}
  main#content{padding:20px 16px 70px;}
}
</style>

<body>
<div id="app"></div>
<script id="app-src">
(function () {
  'use strict';

  /* ==============================================================================
     PARSER — CSV parsing logic for the Thai ERP sales/deposit exports. Carried over
     unmodified from the "HTML ver2" 2026-09-16 bug-fix pass.
     ============================================================================== */
  const CATEGORY_MAP = {
    '01': 'Roof Sheeting', '02': 'Roof Sheeting', '03': 'Roof Sheeting', '04': 'Roof Sheeting', '05': 'Roof Sheeting',
    '06': 'Wall Cladding', '07': 'Wall Cladding',
    '08': 'Ceiling Panels',
    '09': 'Skylight Sheets',
    '10': 'Screws & Fasteners',
    '11': 'Welding & Sealants',
    '12': 'Tools',
    '13': 'Fence Panels',
    '14': 'Steel Pipes',
    '15': 'Fascia Boards',
    '16': 'Tapes & Sealing',
    '77': 'Services & Off-grade',
    '88': 'PU/PE Insulation',
    '99': 'Giveaways',
  };
  function categoryFor(prefix, amount, desc) {
    if (prefix === '99') {
      const d = desc || '';
      if (d.includes('ผนังแซนวิช') || d.includes('แซนวิช')) {
        return 'Wall Cladding';
      }
      // BUG FIX (external audit #9, 2026-09-23): 'amount > 0' routed a negative amount (e.g. a
      // delivery refund or over-charge correction) to 'Giveaways' — the free-promo category — right
      // alongside genuinely free items, when a negative-amount line is a real financial transaction,
      // just a credit rather than a charge. No negative-amount line exists anywhere in the real
      // dataset today (checked directly), so this hasn't produced a wrong number yet, but the fix
      // costs nothing and closes the gap before real refund data ever arrives. 'Giveaways' is now
      // reserved for its actual definition: exactly zero.
      return (amount && amount !== 0) ? 'Shipping & Services' : 'Giveaways';
    }
    return CATEGORY_MAP[prefix] || 'Other';
  }

  // categoryFor()'s return value doubles as an internal matching key (STATE.filters.category,
  // data-cat attributes, category === comparisons all over the aggregation layer) AND, until now,
  // the literal text shown to the user — which is why category names stayed in English even under
  // the Thai UI. This maps that same English key to a translated display string only; the
  // underlying key itself is untouched everywhere else, so filtering/matching logic keeps working.
  const CATEGORY_LABEL_KEYS = {
    'Roof Sheeting': 'catRoofSheeting', 'Wall Cladding': 'catWallCladding', 'Ceiling Panels': 'catCeilingPanels',
    'Skylight Sheets': 'catSkylightSheets', 'Screws & Fasteners': 'catScrewsFasteners', 'Welding & Sealants': 'catWeldingSealants',
    'Tools': 'catTools', 'Fence Panels': 'catFencePanels', 'Steel Pipes': 'catSteelPipes', 'Fascia Boards': 'catFasciaBoards',
    'Tapes & Sealing': 'catTapesSealing', 'Services & Off-grade': 'catServicesOffgrade', 'PU/PE Insulation': 'catPuPeInsulation',
    'Shipping & Services': 'catShippingServices',
    'Giveaways': 'catGiveaways', 'Other': 'catOther',
  };
  function categoryLabel(cat) {
    const key = CATEGORY_LABEL_KEYS[cat];
    return key ? t(key) : (cat || '');
  }

  function tokenizeCsvLine(line) {
    const out = [];
    let i = 0, cur = '', inQuotes = false;
    while (i < line.length) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"') {
          if (line[i + 1] === '"') { cur += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        cur += ch; i++; continue;
      } else {
        if (ch === '"') { inQuotes = true; i++; continue; }
        if (ch === ',') { out.push(cur); cur = ''; i++; continue; }
        cur += ch; i++; continue;
      }
    }
    out.push(cur);
    return out;
  }
  function toNum(s) {
    if (s === undefined || s === null) return null;
    const s2 = String(s).replace(/,/g, '').trim();
    if (s2 === '') return null;
    const n = Number(s2);
    return Number.isFinite(n) ? n : null;
  }
  function parseAnyDateToIso(dateStr) {
    if (!dateStr) return null;
    const s = dateStr.trim();
    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (!m) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      return null;
    }
    const p1 = parseInt(m[1], 10), p2 = parseInt(m[2], 10), yearRaw = parseInt(m[3], 10);
    const yearCE = yearRaw > 2400 ? yearRaw - 543 : yearRaw;
    // BUG FIX (2026-09-16): these Express exports are always D/M/YYYY (verified directly against
    // real files: "01/12/2568" on the report's own "1 Dec 2568" opening date, and schema.md's own
    // worked example "7/1/2569 -> 2026-01-07" only holds if day=p1/month=p2). Default to D/M/YYYY;
    // only swap if the assumed month (p2) is impossible (>12) and p1 could plausibly be a month.
    let day = p1, month = p2;
    if (month > 12 && day <= 12) { day = p2; month = p1; }
    return yearCE + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  }

  // BUG FIX (external audit #22, 2026-09-23): thShortLabel used to append the Gregorian year's last
  // 2 digits to a Thai month name (e.g. "ม.ค. 26"), which reads as Buddhist Era 2526 (1983 CE) to a
  // Thai reader, not "January 2026". thLabel (long form) was already correct — toLocaleDateString's
  // own 'th-TH' locale converts to BE automatically for { year: 'numeric' } — only the short form's
  // manual '+ String(y).slice(-2)' bypassed that conversion. Fixed by deriving the short year from
  // the same BE-converted long label instead of re-deriving it from the raw Gregorian year.
  function getMonthLabelTH(yearMonthStr) {
    const [y, m] = yearMonthStr.split('-');
    const d = new Date(y + '-' + m + '-01T00:00:00');
    const enLabel = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const shortLabel = d.toLocaleDateString('en-US', { month: 'short' }) + ' ' + String(y).slice(-2);
    const thLabel = d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
    const thYearBE = (thLabel.match(/(\d{4})/) || [, String(Number(y) + 543)])[1];
    const thShortLabel = d.toLocaleDateString('th-TH', { month: 'short' }) + ' ' + thYearBE.slice(-2);
    return { label: enLabel, shortLabel: shortLabel, thLabel: thLabel, thShortLabel: thShortLabel };
  }

  function mapCols(cols) {
    const m = {};
    cols.forEach((c, i) => { const k = (c || '').replace(/\s+/g, ' ').trim(); if (k && !(k in m)) m[k] = i; });
    return m;
  }
  const REPORT_FOOTER_RE = /^\s*รวม(?:ทั้งสิ้น)?\s*[\d,*]+\s*ใบ/;

  const DASHBOARD_EXPORT_HEADER = 'RecordType,InvoiceNo,Date,PaymentType,CustomerCode,CustomerName,Salesperson,ProductValue,Total,CashReceived,CheckReceived,WithholdingTax,DepositApplied,SkuCode,Category,Description,Qty,Unit,UnitPrice,Amount';
  function sniffReportType(decodedText) {
    const head = decodedText.slice(0, 6000);
    if (/รายงานขายเงินสด/.test(head)) return 'cash';
    if (/รายงานใบกำกับสินค้า/.test(head)) return 'credit';
    if (/รายงานใบรับมัดจำ/.test(head)) return 'deposits';
    // This dashboard's own "Export CSV" output (see exportDashboardCsv) — round-tripping it back
    // in should restore exactly what was exported, including line items, not just invoice totals.
    if (decodedText.replace(/^﻿/, '').slice(0, DASHBOARD_EXPORT_HEADER.length) === DASHBOARD_EXPORT_HEADER) return 'dashboard_export';
    return null;
  }

  // Reads this dashboard's own export format back in — one CSV with a RecordType column
  // ('INVOICE' | 'LINEITEM') instead of the Express reports' header/footer/embedded-annotation
  // structure, since it's a format we fully control. Returns the same {invoices, lineItems,
  // warnings} shape as the other parsers so it drops straight into the same ingestion pipeline.
  function parseDashboardExport(rawText) {
    const lines = rawText.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim() !== '');
    const invoices = [];
    const lineItems = [];
    const warnings = [];
    if (!lines.length) return { invoices, lineItems, warnings };
    const header = tokenizeCsvLine(lines[0]).map(h => h.trim());
    const idx = {};
    header.forEach((h, i) => { if (!(h in idx)) idx[h] = i; });
    const col = (cols, name) => (cols[idx[name]] || '').trim();

    for (let ln = 1; ln < lines.length; ln++) {
      const cols = tokenizeCsvLine(lines[ln]);
      const type = col(cols, 'RecordType');
      if (type === 'INVOICE') {
        invoices.push({
          date: col(cols, 'Date'), invoiceNo: col(cols, 'InvoiceNo'), paymentType: col(cols, 'PaymentType') || 'cash',
          customerCode: col(cols, 'CustomerCode'), customerName: col(cols, 'CustomerName'), salesperson: col(cols, 'Salesperson'),
          productValue: toNum(cols[idx['ProductValue']]) || 0, total: toNum(cols[idx['Total']]) || 0,
          cashReceived: toNum(cols[idx['CashReceived']]) || 0, checkReceived: toNum(cols[idx['CheckReceived']]) || 0,
          withholdingTax: toNum(cols[idx['WithholdingTax']]) || 0, depositApplied: toNum(cols[idx['DepositApplied']]) || 0,
          itemCount: 0,
        });
      } else if (type === 'LINEITEM') {
        const qtyRaw = col(cols, 'Qty');
        lineItems.push({
          invoiceNo: col(cols, 'InvoiceNo'), date: col(cols, 'Date'), skuCode: col(cols, 'SkuCode') || null, category: col(cols, 'Category'),
          description: col(cols, 'Description'), qty: qtyRaw === '' ? null : toNum(qtyRaw), unit: col(cols, 'Unit'),
          unitPrice: toNum(cols[idx['UnitPrice']]), amount: toNum(cols[idx['Amount']]) || 0,
        });
      } else {
        warnings.push({ line: ln + 1, reason: 'unrecognized RecordType: ' + type });
      }
    }
    const counts = {};
    lineItems.forEach(li => { counts[li.invoiceNo] = (counts[li.invoiceNo] || 0) + 1; });
    invoices.forEach(inv => { inv.itemCount = counts[inv.invoiceNo] || 0; });
    return { invoices, lineItems, warnings };
  }

  const CASH_HEADER_FALLBACK = { 'วันที่': 0, 'เลขที่': 1, 'รหัสลูกค้า': 2, 'ชื่อลูกค้า': 3, 'พนักงานขาย': 4, 'มูลค่าสินค้า': 7, 'VAT.': 8, 'รวมทั้งสิ้น': 9, 'ยอดรับเกิน': 10, 'รับด้วย ง/ส': 11, 'รับด้วยเช็ค': 12, 'ภาษี ณ ที่จ่าย': 13 };
  const CASH_LINE_HEADER_FALLBACK = { 'จำนวน': 3, 'ราคาต่อหน่วย': 5, 'ส่วนลด': 6, 'จำนวนเงิน': 7 };

  function parseCashSalesReport(rawText) {
    const lines = rawText.replace(/^﻿/, '').split(/\r?\n/);
    const invoices = [];
    const lineItems = [];
    const warnings = [];
    let currentInvoice = null;
    let footerHit = false;
    let H = CASH_HEADER_FALLBACK;
    let LH = CASH_LINE_HEADER_FALLBACK;

    for (let ln = 0; ln < lines.length; ln++) {
      const raw = lines[ln];
      if (!raw || !raw.trim()) continue;
      if (footerHit) continue;

      const cols = tokenizeCsvLine(raw);
      const c0 = (cols[0] || '').trim();

      if (REPORT_FOOTER_RE.test(c0)) { footerHit = true; continue; }
      if (/หน้า\s*:/.test(c0) || /^รายงานขายเงินสด/.test(c0) || /^วันที่จาก/.test(c0) || /^รหัสลูกค้า/.test(c0) || /^พนักงานขาย\s/.test(c0) || /^-{10,}/.test(c0)) continue;
      if (c0 === 'วันที่' && (cols[1] || '').trim() === 'เลขที่') { H = mapCols(cols); continue; }
      if (cols[2] && cols[2].trim() === 'รายละเอียด') { LH = mapCols(cols); continue; }

      if (/ตัดใบรับมัดจำ/.test(c0)) {
        const amtMatch = c0.match(/([\d,]+\.?\d*)\s*$/);
        const amt = amtMatch ? toNum(amtMatch[1]) : null;
        const refMatch = c0.match(/#\s*(\S+)/);
        if (currentInvoice) {
          currentInvoice.depositApplied = (currentInvoice.depositApplied || 0) + (amt || 0);
          if (refMatch) (currentInvoice.depositRefs = currentInvoice.depositRefs || []).push(refMatch[1]);
        }
        continue;
      }

      const iso = parseAnyDateToIso(c0);
      if (iso) {
        currentInvoice = {
          date: iso, invoiceNo: (cols[H['เลขที่']] || '').trim(), customerCode: (cols[H['รหัสลูกค้า']] || '').trim(),
          customerName: (cols[H['ชื่อลูกค้า']] || '').trim(), salesperson: (cols[H['พนักงานขาย']] || '').trim(),
          productValue: toNum(cols[H['มูลค่าสินค้า']]) || 0, vat: toNum(cols[H['VAT.']]) || 0, total: toNum(cols[H['รวมทั้งสิ้น']]) || 0, overpaid: toNum(cols[H['ยอดรับเกิน']]) || 0,
          cashReceived: toNum(cols[H['รับด้วย ง/ส']]) || 0, checkReceived: toNum(cols[H['รับด้วยเช็ค']]) || 0, withholdingTax: toNum(cols[H['ภาษี ณ ที่จ่าย']]) || 0,
          depositApplied: 0, itemCount: 0,
        };
        invoices.push(currentInvoice);
        continue;
      }

      if (c0 === '' && cols[1] && /^\d+$/.test(cols[1].trim()) && cols[2] && cols[2].trim() !== '') {
        if (!currentInvoice) { warnings.push({ line: ln + 1, reason: 'line item with no open invoice' }); continue; }
        const desc = cols[2].trim();
        const skuMatch = desc.match(/^(\d{2})-(\d{3})\s*-\s*(.*)$/);
        const skuCode = skuMatch ? (skuMatch[1] + '-' + skuMatch[2]) : null;
        const prefix = skuMatch ? skuMatch[1] : null;
        let desc2 = skuMatch ? skuMatch[3].trim() : desc;

        const qtyIdx = LH['จำนวน'], unitIdx = qtyIdx + 1, priceIdx = LH['ราคาต่อหน่วย'], amtIdx = LH['จำนวนเงิน'];
        let qty = toNum(cols[qtyIdx]);
        let unit = (cols[unitIdx] || '').trim();
        let unitPrice = toNum(cols[priceIdx]);
        let amount = toNum(cols[amtIdx]);

        // BUG FIX (2026-09-27, confirmed against real data — external audit #4/#23, first raised
        // 2026-09-23): the old regex here (`/^(.*)",\s*([\d.]+),\s*([^"]*)"$/`) never actually matched
        // the real corruption shape, which is why zero "recovered corrupted line" warnings had ever
        // fired — it assumed the merged field ends right after the unit (a trailing `"`), but real
        // corrupted lines (e.g. `กรรไกรตัดสังกะสี 10",1.00,อัน,130.00,",130.00,SO6812/1513   9`) also
        // swallow the unit price, amount, and often an SO-reference column, since the source file's
        // own escaping only doubles the literal `"` (correctly, as `""`) but never actually closes
        // that CSV field afterward — tokenizeCsvLine() has no way to know the field was supposed to
        // end there, so it keeps absorbing every following column as literal text until it stumbles
        // on some later `"` that happens to look like a close. The previous "investigated, not
        // changed" note guessed the un-shifted cols[qtyIdx]/cols[priceIdx] indices might already be
        // landing correctly "by construction" — verified directly against the real 9-month dataset and
        // that guess was wrong: 35 real line items were silently recording amount:0 this way (~฿3,595
        // total, e.g. a real ฿130 sale of "กรรไกรตัดสังกะสี 10\"" 10-inch tin snips reading as free).
        // New regex captures qty/unit/unitPrice/amount directly from the merged text instead of
        // re-indexing `cols` (which is exactly what could never work, per the original audit's own
        // concern) and tolerates an optional trailing SO-reference column.
        const corruptMatch = desc2.match(/^(.*)",([\d.]+),([^,]+),([\d.]+),"?,([\d.]+)(?:,.*)?$/);
        if (corruptMatch) {
          desc2 = corruptMatch[1].trim() + '"';
          qty = toNum(corruptMatch[2]);
          unit = corruptMatch[3].trim();
          unitPrice = toNum(corruptMatch[4]);
          amount = toNum(corruptMatch[5]);
          warnings.push({ line: ln + 1, reason: 'recovered corrupted line' });
        }

        currentInvoice.itemCount++;
        lineItems.push({
          invoiceNo: currentInvoice.invoiceNo, date: currentInvoice.date, skuCode: skuCode, prefix: prefix,
          category: categoryFor(prefix, amount, desc2), description: desc2, qty: qty, unit: unit, unitPrice: unitPrice, amount: amount || 0,
        });
        continue;
      }
      warnings.push({ line: ln + 1, reason: 'unrecognized cash-sales line' });
    }
    return { invoices, lineItems, warnings };
  }

  const CREDIT_HEADER_FALLBACK = { 'วันที่': 0, 'เลขที่': 1, 'ลูกค้า': 2, 'พนักงานขาย': 3, 'มูลค่าสินค้า': 6, 'VAT.': 7, 'รวมทั้งสิ้น': 8, 'ครบกำหนด': 9, 'ใบสั่งขาย': 10, 'เก็บเงิน': 11 };

  function parseCreditSalesReport(rawText) {
    const lines = rawText.replace(/^﻿/, '').split(/\r?\n/);
    const invoices = [];
    const lineItems = [];
    const warnings = [];
    let currentInvoice = null;
    let footerHit = false;
    let H = CREDIT_HEADER_FALLBACK;
    let LH = CREDIT_LINE_HEADER_FALLBACK;

    for (let ln = 0; ln < lines.length; ln++) {
      const raw = lines[ln];
      if (!raw || !raw.trim()) continue;

      const c0 = (cols[0] || '').trim();

      if (c0 === 'วันที่' && (cols[1] || '').trim() === 'เลขที่') { H = mapCols(cols); continue; }
      if (cols[3] && cols[3].trim() === 'รายละเอียด') { LH = mapCols(cols); continue; }

      if (/ตัดใบรับมัดจำ/.test(c0)) {
        const amtMatch = c0.match(/([\d,]+\.?\d*)\s*$/);
        const amt = amtMatch ? toNum(amtMatch[1]) : null;
        if (currentInvoice) currentInvoice.depositApplied = (currentInvoice.depositApplied || 0) + (amt || 0);
        continue;
      }

      const iso = parseAnyDateToIso(c0);
      if (iso) {
        currentInvoice = {
          date: iso, invoiceNo: (cols[H['เลขที่']] || '').trim(), customerCode: '',
          customerName: (cols[H['ลูกค้า']] || '').trim(), salesperson: (cols[H['พนักงานขาย']] || '').trim(),
          productValue: toNum(cols[H['มูลค่าสินค้า']]) || 0, vat: toNum(cols[H['VAT.']]) || 0, total: toNum(cols[H['รวมทั้งสิ้น']]) || 0, overpaid: 0,
          cashReceived: 0, checkReceived: 0, withholdingTax: 0, depositApplied: 0, itemCount: 0,
          dueDate: parseAnyDateToIso((cols[H['ครบกำหนด']] || '').trim()), soRef: (cols[H['ใบสั่งขาย']] || '').trim(), collected: (cols[H['เก็บเงิน']] || '').trim(),
        };
        invoices.push(currentInvoice);
        continue;
      }

      if (c0 === '' && cols[1] && /^\d+$/.test(cols[1].trim()) && cols[2] && cols[2].trim() !== '') {
        if (!currentInvoice) { warnings.push({ line: ln + 1, reason: 'line item with no open invoice' }); continue; }
        const skuField = cols[2].trim();
        const skuMatch = skuField.match(/^(\d{2})-(\d{3})/);
        const skuCode = skuMatch ? (skuMatch[1] + '-' + skuMatch[2]) : null;
        const prefix = skuMatch ? skuMatch[1] : null;
        const qtyIdx = LH['จำนวน'], unitIdx = qtyIdx + 1, priceIdx = LH['ราคาต่อหน่วย'], amtIdx = LH['จำนวนเงิน'];
        const description = (cols[3] || '').trim();
        const qty = toNum(cols[qtyIdx]);
        const unit = (cols[unitIdx] || '').trim();
        const unitPrice = toNum(cols[priceIdx]);
        const amount = toNum(cols[amtIdx]) || 0;

        currentInvoice.itemCount++;
        lineItems.push({
          invoiceNo: currentInvoice.invoiceNo, date: currentInvoice.date, skuCode: skuCode, prefix: prefix,
          category: categoryFor(prefix, amount, description), description: description, qty: qty, unit: unit, unitPrice: unitPrice, amount: amount,
        });
        continue;
      }
      warnings.push({ line: ln + 1, reason: 'unrecognized credit-sales line' });
    }
    return { invoices, lineItems, warnings };
  }

  function parseDepositsReport(rawText) {
    const lines = rawText.replace(/^﻿/, '').split(/\r?\n/);
    const deposits = [];
    const warnings = [];
    let currentCustomer = null;
    let currentDeposit = null;
    let inOffsetSection = false;
    let footerHit = false;

    for (let ln = 0; ln < lines.length; ln++) {
      const raw = lines[ln];
      if (!raw || !raw.trim()) continue;
      if (footerHit) continue;

      const cols = tokenizeCsvLine(raw);
      const c0 = (cols[0] || '').trim();

      if (REPORT_FOOTER_RE.test(c0)) { footerHit = true; continue; }
      if (/หน้า\s*:/.test(c0) || /^รายงานใบรับมัดจำ/.test(c0) || /^วันที่จาก/.test(c0) || /^รหัสลูกค้า/.test(c0) || /^พนักงานขาย\s/.test(c0) || /^-{5,}/.test(c0) || /^={5,}/.test(c0) || /^หมายเหตุ/.test(c0)) { continue; }
      if ((cols[1] || '').trim() === 'เลขที่' && (cols[2] || '').trim() === 'วันที่') { continue; }
      if (cols[2] && cols[2].trim() === 'รายละเอียด') { continue; }

      if (/^\s*รวม\s+\S/.test(c0)) { inOffsetSection = false; continue; }
      const restEmptyForNoise = cols.slice(1).every(c => !c || !c.trim());
      if (restEmptyForNoise && /บาท\s*$/.test(c0)) { continue; }
      if (c0 === 'เอกสารที่ตัด:') { inOffsetSection = true; continue; }
      if (inOffsetSection && cols[0] === '' && /^(HS|IV)/.test((cols[1] || '').trim())) {
        if (currentDeposit) currentDeposit.offsetAgainst.push({ invoiceNo: (cols[1] || '').trim(), amount: toNum(cols[4]) || 0 });
        continue;
      }

      const restEmpty = cols.slice(1).every(c => !c || !c.trim());
      if (restEmpty && /\//.test(c0) && !/^\s*รวม/.test(c0) && !parseAnyDateToIso(c0) && c0 !== 'เอกสารที่ตัด:') {
        const gm = c0.match(/^(.+?)\s*\/\s*(\S+)$/);
        if (gm) { currentCustomer = { name: gm[1].trim(), code: gm[2].trim() }; inOffsetSection = false; continue; }
      }

      const c0Flag = c0.replace(/\*/g, '').trim();
      const isCancelled = /\*/.test(c0);

      if (c0Flag === '' && /^AI\S*\d/.test((cols[1] || '').trim())) {
        inOffsetSection = false;
        currentDeposit = {
          docNo: (cols[1] || '').trim(), date: parseAnyDateToIso((cols[2] || '').trim()), salesperson: (cols[3] || '').trim(),
          amount: toNum(cols[5]) || 0, vat: toNum(cols[6]) || 0, total: toNum(cols[7]) || 0,
          dueDate: parseAnyDateToIso((cols[8] || '').trim()), balanceDue: toNum(cols[9]) || 0, fullyOffset: (cols[10] || '').trim(),
          cashReceived: toNum(cols[11]) || 0, checkReceived: toNum(cols[12]) || 0, cancelled: isCancelled,
          customerName: currentCustomer ? currentCustomer.name : null, customerCode: currentCustomer ? currentCustomer.code : null,
          offsetAgainst: [], items: [],
        };
        deposits.push(currentDeposit);
        continue;
      }
      if (c0Flag === '' && /^\d+$/.test((cols[1] || '').trim()) && cols[2] && cols[2].trim() !== '') {
        if (currentDeposit) currentDeposit.items.push({ seq: (cols[1] || '').trim(), description: cols[2].trim(), amount: toNum(cols[4]) || 0 });
        continue;
      }
      warnings.push({ line: ln + 1, reason: 'unrecognized deposits line' });
    }

  }

  const COLOR_WORDS = [

  const COLOR_LABEL_KEYS = {
    Zinc: 'colorZinc', Blue: 'colorBlue', 'Sky Blue': 'colorSkyBlue', Brown: 'colorBrown', White: 'colorWhite',

  // desc.indexOf('ดำ') alone would also match "ดำเนินการ" ("operations/processing"), an unrelated
  // business term that happens to contain ดำ as a substring — Thai script has no spaces between
  // words, so a short 1-2 character color root can't be matched with a word-boundary regex the way
  // 'black' could in English. Stripped out before matching rather than dropping the bare-ดำ fallback
  // entirely, since it correctly catches over 1,100 real black-colored line items (external audit
  // #17) and this specific false positive was the only one found checking directly against real data.
  const COLOR_FALSE_POSITIVES = ['ดำเนินการ'];
  function colorOf(desc) {

  // Verified against the real 9-month dataset (2026-09-19): the old exact-match regexes
  // (`^0\.\d{1,2}$`) required the ENTIRE slash-delimited segment to be nothing but the number —
  // but real segments routinely carry a trailing suffix right after it, e.g. "0.30(มอก.)" (a TIS/มอก.
  // compliance mark) or "0.30 Zacs" (a coating/brand name). Those silently failed to match at all,
  // misclassifying real coil-shaped Roof Sheeting line items as non-coil. Confirmed impact: ~46% of
  // all Roof Sheeting revenue (฿13.2M of ฿28.7M, 5,558 line items) was falling through to "no
  // thickness detected" for exactly this reason. Now extracts the leading number and allows (does
  // not require) anything after it, as long as the number itself isn't followed by another digit
  // (so "0.301" isn't mis-truncated to "0.30").
  // BUG FIX (external audit #5, 2026-09-23): removed the second fallback loop, which matched ANY
  // slash-delimited "N.NN" segment under 2 as a thickness whenever no clean "0.NN" segment existed.
  // Verified against the real data this loop only ever fires on non-product lines — cut-length/roll-

  // thickness: every one of the 208 real line items this loop matched was a false positive (0/208
  // correct). Downstream, a wrong thickness here fed `metersToCoilWeight()` a value up to 5x the
  // real ~0.30mm gauge (500% tonnage overstatement) and pulled fee/off-grade lines into the Coil

  // thickness has ever needed this fallback — the first loop's "0.NN" pattern already covers every
  // real gauge in the dataset (verified at 99.76% Roof Sheeting match coverage, ver4→ver5).
  function thicknessOf(desc) {

  }

  function t(key) { return (I18N[STATE.lang] || I18N.en)[key] || (I18N.en[key] || key); }

  /* ============================== UTIL ============================== */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtBaht(n) { return '฿' + Math.round(n || 0).toLocaleString('en-US'); }
  function fmtBahtCompact(n) {
    n = n || 0;
    if (n >= 1000000) return '฿' + (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return '฿' + (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return '฿' + Math.round(n);
  }
  function fmtNum(n) { return Math.round(n || 0).toLocaleString('en-US'); }
  function fmtDateShort(iso) { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString(STATE.lang === 'th' ? 'th-TH' : 'en-GB', { day: '2-digit', month: 'short' }); }
  function fmtDateFull(iso) { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString(STATE.lang === 'th' ? 'th-TH' : 'en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  // WCAG relative luminance/contrast — used to pick white-vs-ink text that stays readable
  // when placed directly on top of a slice's own fill color (see renderPieChart's inline % labels).
  function relLuminance(hex) {
    const n = hex.replace('#', '');
    const r = parseInt(n.substr(0, 2), 16) / 255, g = parseInt(n.substr(2, 2), 16) / 255, b = parseInt(n.substr(4, 2), 16) / 255;
    const lin = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }
  function contrastRatio(hex1, hex2) {
    const l1 = relLuminance(hex1), l2 = relLuminance(hex2);
    const hi = Math.max(l1, l2), lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }
  function textOnColor(hex) {
    return contrastRatio(hex, '#ffffff') >= contrastRatio(hex, '#0b0b0b') ? '#ffffff' : '#0b0b0b';
  }
  function debounce(fn, ms) { let tm; return function () { clearTimeout(tm); const a = arguments; tm = setTimeout(() => fn.apply(null, a), ms); }; }

  const CATEGORY_ORDER = ['Roof Sheeting', 'PU/PE Insulation', 'Screws & Fasteners', 'Steel Pipes', 'Wall Cladding', 'Ceiling Panels'];

  function catColor(cat) { return cssVar(CATEGORY_VAR[cat] || '--cat-other'); }
  const SEQ_STOPS = ['--seq-100', '--seq-200', '--seq-300', '--seq-400', '--seq-500', '--seq-600', '--seq-700'];
  function seqColor(t0) {
    t0 = Math.max(0, Math.min(1, t0));
    const idx = Math.round(t0 * (SEQ_STOPS.length - 1));

    invTypeFilter: { cash: true, credit: true, deposits: false },

  /* ============================== AUTH (SIMULATED — see AGENTS.md §3: never present this as real

     page source. It exists to demo role-based viewing, not to protect anything.) ==============================

  const BASE_USERS = [
    { username: 'ceo', password: 'ceo123', role: 'executive', displayName: 'CEO / Executive' },
    { username: 'manager', password: 'manager123', role: 'management', displayName: 'Management' },
  ];
  // Rebuilt after every upload from the real salesperson codes actually present in the data (see
  // handleUpload()) — STATE.session may reference one of these, so it's kept in STATE rather than
  // recomputed from scratch on every login attempt.
  let STATE_salesUsers = [];
  function buildSalesUsers() {
    const codes = new Set();
    STATE.rawInvoices.forEach(inv => { if (inv.salesperson) codes.add(inv.salesperson); });
    STATE_salesUsers = Array.from(codes).sort().map(code => ({
      username: 'sales' + code, password: 'sales123', role: 'sales', salespersonCode: code,
      displayName: t('salesperson') + ' ' + code,

  function allUsers() { return BASE_USERS.concat(STATE_salesUsers); }
  function findUser(username, password) {

    return allUsers().find(x => x.username.toLowerCase() === u && x.password === password) || null;
